<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DPS 강화하기 종합 계산기</title>
<style>
:root{
  --bg:#0e1116; --panel:#161b22; --border:#2a3140; --text:#e6e9ef; --sub:#8b96a8;
  --side:40px; --accent:#5fc9a8; --accent2:#e2b04a; --danger:#e2694a; --mono:'SFMono-Regular',Consolas,monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --bg:#f5f6f8; --panel:#ffffff; --border:#dde1e8; --text:#1b1f27; --sub:#5b6472; }
}
:root[data-theme="dark"]{ --bg:#0e1116; --panel:#161b22; --border:#2a3140; --text:#e6e9ef; --sub:#8b96a8; }
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,'Pretendard',sans-serif;line-height:1.5;}
header{padding:8px var(--side) 0;max-width:calc(1200px + 2*var(--side));margin:0 auto;}
h1{font-size:1.2rem;margin:0 0 2px;font-weight:700;}
header p{margin:0 0 6px;color:var(--sub);font-size:.85rem;}
nav{display:flex;gap:6px;max-width:calc(1200px + 2*var(--side));margin:0 auto;padding:0 var(--side);overflow-x:auto;}
nav button{flex:0 0 auto;padding:8px 12px;background:none;border:1px solid var(--border);border-radius:8px 8px 0 0;color:var(--sub);font-size:.82rem;cursor:pointer;border-bottom:none;}
nav button.active{color:var(--text);background:var(--panel);border-color:var(--accent);}
main{max-width:calc(1200px + 2*var(--side));margin:0 auto;padding:4px var(--side) 12px;}
@media (max-width:600px){ :root{ --side:16px; } }
.card{background:var(--panel);border:1px solid var(--border);border-radius:0 8px 8px 8px;padding:8px 14px 12px;}

/* 2단 분할 레이아웃 */
.split-layout { display: flex; flex-direction: column; gap: 6px; }
.split-left, .split-right { display: flex; flex-direction: column; }
@media (min-width: 800px) {
  .split-layout { flex-direction: row; gap: 24px; }
  .split-left { flex: 1; min-width: 0; }
  .split-right { flex: 1.1; min-width: 0; }
}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-bottom:14px;}
.field{display:flex;flex-direction:column;gap:4px;}
.field.full{grid-column:1/-1;}
label{font-size:.78rem;color:var(--sub);}
input,select{background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:8px 10px;font-size:.9rem;width:100%;}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;}
button.run{background:var(--accent);color:#08130f;border:none;border-radius:6px;padding:10px 16px;font-size:.9rem;font-weight:600;cursor:pointer;}
button.run:hover{opacity:.9;}
button.btn-del{background:var(--danger);color:#fff;border:none;border-radius:4px;padding:6px 8px;font-size:.75rem;cursor:pointer;}
.result{margin-top:8px;border-top:1px solid var(--border);padding-top:8px;}
.summary-box{background:var(--bg);border:1px solid var(--accent);border-radius:8px;padding:12px 14px;margin-bottom:16px;}
table{width:100%;border-collapse:collapse;font-size:.85rem;overflow-x:auto;display:block;}
th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--border);font-family:var(--mono);}
th:first-child,td:first-child{text-align:left;font-family:inherit;}
.stat{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);font-size:.88rem;}
.stat:last-child{border-bottom:none;}
.stat span:last-child{font-family:var(--mono);color:var(--accent2);}
.note{color:var(--sub);font-size:.78rem;margin-top:4px;}
.unit-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}

/* 44~50강 탭: 왼쪽 입력표 ↔ 오른쪽 효율표 줄 맞춤 */
.al{table-layout:fixed;width:100%;border-collapse:collapse;}
.al td,.al th{height:28px;padding:0 4px;box-sizing:border-box;border-bottom:1px solid var(--border);vertical-align:middle;overflow:hidden;}
.al th{text-align:right;font-size:.78rem;} .al th:first-child{text-align:left;}
.al td{font-size:.8rem;} .al .c{text-align:right;color:var(--sub);font-family:var(--mono);font-size:.76rem;white-space:nowrap;overflow:visible;}
.al input{height:26px;padding:0 6px;width:100%;font-size:.85rem;}
.al tr.sp td{height:12px;padding:0;border-bottom:none;border-top:1px dashed var(--border);}
.al .emp{background:var(--border);opacity:.25;}
.al td.eff-empty{background:transparent;opacity:1;}
.al.mx td,.al.mx th{padding:0 3px;}
.al td.rec{text-align:right;font-family:var(--mono);font-size:.78rem;font-weight:700;color:var(--accent);white-space:nowrap;overflow:visible;}
.al th.rec{white-space:nowrap;}
.al3{display:table;table-layout:fixed;width:100%;min-width:900px;}
.al3 th{vertical-align:bottom;line-height:1.3;}
.al3 th,.al3 td{padding-left:4px;padding-right:4px;}
.effname{display:none;} @media (max-width:799px){ .al td.effname,.al th.effname{display:table-cell;width:26%;text-align:left;} }
/* 56~59강 탭 맨 위 3단: 스탯(20%) · 보주 효율표(40%) · 시간당 생산량(40%) */
.q59top{display:grid;grid-template-columns:minmax(0,22fr) minmax(0,46fr) minmax(0,32fr);gap:16px;align-items:start;}
.q59t{display:table;table-layout:fixed;width:100%;border-collapse:collapse;margin-top:4px;}
.q59t th,.q59t td{word-break:keep-all;padding:2px 4px;min-height:28px;font-size:.76rem;border-bottom:1px solid var(--border);vertical-align:middle;overflow:hidden;}
.q59t th{font-size:.7rem;color:var(--sub);font-weight:600;line-height:1.2;text-align:right;vertical-align:bottom;}
.q59t th:first-child{text-align:left;}
.q59t td.n{text-align:left;font-family:inherit;line-height:1.2;}
.q59t td.n small{display:block;color:var(--sub);font-size:.66rem;}
.q59t td.v{font-family:var(--mono);white-space:nowrap;overflow:visible;}
.q59t td.v small{color:var(--sub);font-size:.64rem;}
.q59t input{height:24px;padding:0 4px;font-size:.8rem;text-align:right;}
.q59t td.bar{position:relative;overflow:hidden;}
.q59t td.bar i{position:absolute;left:0;top:3px;bottom:3px;background:var(--accent);opacity:.3;border-radius:2px;}
.q59t td.bar i.best{opacity:.8;}
.q59t td.bar span{position:relative;}
.q59t tr.pg td{height:18px;min-height:0;padding:2px 4px 0;font-size:.68rem;color:var(--accent2);font-weight:600;border-bottom:1px solid var(--border);text-align:left;}
.q59t tr.sp td{height:6px;min-height:0;padding:0;border-bottom:none;border-top:1px dashed var(--border);}
/* 모든 탭 공통: 본문 폭 1300px 고정 (창이 좁으면 화면 전체 가로 스크롤, 넓으면 가운데 정렬). 위(제목·탭·공통입력줄)와 아래 본문을 같은 폭으로 맞춤 */
body{ min-width:calc(1300px + 2*var(--side)); }
header, nav, main{ width:calc(1300px + 2*var(--side)); max-width:none; min-width:0; }
#globalBar{ width:1300px; max-width:none !important; }
.split-layout{ flex-direction:row; gap:24px; }
.split-left, .split-right{ min-width:0; }
body.wide4450 .split-left, body.wide4450 .split-right{ flex:1; overflow:visible !important; }
body.wide4450 .split-left table, body.wide4450 .split-right table{ overflow:visible; }
</style>
</head>
<body>
<header>
  <h1>DPS 강화하기 종합 계산기 <span style="font-size:.7rem;font-weight:400;color:var(--sub)">· 숫자 입력값은 저장됩니다</span></h1>
</header>
<nav id="tabnav"></nav>
<div id="globalBar" class="card" style="margin:0 auto 4px;max-width:1200px;padding:6px 14px;"></div>
<main><div class="card" id="tabhost"></div></main>

<script>
// ===================== 데이터 정의 =====================
function clamp01(x){return Math.max(0,Math.min(1,x));}

// ===================== 배속 (레벨 자릿수로 결정) =====================
// 배속 수치(프레임 길이 ms) = 25 − (일반 레벨 자릿수 + 초월 레벨 자릿수). 2자리 23, 한 자리 늘 때마다 1씩 빨라져 12자리 13(옛 최대 배속).
// 12자리를 넘을 때 더 빨라지는지는 미확인이라 13에서 멈춘다고 둔다. 계산에 곱하는 배수 = 42 ÷ 프레임 길이(스타에디터 게임 속도 기준).
// (방의 배속은 방에서 가장 빠른 사람을 따르지만, 이 계산기는 혼자 하는 값만 쓴다.)
const SPEED_MIN_FRAME = 13;
let exLevel = 1; // 초월 레벨(ExLv), 1~40억. 투자값과 함께 브라우저에 저장
function digitCount(n){ return String(Math.max(1, Math.floor(n) || 1)).length; }
function speedDigits(){ return digitCount(charLevel) + digitCount(exLevel); }
function speedFrame(){ return Math.max(SPEED_MIN_FRAME, 25 - speedDigits()); }
function speedMult(){ return 42 / speedFrame(); }
function setExLevel(v){
  exLevel = Math.max(1, Math.min(4000000000, Math.floor(parseFloat(v)) || 1));
  if(typeof saveInvestmentState === 'function') saveInvestmentState();
  if(typeof refreshEarly === 'function') refreshEarly();
}
// 광산 포인트: 내 포인트로 단계가 정해지고(1점 이상 1단 · 1만 초과 2단 · 9만 초과 4단 … 225만 초과 16단 · 361만 초과 20단),
// 단계만큼 내 51~59강 허수광산 크레딧 「배수」에 곱해진다(0·1단은 ×1, 최대 20단 = ×20). 방 사람들의 포인트는 합치지 않는다. 포인트는 매 프레임 단수만큼 닳는다. 상점에서 ExPoint 1개 = 1점.
// [단, 내 포인트(이상)] — k단 = 10,000 × (k−1)² + 1 이상 (광산_포인트 표)
const MINE_POINT_TABLE = [[0, 0], [1, 1], [2, 10001], [3, 40001], [4, 90001], [5, 160001], [6, 250001], [7, 360001], [8, 490001], [9, 640001], [10, 810001], [11, 1000001], [12, 1210001], [13, 1440001], [14, 1690001], [15, 1960001], [16, 2250001], [17, 2560001], [18, 2890001], [19, 3240001], [20, 3610001]];
function minePointStep(points){
  let step = 0;
  MINE_POINT_TABLE.forEach(r => { if(points >= r[1]) step = r[0]; });
  return step;
}
function minePointTableHTML(){
  const rows = MINE_POINT_TABLE.map(r => { const m = Math.max(1, r[0]); return `<tr><td>${r[0]}단</td><td>${r[1].toLocaleString()}</td><td>×${m}</td><td>${m}</td><td>${(256 * m).toLocaleString()}</td><td>${r[0]}</td></tr>`; }).join('');
  return `<table style="margin-top:8px"><tr><th>광산 단</th><th>내 광산 포인트(이상)</th><th>51~59강 광산 크레딧 배수에 곱함</th><th>51강 배수</th><th>59강 배수</th><th>매 프레임 닳는 포인트</th></tr>${rows}</table>`;
}


const POINTS_PER_LEVEL = 150;

// Page 9 개인 보스 데이터
const BOSS_DATA = [
  // dps = 클리어 목표 DPS(개인보스.csv), scare = LV.MAX 허수아비 무색 조각 비율(개인보스.csv)
  { stage: 1, prob1: 2.0, hunt: 6, atkPercent: 200, expPercent: 0,  credit: 0,   dps: 1300,   scare: 1, note: '' },

// 6~10단계: 41강 이상 유닛으로 공략, 최초 1회 전체 보상 (상시 버프 없음). getBossCumulativeBonus에는 넣지 않는다(hunt가 0으로 덮어쓰이므로).
// credit=1회 크레딧 · shard=1회 무색 조각 · extra=보스 처치 추가 리워드 크레딧 · group=단체 크레딧(방 전원, 판당 1회)
const BOSS_DATA_HIGH = [
  { stage: 6,  dps: 3222,     credit: 10000,  shard: 3,     extra: 50000,  group: 20000, scare: 5 },
  { stage: 7,  dps: 32222,    credit: 30000,  shard: 5,     extra: 60000,  group: 20000, scare: 5 },

  { stage: 10, dps: 15000000, credit: 300000, shard: 0,     extra: 300000, group: 50000, scare: 20 },
];
function bossTableHTML(){
  const n = v => v.toLocaleString();
  const low = BOSS_DATA.map(b => {
    const reward = [b.expPercent ? '추가 EXP +'+b.expPercent+'%' : '', b.credit ? '크레딧 '+n(b.credit) : ''].filter(Boolean).join(' · ') || '-';
    return `<tr><td>${b.stage}단계</td><td>${n(b.dps)}</td><td style="text-align:left;font-family:inherit">+1확률 +${b.prob1.toFixed(1)}%p · 사냥터 +${b.hunt} · 공격력 +${b.atkPercent}%</td><td style="text-align:left;font-family:inherit">${reward}</td><td>-</td><td>${b.scare}</td></tr>`;
  }).join('');
  const high = BOSS_DATA_HIGH.map(b => {
    const reward = '크레딧 '+n(b.credit)+' + 추가 '+n(b.extra)+(b.shard ? ' · 무색 조각 '+n(b.shard) : '');
    return `<tr><td>${b.stage}단계</td><td>${n(b.dps)}</td><td style="text-align:left;font-family:inherit">41강 이상으로 공략</td><td style="text-align:left;font-family:inherit">${reward}</td><td>${n(b.group)}</td><td>${b.scare}</td></tr>`;
  }).join('');
  const mine = `<tr><td>11단계</td><td>-</td><td colspan="4" style="text-align:left">허수광산 — 깨지지 않는다 (보상은 「허수광산_DPS보상」 표 기준)</td></tr>`;
  return `<table><tr><th>개인 보스</th><th>목표 DPS</th><th style="text-align:left">확률/효과</th><th style="text-align:left">1회 보상</th><th>단체 크레딧</th><th>LV.MAX 허수아비 무색 조각 비율</th></tr>${low}${high}${mine}</table>`;
}
function bossCumulativeStatHTML(){
  const c = getBossCumulativeBonus(5);
  return `<div class="stat" style="margin-top:8px"><span>1~5단계 상시 버프 누적(전부 클리어)</span><span>+1확률 +${c.prob1.toFixed(1)}%p · 사냥터 +${c.huntBonus} · 공격력 +${c.atkPercent}% · 추가 EXP +${c.expPercent}%</span></div>`;
}

// 극한(48강): 표의 쿨타임은 4프레임이지만 하이템플러 공속 제한 때문에 5프레임 아래로는 안 빨라져 4.8배(24÷5)로 확정. 초월(49강 3프레임)·무한(50강 1프레임, 2타)은 공속 제한 없이 표 그대로 확정.
const SPD_FRAMES = { '매우느림': 72, '느림': 48, '보통': 24, '빠름': 12, '매우빠름': 6, '극한': 5, '초월': 3, '무한': 1 };

  { lv: 9, spd: '느림', atk: 80, hits: 1, note: '발키리 (실제 1발만 발사, ×2 표기 아님)' },
  { lv: 10, spd: '느림', atk: 250, hits: 1, note: '' },
  { lv: 11, spd: '매우느림', atk: 250, hits: 2, note: '질럿 (250×2타, DPS 500/3 확인)' },

  { lv: 15, spd: '매우느림', atk: 1300, hits: 1, note: '', failExp: 1 },
  { lv: 16, spd: '느림', atk: 1000, hits: 1, note: '', failExp: 2 },

  { lv: 20, spd: '보통', atk: 2000, hits: 1, note: '', failExp: 27 },

  { lv: 22, spd: '보통', atk: 3500, hits: 1, note: '', failExp: 80 },
  { lv: 23, spd: '보통', atk: 5000, hits: 1, note: '', failExp: 160 },
  { lv: 24, spd: '보통', atk: 6500, hits: 1, note: '', failExp: 335 },
  { lv: 25, spd: '빠름', atk: 5000, hits: 1, note: '', failExp: 750 },
  { lv: 26, spd: '보통', atk: 10, hits: 1, note: 'LV.2 사냥터 (기본보상 ×10만)', failExp: 1500 },

const VEND_LADDER_K = [];

function vendLadder(){ return vendMult.on ? VEND_LADDER.concat(VEND_LADDER_K) : VEND_LADDER; }

// 큰 가격 표기: 해·경·조·억·만 중 값이 1 이상이 되는 가장 큰 단위 (예: 5e16 → 5경, 1e19 → 1000경, 1.1e20 → 1.1해)
function fmtPriceKR(n){
  const U = [['극',1e48],['재',1e44],['정',1e40],['간',1e36],['구',1e32],['양',1e28],['자',1e24],['해',1e20],['경',1e16],['조',1e12],['억',1e8],['만',1e4]];
  for(const [l,v] of U){
    if(n >= v){ const x = Math.round(n / v * 100) / 100; return String(x) + l; }
  }
  return Math.round(n).toLocaleString();
}

// 51~56강 생산 계산 입력값: 초월 스탯(5·7쪽) 레벨, 크리스탈 레벨, 인내의 보석 개수, 추천 기준 강 (멀티 보너스는 상단 couponState.multi)
let exCalcState = { inv:{}, cry:{}, pat:0, orbExp:0, lifeCry:0, fus:{ high:0, fate:0, save:0, stat73:0 }, orb:{}, recGoal:58, target:52, targetUser:false };   // orbExp: 경험의 보주 개수 · lifeCry: 생명의 크리스탈 Lv (초월 경험치 배수) · targetUser: 추천 기준 강을 직접 바꾼 적이 있는지
const INVESTMENT_STORAGE_KEY = 'dps-enhancement-calculator-investments-v1';
let investmentStorageWarning = '';

function setInvestmentStorageWarning(message){
  investmentStorageWarning = message;
  const status = document.getElementById('investmentPersistenceStatus');
  if(status){
    status.textContent = message || '스탯·고유유닛 투자값은 이 브라우저에 자동 저장됩니다.';
    status.style.color = message ? 'var(--danger)' : 'var(--sub)';
  }
}

function loadInvestmentState(){
  let saved;
  try {
    const serialized = localStorage.getItem(INVESTMENT_STORAGE_KEY);
    if(!serialized) return;
    saved = JSON.parse(serialized);
  } catch(error) {
    console.error('저장된 투자값을 불러오지 못했습니다.', error);
    setInvestmentStorageWarning('저장된 투자값을 불러오지 못했습니다. 브라우저 저장소 설정을 확인하세요.');
    return;
  }

  if(!saved || typeof saved !== 'object' || Array.isArray(saved)){
    setInvestmentStorageWarning('저장된 투자값 형식이 올바르지 않아 기본값으로 시작했습니다.');
    return;
  }
  const storedStats = saved.statInvestments;
  if(storedStats && typeof storedStats === 'object' && !Array.isArray(storedStats)){
    STAT_OPTIONS.forEach(option=>{
      const key = `${option.page}_${option.no}`;
      const value = Number(storedStats[key]);
      if(Number.isFinite(value)) statInvestments[key] = Math.max(0, Math.min(option.max, value));
    });
  }
  if(Number.isFinite(Number(saved.gameHours)) && Number(saved.gameHours) >= 0) gameHours = Math.min(GAME_HOURS_CAP + 59 / 60, Math.round(Number(saved.gameHours) * 60) / 60);
  if(Number.isFinite(Number(saved.minePoints)) && Number(saved.minePoints) >= 0) minePoints = Math.floor(Number(saved.minePoints));
  if(Number.isFinite(Number(saved.specExPoint)) && Number(saved.specExPoint) >= 0) specExPoint = Math.floor(Number(saved.specExPoint));
  if(saved.quasarStat && typeof saved.quasarStat === 'object'){ Object.keys(Q_STAT_MAX).forEach(k => { const v = Number(saved.quasarStat[k]); if(Number.isFinite(v) && v >= 0) quasarStat[k] = Math.min(Q_STAT_MAX[k], v); }); }
  [['quasarLevels', quasarLevels], ['originLevels', originLevels]].forEach(([name, dst]) => { const src = saved[name]; if(src && typeof src === 'object') Object.keys(src).forEach(k => { const v = Number(src[k]); if(Number.isFinite(v) && v >= 0) dst[k] = v; }); });
  if(saved.curAtk && typeof saved.curAtk === 'object') for(let lv = 44; lv <= 50; lv++){ const v = Number(saved.curAtk[lv]); if(Number.isFinite(v) && v > 0) curAtk4450[lv] = v; }
  const sx = saved.exCalc;
  if(sx && typeof sx === 'object'){
    ['inv','cry'].forEach(g=>{
      if(sx[g] && typeof sx[g] === 'object') Object.keys(sx[g]).forEach(k=>{ const v = Number(sx[g][k]); if(Number.isFinite(v) && v >= 0) exCalcState[g][k] = v; });
    });
    if(Number.isFinite(Number(sx.pat)) && Number(sx.pat) >= 0) exCalcState.pat = Number(sx.pat);
    if(Number.isFinite(Number(sx.orbExp)) && Number(sx.orbExp) >= 0) exCalcState.orbExp = Math.min(1000, Number(sx.orbExp));
    if(Number.isFinite(Number(sx.lifeCry)) && Number(sx.lifeCry) >= 0) exCalcState.lifeCry = Math.min(30, Number(sx.lifeCry));
    if(sx.fus && typeof sx.fus === 'object') ['high','fate','save','stat73'].forEach(k => { const v = Number(sx.fus[k]); if(Number.isFinite(v) && v >= 0) exCalcState.fus[k] = v; });
    if(sx.orb && typeof sx.orb === 'object') Object.keys(sx.orb).forEach(k => { const v = Number(sx.orb[k]); if(Number.isFinite(v) && v >= 0) exCalcState.orb[k] = v; });   // 57~59강 보주 (특급·고급·성운·천운·무위·힘·지위·권력·신위)
    if([57,58,59,60].includes(Number(sx.recGoal))) exCalcState.recGoal = Number(sx.recGoal);
    if(sx.targetUser && [52,53,54,55,56].includes(Number(sx.target))){ exCalcState.targetUser = true; exCalcState.target = Number(sx.target); }
  }
  const storedEx = Number(saved.exLevel);
  if(Number.isFinite(storedEx)) exLevel = Math.max(1, Math.min(4000000000, Math.floor(storedEx)));
  const storedAwaken = Number(saved.awakenLevel);
  if(Number.isFinite(storedAwaken)) awakenLevel = Math.max(0, Math.min(4000000000 - 106, Math.floor(storedAwaken)));
  const storedTrue = Number(saved.trueAwakenLevel);
  if(Number.isFinite(storedTrue)) trueAwakenLevel = Math.max(0, Math.min(4000000000, Math.floor(storedTrue)));
  const storedRace = saved.raceInvestments;
  if(storedRace && typeof storedRace === 'object' && !Array.isArray(storedRace)){
    RACE_OPTIONS.forEach(option=>{
      const value = Number(storedRace[option.key]);
      if(Number.isFinite(value)) raceInvestments[option.key] = Math.max(0, Math.min(option.max, Math.round(value)));
    });
  }
}

function saveInvestmentState(){
  try {
    localStorage.setItem(INVESTMENT_STORAGE_KEY, JSON.stringify({statInvestments, raceInvestments, awakenLevel, trueAwakenLevel, exLevel, gameHours, minePoints, specExPoint, quasarStat, quasarLevels, originLevels, curAtk: curAtk4450, exCalc: exCalcState}));
    if(investmentStorageWarning) setInvestmentStorageWarning('');
  } catch(error) {
    console.error('투자값을 브라우저에 저장하지 못했습니다.', error);
    setInvestmentStorageWarning('투자값을 저장하지 못했습니다. 브라우저 저장소 설정을 확인하세요.');
  }
}

// 고유유닛(레이스) 본체가 사냥터에서 내는 기본 실측 DPS (공업·보스 배수 적용 전).
// Q단계 → 쿨타임 프레임(72/48/24/12/6/3/1), W단계 → 공격력(200+650×W), D 10회 완료 → 사냥터 LV.2 입장(미완료 LV.1).
// 12프레임(빠름)·6프레임(매우빠름)은 일반 유닛과 동일한 실측 배율을 쓰고, 3·1프레임은 49강(3프레임)·50강(1프레임)이 표 그대로 확정이라 같은 24/프레임을 쓴다(고유유닛 자체의 3·1프레임은 직접 측정 전).
function getUniqueUnitHunt(){
  const q = getRaceInv('Q'), w = getRaceInv('W'), d = getRaceInv('D');
  const frames = RACE_OPTIONS[0].steps[Math.min(q, 6)];
  const atk = 200 + w * 650;
  let factor = 24 / frames;
  if (frames === 12) factor = 1.92;
  else if (frames === 6) factor = 4.17;
  // 현재 레벨 1만 이상이면 D와 상관없이 LV.MAX 사냥터로 들어간다
  return { frames, atk, hitRate: factor, baseDps: atk * factor, zone: charLevel >= 10000 ? 'MAX' : (d >= 10 ? 2 : 1) };
}
function getRaceInv(key){ return raceInvestments[key] || 0; }
function setRaceInv(key, val, max){
  raceInvestments[key] = Math.max(0, Math.min(max, Math.round(parseFloat(val)) || 0));
  saveInvestmentState();
  const v = getRaceInv(key);
  const el = document.getElementById(`race_${key}`);
  if(el && parseFloat(el.value) !== v) el.value = v;
  updateRaceTotalUI();
  if(typeof updateRaceBuffSummary==='function') updateRaceBuffSummary();
  if(typeof refreshEarly==='function') refreshEarly();
}
function isRaceMaxed(){ return RACE_OPTIONS.every(o=>getRaceInv(o.key) >= o.max); }
// 고유유닛 단수 = 7옵션 승급 횟수의 합 (최대 106). 106단이면 자동 각성이 가능해져 각성 레벨이 돈 수급에 곱해진다.
const RACE_TOTAL_MAX = RACE_OPTIONS.reduce((a,o)=>a+o.max, 0);
function raceTotal(){ return RACE_OPTIONS.reduce((a,o)=>a+getRaceInv(o.key), 0); }
// 화면에 보이는 단수: 106단(전부 최대)을 넘는 분은 각성 레벨 (107단 = 각성 1레벨)
function unitStepDisplay(){ return isRaceMaxed() ? RACE_TOTAL_MAX + awakenLevel : raceTotal(); }
function effectiveAwakenLevel(){ return isRaceMaxed() ? awakenLevel : 0; }
// 각성 자릿수 보너스 (건의 #13): 자릿수 하나마다 곱연산, 0이면 0자리(보너스 없음). 예: 각성 123 = 3자리 → 일반 경험치 1.331배 · 첫 달성 보상 3.375배.
function levelDigits(n){ n = Math.floor(n) || 0; return n > 0 ? String(n).length : 0; }
function awakenDigits(){ return levelDigits(effectiveAwakenLevel()); }
function awakenExpMult(){ return Math.pow(1.1, awakenDigits()); }          // 일반 경험치 (판매·강화 실패, 툴팁 「EXP 실패」 포함)
function awakenFirstClearMult(){ return Math.pow(1.5, awakenDigits()); }   // 강화 단계 첫 달성 보상 (크레딧·경험치)
function trueAwakenBaseMult(){ return (1000 + trueAwakenLevel) / 1000; }   // 진 각성 본효과: 돈 · 51~59강 기본 데미지 (고유유닛_각성 표)
function trueAwakenDigits(){ return levelDigits(trueAwakenLevel); }
function trueAwakenMult(){ return Math.pow(1.1, trueAwakenDigits()); }     // 진 각성: 초월(Ex) 경험치 · 51강 이상 허수광산 크레딧
function setTrueAwaken(v){
  trueAwakenLevel = Math.max(0, Math.min(4000000000, Math.floor(parseFloat(v)) || 0));
  saveInvestmentState(); updateAwakenDigitUI();
  if(typeof refreshEarly === 'function') refreshEarly();
}
function updateAwakenDigitUI(){
  const el = document.getElementById('gbAwakenDigits'); if(!el) return;
  const a = awakenDigits(), t = trueAwakenDigits(), f = x => (Math.round(x * 1000) / 1000).toLocaleString();
  el.textContent = `각성 ${a}자리: 일반 EXP ×${f(awakenExpMult())} · 첫 달성 ×${f(awakenFirstClearMult())} / 진 각성 ${t}자리: Ex EXP·51강+ 광산 크레딧 ×${f(trueAwakenMult())}`;
}
function awakenMoneyMult(){ return 1 + 0.1 * effectiveAwakenLevel(); }   // LV.MAX 허수아비·허수광산 돈 증가량: +0.1배/각성레벨 (곱연산, LV.1/LV.2에는 안 붙음 — 게임 안내문)
function updateRaceTotalUI(){
  const t = document.getElementById('gbRaceTotal');
  if(t && document.activeElement !== t) t.value = unitStepDisplay();
  updateAwakenDigitUI();
}
// 106단 이상을 입력하면 7옵션을 전부 최대로 채우고, 106을 넘는 분은 각성 레벨로 본다 (예: 107단 → 각성 1레벨).
// 106 미만은 옵션별 분배를 알 수 없어 Q~X 입력칸의 합으로 되돌린다.
function setRaceTotal(val){
  const n = Math.floor(parseFloat(val)) || 0;
  if(n < RACE_TOTAL_MAX) return;
  RACE_OPTIONS.forEach(o=>{
    raceInvestments[o.key] = o.max;
    const el = document.getElementById(`race_${o.key}`);
    if(el) el.value = o.max;
  });
  awakenLevel = Math.max(0, Math.min(4000000000, n) - RACE_TOTAL_MAX);
  saveInvestmentState();
  updateRaceTotalUI();
  if(typeof updateRaceBuffSummary==='function') updateRaceBuffSummary();
  if(typeof refreshEarly==='function') refreshEarly();
  if(document.getElementById('hourlyGainBox') && typeof render4450Table==='function') render4450Table();
}
function updateRaceBuffSummary(){
  const box = document.getElementById('raceBuffSummary');
  if(!box) return;
  const q = getRaceInv('Q'), w = getRaceInv('W'), e = getRaceInv('E'), a = getRaceInv('A'),
        s = getRaceInv('S'), d = getRaceInv('D'), x = getRaceInv('X');
  const cooldown = RACE_OPTIONS[0].steps[Math.min(q, 6)];
  const damage = 200 + w*650;

  box.innerHTML = `
    <div class="stat"><span>공격속도 (Cooldown)</span><span>${cooldown}</span></div>
    <div class="stat"><span>공격력 (Damage)</span><span>${damage.toLocaleString()}</span></div>
    <div class="stat"><span>판매시 경험치</span><span>+${(e*20)}%</span></div>
    <div class="stat"><span>+1 강화확률</span><span>+${(a*0.25).toFixed(2)}%p</span></div>
    <div class="stat"><span>특수 강화확률</span><span>+${(s*0.5).toFixed(1)}%p</span></div>
    <div class="stat"><span>사냥터 입장</span><span>${zone}</span></div>
    <div class="stat" style="border-bottom:none"><span>특수 파괴방지확률</span><span>+${x}%p</span></div>
    ${isRaceMaxed() ? '<div class="stat" style="border-bottom:none;color:var(--accent)"><span><b>✓ 7옵션 전부 최대 — 각성의 보석 보유 시 자동 각성됩니다</b></span></div>' : ''}
  `;
}

// ===================== 40~50강 강화확률 (신규, 2026-09-26 확인 기준) =====================
// 40~43강 "특수확률" 기본값(%): 여기에 특수강화확률 스텟(1P-6+2P-4)을 더한 뒤 파괴방지 재귀식 적용
const SPECIAL_BASE_PROB_40_43 = { 40: -9, 41: -12, 42: -20, 43: -25 };
// 40~43강 원확률 = 기본값 + 특수강화확률 스텟 + (+1/+2/+3강 강화확률 보너스)
//  +1강 보너스 = 1P-3 + 2P-1 (각 0.1%p/Lv) + 고유유닛 A(0.25%p/회) + 개인보스 누적 +1강확률
//  +2강 보너스 = 1P-4 + 2P-2 (각 0.1%p/Lv),  +3강 보너스 = 1P-5 + 2P-3 (각 0.1%p/Lv)
// g(page,no)로 스텟 투자값을 대체할 수 있어(효율 비교용) 가상의 +1레벨 계산에도 쓴다.
function get40to43Bonus(g){
  g = g || getStatInv;
  return {
    p1: (g(1,3) + g(2,1)) * 0.1 + getRaceInv('A') * 0.25 + getBossCumulativeBonus(maxBossLevel).prob1 + supportEnh().p1,
    p2: (g(1,4) + g(2,2)) * 0.1 + supportEnh().p2,
    p3: (g(1,5) + g(2,3)) * 0.1 + supportEnh().p3,
    special: (g(1,6) + g(2,4)) * 0.1 + getRaceInv('S') * 0.5 + (couponState.spec5 ? 5 : 0) + supportEnh().sp, // 특수확률 +5% 쿠폰(41~44강) + 후원 LV.7 특수 +5%p
  };
}
function getRaw40to43(lv, g){
  const b = get40to43Bonus(g);
  return Math.round((SPECIAL_BASE_PROB_40_43[lv] + b.p1 + b.p2 + b.p3 + b.special + gemGP()) * 1e9) / 1e9; // 소수 오차 제거
}
// 44~48강 "개별확률" 기본값(%)
const INDIVIDUAL_BASE_PROB_44_48 = { 44: 10, 45: 7, 46: 4, 47: 1, 48: 0 };
// 시간 하락: 현실 플레이 시간이 흐르면(게임 시계가 아님 — 2026-10-04 사진: 게임 시계 1:18:46 = 현실 35.6분에 하락 0.059%p) 44~48강 개별확률이 시간당 0.1%p씩 떨어진다. 하락 방어 시간(후원 특전 + 크리스탈 등)만큼은 떨어지지 않고,
// 후원 LV.10 이상이거나 우주의 크리스탈을 낀 상태에서는 하락이 아예 없다.
const TIME_DROP_PER_HOUR = 0.1;
function supportAddSum(catName){
  const c = SUPPORT_CATS.find(x => x.name === catName); if(!c) return 0;
  return c.rows.filter(r => r[0] <= supportLevel && r[2] === 'a').reduce((a, r) => a + r[3], 0);
}
// 크리스탈 효과 — [50~56강] 탭에 입력한 크리스탈 강 수(exCalcState.cry)를 그대로 쓴다. 키: 방어 c1 · 행운 c2 · 홍색 c9 · 파랑 c13 · 보라 c15 · 흑색 heuksaek · 백색 c19 · 우주 uju
function cryLv(key){ return Math.max(0, Number(exCalcState.cry && exCalcState.cry[key]) || 0); }
// 하락 방어 시간: 방어·홍색·파랑 24시간/Lv, 흑색 60시간/Lv (크리스탈.csv)
function crystalDropDefendHours(){ return 24 * (cryLv('c1') + cryLv('c9') + cryLv('c13')) + 60 * cryLv('heuksaek'); }
// 44~48강 개별확률 +%p (더하기 — 2026-10-04 사용자 확인): 행운·홍색·보라 +1%p/Lv, 백색 +2%p/Lv, 우주 +5%p/Lv. 51강 이상 단계 확률에는 붙지 않는다(사용자 확인).
function crystalIndividualAdd(){ return cryLv('c2') + cryLv('c9') + cryLv('c15') + 2 * cryLv('c19') + 5 * cryLv('uju'); }
// 크리스탈 수치는 별다른 표기가 없으면 전부 덧셈(사용자 확인 2026-10-04). 값은 계산기에 등록된 크리스탈 표(CRYSTAL_SHEET = 크리스탈.csv)와 같다.
//  · 파괴방지: 보호·노랑·남색 +0.2%p/Lv, 백색 +0.3%p/Lv, 우주 +0.5%p/Lv
//  · 무색 조각 획득량(%): 총명·주황·하늘색 50%/Lv, 흑색 100%/Lv, 우주 200%/Lv
//  · 각성의 보석 획득량(%): 각성·노랑·하늘색 100%/Lv, 흑색 200%/Lv, 우주 min(500×Lv, 15,000) + 10,000×max(0, Lv−20) (500% 항은 15,000%에서 멈춤 — 크리스탈 표 README)
//  · 창조(오리진)는 「최종 획득량 +10%/Lv」이라 후원 최종 배수처럼 곱한다(초월 경험치와 같은 가정, 인게임 미확인 — 인수인계 T4)
function crystalPabang(){ return 0.2 * (cryLv('c7') + cryLv('c11') + cryLv('c14')) + 0.3 * cryLv('c19') + 0.5 * cryLv('uju'); }
function crystalShardPct(){ return 50 * (cryLv('c6') + cryLv('c10') + cryLv('c16')) + 100 * cryLv('heuksaek') + 200 * cryLv('uju'); }
function crystalAwakenPct(){ const u = cryLv('uju'); return 100 * (cryLv('c8') + cryLv('c11') + cryLv('c16')) + 200 * cryLv('heuksaek') + Math.min(500 * u, 15000) + 10000 * Math.max(0, u - 20); }
function dropDefendHours(){ return supportAddSum('하락 방어 시간') + crystalDropDefendHours(); }

function applyDestructionPrevention(rawPercent, pabangPercent){
  const raw = clamp01(rawPercent / 100);
  const pb = clamp01(pabangPercent / 100);
  if (raw <= 0) return 0;
  const denom = 1 - (1 - raw) * pb;
  if (denom <= 0) return 100;
  return clamp01(raw / denom) * 100;
}

function supportCatSummary(c){
  const on=c.rows.filter(r=>r[0]<=supportLevel);
  if(!on.length) return '—';
  const f=on.filter(r=>r[2]==='f').pop();
  const a=on.filter(r=>r[2]==='a').reduce((x,r)=>x+r[3],0);
  const parts=[];
  if(f) parts.push('×'+f[3]);
  if(on.some(r=>r[2]==='a')) parts.push('+'+a+(c.unit||''));
  if(!parts.length) return on.length+'/'+c.rows.length+'개 적용';
  return parts.join(' · ');
}

// 궁극·초월 보석의 "모든유닛 강화확률"은 1~43강 +1 확률에도 적용된다. 44~50강 생산 계산 중에는 가상 보석(+1개) 값을 넣을 수 있게 override 지원.
let gemProbOverride = null;
function gemGP(){ return gemProbOverride!==null ? gemProbOverride : getGemAggregates({}).globalProbAdd; }
function withGemProb(v, fn){ const o=gemProbOverride; gemProbOverride=v; try{ return fn(); } finally{ gemProbOverride=o; } }
// 적대의 보석: 50강 이하 유닛 기본공격력 개당 +10% — 스텟 공업(1P-2)·보스 공격력과 "곱연산" (100개 = ×11). 허수광산에는 붙지 않음(패치), 허수아비·개인보스에는 적용
let hostileGemOverride = null;
function hostileMult(){ return 1 + 0.1*(hostileGemOverride===null ? getGemInv('hostile') : hostileGemOverride); }
function withHostileGem(v, fn){ const o=hostileGemOverride; hostileGemOverride=v; try{ return fn(); } finally{ hostileGemOverride=o; } }
// 후원 특전 "판매·강화 실패 경험치 최종 N배" (윗단계 값으로 덮어씀)
let supportLevel = 0;
function supportExpFinal(){ const t=[[20,20],[16,15],[13,10],[10,7],[7,5],[4,3],[1,2]]; for(const [l,m] of t) if(supportLevel>=l) return m; return 1; }
// 경험치 배율: (합산 묶음) × 쿠폰·핫타임 × 후원 최종배수 × 숙련의 보석(개당 ×1.1) × 각성 자릿수. 유닛 툴팁 「EXP 실패」도 이 배수까지 곱한 실제 받는 값이다.
// 일반 경험치 실제 배율 — 1~44강 탭과 같은 합산 묶음(보스·고유유닛 E·경험의 보석·1000레벨 미만) × 쿠폰·후원 최종 × 숙련 × 각성 자릿수
function genExpReal(){ const b = getBossCumulativeBonus(maxBossLevel); return expMultiplierParts(1 + b.expPercent / 100 + getRaceInv('E') * 20 / 100 + getGemInv('exp') * 10 / 100 + (charLevel < 1000 ? 1 : 0)).real; }
// (건의 #27·#28): 45~60강 판매(뽑기, 마리당 — 60강은 배율 안 곱함)와 45~59강 강화 실패(파괴될 때만, 하락하는 54·55강은 없음)도 44강과 같은 일반 경험치.
// 판매 = 44강 판매 경험치(표값 8억 × 10), 실패 = 44강 실패 경험치(표값 8억), 핫타임·쿠폰 배수도 같다. 일반 레벨 만렙이면 경험치만 없음
const EXP44_TABLE = 800000000;
function hiSaleGenExp(){ return charLevel >= EXP_MAX_LV ? 0 : EXP44_TABLE * 10 * genExpReal(); }
function hiFailGenExp(){ return charLevel >= EXP_MAX_LV ? 0 : EXP44_TABLE * genExpReal(); }
function expMultiplierParts(addPart){ const base = addPart * couponMult() * supportExpFinal(), real = base * Math.pow(1.1, getGemInv('mastery')) * awakenExpMult(); return { disp: real, real, base }; }   // 각성 자릿수 ×1.1ⁿ (툴팁 「EXP 실패」에도 들어감)
// 44~50강 탭 좌측 입력표/우측 효율표가 공유하는 스텟 행 순서: 허수아비(1P-1) - 파방1(2P-5) - 파방2(2P-6) - 44강 확률~자판기 촉진량(3P-1~6)
const STAT_ROWS_4450 = [[1,1],[2,5],[2,6],[3,1],[3,2],[3,3],[3,4],[3,5],[3,6],[4,1]];
const STAT_ROW_LABEL = { '1_1':'허수아비', '2_5':'파방1', '2_6':'파방2', '4_1':'허수아비 무조' };
let gemCostOverride = {};
function parseKR(s){ s=String(s).replace(/[,\s원]/g,''); let t=0; (s.match(/\d+(?:\.\d+)?(?:경|조|억|만)?/g)||[]).forEach(x=>{const r=x.match(/(\d+(?:\.\d+)?)(경|조|억|만)?/); t+=parseFloat(r[1])*({'경':1e16,'조':1e12,'억':1e8,'만':1e4}[r[2]]||1);}); return t; }
// 1만 미만은 숫자 그대로, 이후 만→억→조→경 순으로 자리마다 붙여 표기 (조 이상: 조·억·만, 경 이상: 경·조·억·만)
function fmtKR(n){ n=Math.round(n); if(n<1e4) return String(n); let b=BigInt(n), s=''; [[10n**16n,'경'],[10n**12n,'조'],[10n**8n,'억'],[10n**4n,'만']].forEach(([v,l])=>{const q=b/v; if(q>0n){s+=q.toString()+l; b-=q*v;}}); return s; }
function gemCost(g){ const o=gemCostOverride[g.key]; return o>0 ? o : g.cost(getGemInv(g.key)); }

let gemInvestments = {};
function getGemInv(key){ return gemInvestments[key] || 0; }
function setGemInv(key, val, max){ gemInvestments[key] = Math.max(0, Math.min(max, parseFloat(val) || 0)); }
// [44~50강] 총 무색조각(무조) 입력값·추천 기준 단계. 총 무조는 브라우저에 저장한다.

// 큰 수를 float 잡음 없이 정수 문자열로: 유효숫자 15자리까지만 쓰고 나머지는 0
function plainDigits(n){
  n = Math.round(n); if(!(n>0)) return '0';
  if(n < 1e15) return String(n);
  const [m,e] = n.toExponential(14).split('e');
  return m.replace('.','') + '0'.repeat(parseInt(e)-14);
}
function fmtDigits(n){ return plainDigits(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
// 추천 기준 강(보석/스텟)과 시간당 획득의 판매 강: 기본 45강, 브라우저에 저장

// 보석 투자 전체를 훑어 생산량 계산에 필요한 값들을 합산
function getGemAggregates(gemOverride){
  gemOverride = gemOverride || {};
  const inv = key => (gemOverride[key] !== undefined) ? gemOverride[key] : getGemInv(key);
  const agg = {
    individualBonus: {44:0,45:0,46:0,47:0,48:0},
    lvmaxMultPercent: 0, pabangAdd: 0, globalProbAdd: 0, globalProbByLv: {44:0,45:0,46:0,47:0,48:0},
    vendSpeedMult: {1:1, 2:1}, vendFinalMult: 1, miningSpeedAdd: 0, miningCapMult: 0, expAddPercent: 0,
  };
  GEM_OPTIONS.forEach(g=>{
    const n = inv(g.key);
    if(n<=0) return;
    const e = g.effect;
    if(e.type==='individual') agg.individualBonus[e.level] += n*e.perUnit;
    else if(e.type==='lvmaxMult') agg.lvmaxMultPercent += n*e.perUnit;
    else if(e.type==='pabang') agg.pabangAdd += n*e.perUnit;
    else if(e.type==='globalProb'){ agg.globalProbAdd += n*e.perUnit; [44,45,46,47,48].forEach(L=>{ if(L<=(e.maxLv||48)) agg.globalProbByLv[L] += n*e.perUnit; }); }
    else if(e.type==='vendBoth'){ agg.vendSpeedMult[1] += n*e.perUnit; agg.vendSpeedMult[2] += n*e.perUnit; }
    else if(e.type==='vendFinal') agg.vendFinalMult += Math.min(n, g.max) * e.perUnit;   // 촉진의 보석: 최종 유닛 생산량(촉진 합계에 마지막으로 곱)
    else if(e.type==='vendSpeedAdd') agg.vendSpeedMult[e.vend] += n*e.perUnit;
    else if(e.type==='miningSpeedMult') agg.miningSpeedAdd += n*e.perUnit;
    else if(e.type==='miningCapMult') agg.miningCapMult += n*e.perUnit;
    else if(e.type==='expAdd') agg.expAddPercent += n*e.perUnit;
  });
  // 크리스탈 「모든 개별확률 +n%」 — 44~48강 개별확률에만 더한다 (globalProbAdd는 건드리지 않아 1~43강 계산은 그대로)
  const cIndiv = crystalIndividualAdd();
  if(cIndiv > 0) [44,45,46,47,48].forEach(L => { agg.globalProbByLv[L] += cIndiv; });
  return agg;
}

// 44~50강 시간당 생산량 시뮬레이션. gemOverride로 보석 1개만 가상으로 더해볼 수 있다.
function computeGemProduction4449(gemOverride, pipeCache){
  const overrides = gemOverride || {};
  const gemAgg = getGemAggregates(overrides);
  const pabang = getPabangTotal({ gem: gemAgg.pabangAdd });   // 가상 보석(gemOverride) 반영
  const hostileCount = overrides.hostile !== undefined ? overrides.hostile : getGemInv('hostile');

  // 44강 도달량 = [1강~44강] 탭 계산(사냥터·스텟·보스·레이스 → 돈 → 자판기 → 1~43강 강화)을 그대로 연동.
  // 재물 보석은 LV.MAX 돈 수급에, 촉진 보석은 44강 도달 결과에 반영한다.
  const boost = 1 + VENDING_DATA.perStatLevel*getStatInv(3,6); // 촉진값의 3P-6 몫 (보석은 최종 배수로 따로 — gemAgg.vendFinalMult)
  // pipeCache: 스텟·사냥터가 고정인 최적화 루프에서 같은 (확률·촉진·재물) 조합의 1~44강 계산을 재사용한다
  const pipeKey = pipeCache ? gemAgg.globalProbAdd + '|' + boost + '|' + gemAgg.vendFinalMult + '|' + gemAgg.lvmaxMultPercent + '|' + hostileCount + '|' + gemAgg.pabangAdd : null;
  let pc = pipeCache ? pipeCache[pipeKey] : undefined;
  if(pc === undefined){
    const pipe = withGemProb(gemAgg.globalProbAdd, ()=>withGemPabang(gemAgg.pabangAdd, ()=>withVendBoost(boost, ()=>withVendGem(gemAgg.vendFinalMult, ()=>withHostileGem(hostileCount, ()=>computeProductionN44Details({ _wealth: 1 + gemAgg.lvmaxMultPercent/100 }))))));
    // 촉진은 자판기 생산 속도([2])에 이미 반영됨. 자판기가 45·46강을 바로 투입하는 분(feedHi)도 같이 받는다.
    const fh = pipe.feedHi || {};   // 자판기가 41강 이상을 바로 투입하는 분 (49강 이하는 이 사슬, 51~54강은 feedEx로 [50~56강] 계산에)
    pc = { f44: pipe.N[44] || 0, h45: fh[45] || 0, h46: fh[46] || 0, h47: fh[47] || 0, h48: fh[48] || 0, h49: fh[49] || 0, x51: fh[51] || 0, x52: fh[52] || 0, x53: fh[53] || 0, x54: fh[54] || 0 };
    if(pipeCache) pipeCache[pipeKey] = pc;
  }
  const feedPerHour44 = pc.f44;

  const N = {44: feedPerHour44, 45: pc.h45, 46: pc.h46, 47: pc.h47, 48: pc.h48, 49: pc.h49, 50:0};
  [44,45,46,47,48].forEach(lv=>{
    if(N[lv] <= 0) return;
    // 특수강화확률(specialProb)은 40~43강에만 적용되므로 44~48강 개별확률에는 더하지 않는다.
    const rawTotal = getRawIndividualProb44to48(lv, gemAgg);
    const eff = applyDestructionPrevention(rawTotal, pabang);
    N[lv+1] += N[lv] * (eff/100);
  });
  N[50] = N[49] * applyDestructionPrevention(FIXED_PROB_49, pabang) / 100;

  return { N, gemAgg, pabang, feedPerHour44, feedEx: { 51: pc.x51, 52: pc.x52, 53: pc.x53, 54: pc.x54 } };   // feedEx: 자판기가 51~54강을 바로 투입하는 분(시간당)
}

// 플레이 시간(현실) 입력: ( )시 ( )분, 시간은 999까지, 분은 59까지. 입력칸은 상한을 넘기면 바로 상한으로 맞춘다.
function setGameTime(){

// ===================== 45~50강 판매 최적 세팅 =====================
// 현재 스텟(고정)과 총 무조(없으면 지금까지 투자한 보석 총액)로, 보석을 0부터 전부 다시 배분해
// "S강에서 판매"할 때의 시간당 S강 도달 개수(=판매 개수)가 최대가 되게 한다. S = 45~50 각각 계산해 시간당 무조가 가장 큰 S를 고른다.
// 한 번에 한 보석을 (살 수 있는 수량의 약 10%씩) 사 나가며, 증가량÷비용이 가장 큰 보석부터 고른다.
const OPT_SALE_LEVELS = [45,46,47,48,49,50];
let optSetupResults = null, optSetupSel = null, optSetupBudget = 0, optSetupBudgetNote = '';
function gemStageRaw(L, agg){
  const st = INDIVIDUAL_STAT_44_48[L];
  return INDIVIDUAL_BASE_PROB_44_48[L] + getStatInv(st.page, st.no) * st.perLevel + agg.individualBonus[L] + agg.globalProbByLv[L] - individualTimeDrop();
}
// 44~(S-1)강 원확률 중 가장 낮은 값: S강 생산량이 0일 때 "막힌 단계를 푸는" 방향을 정하는 보조 점수
function gemBottleneck(gemMap, S){
  const agg = getGemAggregates(gemMap); let m = Infinity;
  for(let L=44; L<=Math.min(S-1,48); L++) m = Math.min(m, gemStageRaw(L, agg));
  return m;
}
// 스텟 레벨(statLv: {'3_5': 레벨} 형태, 일부만 줘도 됨)을 잠깐 바꿔 L강 원확률(0으로 자르기 전, 시간 하락 포함)을 구한다
function rawStageAt(L, gemMap, statLv){
  statLv = statLv || {};
  const keys = Object.keys(statLv), saved = {};
  keys.forEach(k=>{ saved[k] = statInvestments[k]; statInvestments[k] = statLv[k]; });
  try { return gemStageRaw(L, getGemAggregates(gemMap || {})); }
  finally { keys.forEach(k=>{ if(saved[k]===undefined) delete statInvestments[k]; else statInvestments[k] = saved[k]; }); }
}
// S강 도달(N[S])이 0일 때 길을 막고 있는 단계: 유닛이 도달하는데(N>0) 원확률이 0 이하라 못 넘기는 단계 중 가장 높은 것.
// (원확률이 0 이하면 유효확률이 0이라, 스텟·보석을 1개 올려도 도달 증가량이 0으로 계산돼 추천이 막힌다)
function blockedStage(N, S, gemMap, statLv){
  if((N[S] || 0) > 0) return null;
  for(let L=Math.min(S-1,48); L>=44; L--){
    if((N[L] || 0) > 0 && rawStageAt(L, gemMap, statLv) <= 0) return L;
  }
  return null;
}
function isSaleProductionGem(g){ return !['expAdd','none'].includes(g.effect.type) || g.key==='hostile'; }
function optimizeGemsForSale(S, budget, cache, deadline){
  const cands = GEM_OPTIONS.filter(isSaleProductionGem);
  const cur = {}; cands.forEach(g=>{ cur[g.key] = 0; });
  const evalN = gm => computeGemProduction4449(gm, cache).N[S] || 0;
  let left = budget, curN = evalN(cur), curB = gemBottleneck(cur, S), iters = 0;
  for(; iters<1500 && performance.now()<deadline; iters++){
    let best = null;
    for(const g of cands){
      const n = cur[g.key]; if(n >= g.max) continue;
      const c = g.cost(n); if(!(c>0) || c>left) continue;
      const trial = {...cur, [g.key]: n+1};

      if(sc > 0 && (!best || sc > best.sc)) best = {g, n, sc};
    }
    if(!best) break;

    for(let i=best.n; i<best.g.max; i++){ const c = best.g.cost(i); if(tot + c > left) break; tot += c; m++; }
    const q = Math.max(1, Math.floor(m/10));
    let spend = 0; for(let i=0;i<q;i++) spend += best.g.cost(best.n + i);
    cur[best.g.key] += q; left -= spend;

  const r = computeGemProduction4449(cur, cache);
  const ex = gachaUnitExpectation(S), N = r.N[S] || 0;

const TIER_U=[1000,2233,3862,6211,9990,16995,32795,80232,301743,2544122];
const TIER_V=[1000,3333,8750,18571,35000,62000,107500,190000,365000,910000];
const PROMOTE_COST=1000000;

function cycleCost(vaccineFrom,guarFrom){
  let cost=0;
  for(let t=1;t<=10;t++) cost += t<=vaccineFrom ? TIER_U[t-1] : TIER_V[t-1];
  const at=t=>t<=vaccineFrom?TIER_U[t-1]:TIER_V[t-1];
  if(guarFrom===7) cost-=at(8)+at(9)+at(10);
  else if(guarFrom===8) cost-=at(9)+at(10);
  else if(guarFrom===9) cost-=at(10);
  return cost;
}

function cumulativeExp(L){
  const base = 3 * Math.pow(L, 2) - 3 * L + 10;
  if(L <= 50000) return base;
  const x = L - 50000;
  return base + Math.pow(x, 4) / 240 + Math.pow(x, 3) / 15 + 11 * x * x / 60 - 2 * x / 3;
}

// 공속별 실측 배율: 빠름·매우빠름은 24/frames 이론값 대신 실측으로 확인된 배율을 직접 사용
function getUnitPracticalDps(u) {
  const totalAtk = u.atk * u.hits;
  if (u.spd === '빠름') return totalAtk * 1.92;
  if (u.spd === '매우빠름') return totalAtk * 4.17;
  const frames = SPD_FRAMES[u.spd] || 24;
  return totalAtk * (24 / frames);
}

function formatHourlyProduction(value) {
  if (value === 0) return '0';
  const magnitude = Math.abs(value);
  if (magnitude < 0.000001) return value.toExponential(4);
  const decimals = magnitude < 0.1 ? 7
    : magnitude < 1 ? 5
      : magnitude < 10 ? 3
        : magnitude < 100 ? 2 : 1;
  return value.toLocaleString(undefined, { maximumFractionDigits: decimals });
}

function formatMatrixNumber(value){
  if(value===0) return '0';
  const m = Math.abs(value);
  if(m < 0.0001 || m >= 10000) return value.toExponential(1);
  return (m>=1 ? value.toFixed(3) : value.toFixed(4)).replace(/0+$/,'').replace(/\.$/,'');
}

// 「허수아비_돈」 표: LV.1·LV.2 허수아비 구간 배수는 구간 0~7(×1~×128)까지만 적혀 있다. 표 끝(LV.1 500만 · LV.2 1천만) 위에서 더 오르는지는 게임에서 확인 전이라
// 표대로 ×128에서 멈추게 두었다. 더 오른다고 확인되면 SCARE_TIER_CAP = false (예전 방식: 문턱이 계속 이어짐).
const SCARE_TIER_CAP = true;
function dpsMultThresholds(dps){
  const thresholds=[100,1000,10000,100000];
  let cur=100000, toggle=5;
  while(thresholds[thresholds.length-1] <= dps){
    cur = cur*toggle;
    thresholds.push(cur);
    toggle = toggle===5?2:5;
  }
  return SCARE_TIER_CAP ? thresholds.slice(0, 7) : thresholds;   // LV.1: 100 · 1천 · 1만 · 10만 · 50만 · 100만 · 500만
}

function getDpsMultiplierInfo(dps) {
  if (dps < 100) return { mult: 1, next: 100 };
  const thresholds = dpsMultThresholds(dps);
  const n = thresholds.filter(t => dps >= t).length;
  const mult = Math.pow(2, n);
  const next = thresholds[n] === undefined ? null : thresholds[n];   // null = 표의 마지막 구간
  return { mult, next };
}

// LV.2 전용 배수 구간표: 10만 → 100만(×10) → 500만(×5) → 1000만(×2) → 1억(×10) → 5억(×5) → 10억(×2) ... (10-5-2 반복)
// LV.1(dpsMultThresholds/getDpsMultiplierInfo)은 기존 그대로 유지하고, LV.2에만 이 보정된 구간을 적용한다.
function dpsMultThresholdsLv2(dps){
  const thresholds=[100,1000,10000,100000];
  const cycle=[10,5,2];
  let cur=100000, idx=0;
  while(thresholds[thresholds.length-1] <= dps){
    cur = cur*cycle[idx%3];
    thresholds.push(cur);
    idx++;
  }
  return SCARE_TIER_CAP ? thresholds.slice(0, 7) : thresholds;   // LV.2: 100 · 1천 · 1만 · 10만 · 100만 · 500만 · 1천만
}

function getDpsMultiplierInfoLv2(dps) {
  if (dps < 100) return { mult: 1, next: 100 };
  const thresholds = dpsMultThresholdsLv2(dps);
  const n = thresholds.filter(t => dps >= t).length;
  const mult = Math.pow(2, n);
  const next = thresholds[n] === undefined ? null : thresholds[n];
  return { mult, next };
}

// 자판기(최대 2대) 비용: 레벨 0은 가동 안함
function costOfVendingPair(lvA, lvB){
  const cA = lvA > 0 ? vendPrice(lvA) * vendUnitsPerSec(1) : 0;   // lvA = 자판기 1 (코드 — 묶음이면 총액 × 초당 구매 횟수)
  const cB = lvB > 0 ? vendPrice(lvB) * vendUnitsPerSec(2) : 0;   // lvB = 자판기 2
  return cA + cB;
}

// 자판기 2대를 (0,0=미구매)→(0,1)→(1,1)→(1,L1)→(L1,L1)→(L1,L2)→(L2,L2)→... 순서로 계속 유지 가능한 동안 올려서
// 현재 골드 수급량으로 "완전히" 감당 가능한 가장 높은 조합(best)을 먼저 찾는다.
// 그 다음 단계(nextPair)는 두 조합 중 한 대(1호기 또는 2호기)만 레벨이 바뀌므로(0→1강 포함),
// best를 완전 가동하고 남는 잔여 예산(surplus)으로 그 한 대를 "일부 비율만" 다음 레벨로 섞어 돌린다
// (예: 완전 미구매(0,0)와 1강/1강 사이일 때, 2호기만 잔여 예산 비율만큼 1강을 섞어서 구매 → 나머지 시간은 미구매).
// 이렇게 하면 예산을 100%까지 실제로 소진하면서, 다음 레벨(혹은 0강→1강 진입)은 "가동 가능한 비율만큼만" 생산에 반영된다.
// 0강(미구매) 구간도 동일한 비율 로직으로 다뤄지므로, "1강 한 대조차 못 채우는" 초반 저소득 구간도 자연스럽게 계산된다.
function autoClimbVending(moneyEarnedPerSec){
  const LEVELS = vendLadder().slice();   // 구매 후보 코드(가격순): 낱개 1~46 · 49강 묶음 · 51~54강 낱개 · 53·54강 묶음 (50강 묶음은 각성용이라 뺌)
  let pairs = [[0,0]];
  let lastLo = 0;
  LEVELS.forEach(lv=>{
    pairs.push([lastLo, lv]); // 2호기를 다음 레벨로
    pairs.push([lv, lv]);     // 1호기도 맞춰서 올림
    lastLo = lv;
  });

  const priceOf = lv => vendPrice(lv); // 0(미구매)의 단가는 0 — 묶음이면 한 번 구매 총액

  let bestIdx = 0; // pairs[0]=[0,0](미구매)은 비용 0이라 항상 감당 가능
  for(let i=0;i<pairs.length;i++){
    if(costOfVendingPair(pairs[i][0], pairs[i][1]) <= moneyEarnedPerSec) bestIdx = i;
    else break;
  }
  const best = pairs[bestIdx];
  const bestCost = costOfVendingPair(best[0], best[1]);

  // 다음 단계와 "섞어서" 잔여 예산을 마저 쓰는 비율(mix) 계산 — 0강(미구매)↔1강 전환 구간도 동일하게 적용
  let mix = null; // { idx: 0(1호기)|1(2호기), fromLv, toLv, toRatio(0~1) }
  const nextPair = pairs[bestIdx+1];
  if(nextPair){
    const diffIdx = nextPair[0]!==best[0] ? 0 : 1; // 어느 대가 레벨이 바뀌는지
    const fromLv = best[diffIdx], toLv = nextPair[diffIdx];
    const deltaRatePerSec = vendUnitsPerSec(diffIdx + 1)*(priceOf(toLv) - priceOf(fromLv));
    const surplus = moneyEarnedPerSec - bestCost; // best를 완전 가동하고 남는 돈
    if(deltaRatePerSec>0 && surplus>0){
      const toRatio = Math.min(1, surplus/deltaRatePerSec);
      if(toRatio>0) mix = { idx: diffIdx, fromLv, toLv, toRatio };
    }
  }

  // 실제로 지출되는 비용: best 완전가동 비용 + mix로 추가 지출되는 만큼 (mix가 있으면 거의 항상 income과 일치)
  const actualCost = bestCost + (mix ? mix.toRatio*vendUnitsPerSec(mix.idx + 1)*(priceOf(mix.toLv)-priceOf(mix.fromLv)) : 0);

  return { lvA: best[0], lvB: best[1], cost: bestCost, actualCost, mix };
}

// vendingAuto 결과로부터 실제 투입 스트림을 {강화단계: 초당개수} 형태로 계산 (혼합 가동 반영, 0강/미구매는 제외)
function getVendingFeedStreams(vendingAuto){
  const { lvA, lvB, mix } = vendingAuto;
  const pair = [lvA, lvB];
  const raw = [];
  if(mix){
    const stableIdx = mix.idx===0 ? 1 : 0;
    const Ustable = vendUnitsPerSec(stableIdx + 1), Umix = vendUnitsPerSec(mix.idx + 1);   // 자판기마다 촉진이 다를 수 있다(고유유닛 단수 촉진)
    // rate = 초당 구매 횟수 × 한 번에 들어오는 기수(낱개 1, 묶음 n) — 유닛의 강(vendStage)별로 모은다
    if(pair[stableIdx]>0) raw.push({ lv: vendStage(pair[stableIdx]), rate: Ustable * vendUnitsN(pair[stableIdx]) });
    if(mix.fromLv>0) raw.push({ lv: vendStage(mix.fromLv), rate: Umix*(1-mix.toRatio) * vendUnitsN(mix.fromLv) });
    if(mix.toLv>0) raw.push({ lv: vendStage(mix.toLv), rate: Umix*mix.toRatio * vendUnitsN(mix.toLv) });
  } else {
    if(lvA>0) raw.push({ lv: vendStage(lvA), rate: vendUnitsPerSec(1) * vendUnitsN(lvA) });
    if(lvB>0) raw.push({ lv: vendStage(lvB), rate: vendUnitsPerSec(2) * vendUnitsN(lvB) });
  }
  const merged = {};
  raw.forEach(s=>{ if(s.rate>0) merged[s.lv] = (merged[s.lv]||0) + s.rate; });
  return merged; // {lv: 초당 개수}
}

function prKR(n){
  if(!isFinite(n)) return '-';
  n = Math.round(n);
  if(n < 1e4) return n.toLocaleString();
  let b = BigInt(n); const out = [];
  [[10n ** 28n, '양'], [10n ** 24n, '자'], [10n ** 20n, '해'], [10n ** 16n, '경'], [10n ** 12n, '조'], [10n ** 8n, '억'], [10n ** 4n, '만']].forEach(([v, l]) => { const q = b / v; if(q > 0n){ out.push(q.toString() + l); b -= q * v; } });
  if(b > 0n && out.length < 3) out.push(b.toString());
  return out.slice(0, 3).join(' ');
}
function prDur(sec){
  if(!isFinite(sec)) return '-';

  if(sec < 3600) return Math.floor(sec / 60) + '분 ' + Math.round(sec % 60) + '초';

}

const ORB_MAX = { low:100, mid:100, eon:1000, glut:1000, exp:1000, high:100, fate:2000, save:1500, special:500, premium:1000, nebula:2000, heaven:2000, void:100, power:500, status:500, might:500, divine:1000, mine:100, crit:500 };

}

// 레벨 lv에서의 +1/+2/+3 강화확률(%) 계산: 기준확률 + 스텟/보스 보너스 + 37강 상한 병합 규칙
function getMergedEnhanceProb(lv, statP1, statP2, statP3, bossProb1){
  if(BASE_PROB[lv] === undefined) return {p1:0,p2:0,p3:0};
  const base1 = BASE_PROB[lv]*100;
  const base2 = base1 * 0.1;   // +2강 기준확률 = +1강 기준확률의 1/10
  const base3 = base1 * 0.01;  // +3강 기준확률 = +1강 기준확률의 1/100
  let p1 = base1 + statP1 + bossProb1;
  let p2 = base2 + statP2;
  let p3 = base3 + statP3;

  const p2Valid = (lv+2) <= ENHANCE_MERGE_CEIL;
  const p3Valid = (lv+3) <= ENHANCE_MERGE_CEIL;
  if(!p2Valid){ p1 += p2 + p3; p2 = 0; p3 = 0; }       // +2·+3 → +1로 합산
  else if(!p3Valid){ p2 += p3; p3 = 0; }               // +3 → +2로 합산

  if(p1 + p2 + p3 > 100) p1 = 100 - p2 - p3;
  return {p1,p2,p3};
}

// ===================== 39강 이하 스텟 투자 효율 분석 (순수 계산 함수) =====================
// 화면(DOM)의 "현재 실제 입력값"을 그대로 읽어서 계산하되, invOverride로 특정 스텟 투자값만
// 가상으로 바꿔볼 수 있게 한 함수. [2]에서 계산되는 골드 수급→자판기 자동배정까지 전부 다시
// 반영하므로, 강화확률에 직접 영향이 없는 "보유 유닛 공업"(1P-2) 스텟도 (돈→자판기 단계 변화를
// 통해) 정확히 비교에 포함된다. 41강 이후(LV.MAX 사냥터)는 계산식 자체가 다르므로 이 분석 범위에
// 포함하지 않고, 1~39강 구간의 "시간당 40강 도달 개수(N40)"만을 생산량 지표로 사용한다.
function computeProductionN40(invOverride){
  invOverride = invOverride || {};
  const inv = id => (invOverride[id] !== undefined) ? invOverride[id] : statInvById(id);

  const statAtkUp = inv('inv_1_2');
  const moneyStatMult = 1 + inv('inv_1_1') * 0.01; // 1P-1: 모든 사냥터(LV.1/LV.2/LV.MAX) 돈 수급 +1%/Lv. 각성·재물·폭식은 LV.MAX·허수광산 전용이라 LV.1/LV.2에는 안 붙음(게임 안내문)
  const statP1 = (inv('inv_1_3') + inv('inv_2_1')) * 0.1 + getRaceInv('A') * 0.25 + gemGP() + supportEnh().p1; // 고유유닛 A: +1강확 +0.25%p/회, 후원 LV.7 +3%p
  const statP2 = (inv('inv_1_4') + inv('inv_2_2')) * 0.1 + supportEnh().p2;
  const statP3 = (inv('inv_1_5') + inv('inv_2_3')) * 0.1 + supportEnh().p3;

  // 사냥터별 DPS 풀 + 51~56강 허수광산 돈 — [2] 사냥터 돈 수급 계산기와 같은 함수(고유유닛 포함)
  const { bBonus, dpsLv1, dpsLv2, dpsMax, mineTick } = huntComposition(statAtkUp);
  const infoLv1=getDpsMultiplierInfo(dpsLv1), infoLv2=getDpsMultiplierInfoLv2(dpsLv2);
  // LV.MAX·허수광산은 1P-1 → 재물 → 각성 순으로 곱하며 정수 %로 내린 배수(실측), LV.1/LV.2는 1P-1 × 각성 그대로(재물·폭식 안 붙음)
  // 재물 보석 수: [44~50강] 탭이 넘기는 _wealth = 1 + 보석 수 × 10%에서 복원, 없으면 보유 재물(사냥터 소득 계산기 [2]와 같은 값)
  const wealthGems = (invOverride._wealth !== undefined) ? Math.round((invOverride._wealth - 1) * 10) : getGemInv('wealth');
  const moneyMaxMineMult = moneyPctMult(inv('inv_1_1'), wealthGems, getOrb('glut'), effectiveAwakenLevel(), trueAwakenLevel);
  const moneyPerSec = ((dpsLv1*infoLv1.mult + dpsLv2*infoLv2.mult*100000) * moneyStatMult + (dpsMax*1e10 + mineTick) * moneyMaxMineMult) * speedMult(); // LV.MAX: DPS 배수 보너스 없이 DPS×100억

  // 3P-6(자판기 촉진량) 가상 투자값이 넘어오면, 그 레벨 차이만큼 촉진값(자판기 생산 속도)을 바꿔서 계산한다.
  const _vb36 = (invOverride['inv_3_6'] !== undefined) ? vendBoost() + VENDING_DATA.perStatLevel*(invOverride['inv_3_6'] - getStatInv(3,6)) : null;
  const _runVend = fn => _vb36!==null ? withVendBoost(_vb36, fn) : fn();
  let vendingAuto, feedStreams;
  _runVend(()=>{ vendingAuto = autoClimbVending(moneyPerSec); feedStreams = getVendingFeedStreams(vendingAuto); });

  const N={}; for(let lv=1; lv<=40; lv++) N[lv]=0;
  const feedHi = {}; // 41강 이상 자판기 투입(시간당): 40강 강화 사슬을 거치지 않고 그 단계에 바로 들어간다
  Object.keys(feedStreams).forEach(lvStr=>{
    const lv=parseInt(lvStr);
    if(lv>=1 && lv<=40) N[lv]+=feedStreams[lvStr]*3600;
    else if(lv>=41) feedHi[lv] = (feedHi[lv]||0) + feedStreams[lvStr]*3600;
  });
  const failed={}; for(let lv=1; lv<=40; lv++) failed[lv]=0;
  for(let lv=1; lv<=39; lv++){
    if(N[lv]<=0) continue;
    const {p1,p2,p3}=getMergedEnhanceProb(lv, statP1, statP2, statP3, bBonus.prob1);
    const succRate = (p1+p2+p3)/100;
    failed[lv] = N[lv] * Math.max(0, 1-succRate);
    if(p1>0) N[lv+1]+=N[lv]*(p1/100);
    if(p2>0 && lv+2<=40) N[lv+2]+=N[lv]*(p2/100);
    if(p3>0 && lv+3<=40) N[lv+3]+=N[lv]*(p3/100);
  }
  return { N40:N[40], N, failed, moneyPerSec, vendingAuto, feedHi };
}

// ~39강 효율 후보: 1P-1(모든 사냥터 돈 → 자판기) + 39강 이하 강화확률/공업 스텟
const EARLY_STAT_KEYS = ['1_1','1_2','1_3','1_4','1_5','2_1','2_2','2_3'];
// 40~44강 효율 후보: 공업·돈 수급 스텟과 40~43강 특수 강화 관련 스텟
const LATE_STAT_KEYS = ['1_1','1_2','1_3','1_4','1_5','1_6','2_1','2_2','2_3','2_4','2_5','2_6'];
// 1~44강 탭의 40~44강 효율 순위 그래프 전용: 위 목록 + 3P-6(자판기 촉진량). (44~50강 탭·배분 계산은 기존 LATE_STAT_KEYS 그대로 사용)
const LATE_STAT_KEYS_RANK = LATE_STAT_KEYS.concat(['3_6']);

// 40강 → 44강 생산량과 단계별 확률을 계산한다.
// 현재 단계의 +1 확률이 0이면, 해당 단계의 생산량은 가장 가까운 이전 단계로 표시한다.
function computeProductionN44Details(invOverride){
  invOverride = invOverride || {};
  const base = computeProductionN40(invOverride);
  const g = (p,n) => { const k=`inv_${p}_${n}`; return invOverride[k]!==undefined ? invOverride[k] : getStatInv(p,n); };
  const pabang = getPabangTotal({ g });   // 스텟(가상 투입 포함) + 고유유닛 X + 보석 — 40~43강 파방도 한 함수에서
  const N = { 40: base.N40 };
  const feedHi = base.feedHi || {};
  const prob = {};
  [40,41,42,43].forEach(lv=>{
    const eff = applyDestructionPrevention(getRaw40to43(lv, g), pabang); // 원확률 0% 이하(-0.1 → 0 포함)는 생산 0으로 처리, 0 초과(-0.099 → +0.001 등)부터 표시
    prob[lv] = eff;
    N[lv + 1] = N[lv] * eff / 100 + (feedHi[lv + 1] || 0); // + 자판기가 41강 이상을 바로 투입하는 분
  });
  let displayStage = 44;
  for(let lv=40; lv<=43; lv++){
    if(prob[lv] <= 0){
      displayStage = lv;
      break;
    }
  }
  return { N, prob, displayStage, production: N[44] > 0 ? N[44] : N[displayStage], feedHi };
}
function computeProductionN44(invOverride){
  return computeProductionN44Details(invOverride).production;
}
function computeProductionN40Val(o){ return computeProductionN40(o).N40; }

// 44강 도달이 막혀 있을 때(총 성공확률 0) 비교 기준: 40~43강 중 가장 낮은 원확률(특수확률 최저값)
function computeN44BottleneckRaw(invOverride){
  invOverride = invOverride || {};
  const g = (p,n) => { const k=`inv_${p}_${n}`; return invOverride[k]!==undefined ? invOverride[k] : getStatInv(p,n); };
  const specialProb = (g(1,6) + g(2,4)) * 0.1 + getRaceInv('S') * 0.5;
  return Math.min(...[40,41,42,43].map(lv=>getRaw40to43(lv, g)));
}

function renderEfficiencyList(out, title, baseVal, keys, computeFn, blockedFn){
  const blocked = baseVal<=0 && typeof blockedFn==='function';
  const blockedBase = blocked ? blockedFn({}) : 0;
  if(blocked) keys = keys.filter(k=>k!=='3_6'); // 못 뽑는 상태에선 촉진량(3P-6)은 막힌 단계를 풀지 못하므로 표시 안 함
  const results = keys.map(k=>{
    const [p,n] = k.split('_').map(Number);
    const s = STAT_OPTIONS.find(o=>o.page===p && o.no===n);
    const curLv = getStatInv(p,n);
    const maxed = curLv >= s.max;
    let relPct = 0, gain = 0;
    if(!maxed){
      if(blocked){
        gain = blockedFn({ [`inv_${k}`]: curLv+1 }) - blockedBase;
        relPct = gain;
      } else {
        const v = computeFn({ [`inv_${k}`]: curLv+1 });
        relPct = baseVal>0 ? ((v-baseVal)/baseVal*100) : (v>0 ? Infinity : 0);
      }
    }
    return { key:k, name:`${p}P-${n}. ${s.name}`, maxed, relPct, effPerPoint: maxed ? -Infinity : relPct/s.cost };
  });
  results.sort((a,b)=>b.effPerPoint-a.effPerPoint);
  const finite = results.filter(r=>isFinite(r.effPerPoint) && r.effPerPoint>0).map(r=>r.effPerPoint);
  const maxEff = finite.length ? Math.max(...finite) : 0;
  let rows='';
  results.forEach((r,i)=>{
    const alwaysBar = r.key==='3_6'; // 3P-6(촉진량): 뽑을 수 있는 상태면 증가량이 0이어도 막대 표시
    const hasBar = !r.maxed&&!blocked&&isFinite(r.effPerPoint)&&(alwaysBar || r.effPerPoint>0);
    const barPct = hasBar&&maxEff>0&&r.effPerPoint>0 ? (alwaysBar ? Math.max(4, r.effPerPoint/maxEff*100) : r.effPerPoint/maxEff*100) : (hasBar&&alwaysBar ? 4 : 0);
    const barColor = i===0 ? 'var(--accent)' : 'var(--accent2)';

        <div style="display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:3px">
          <span style="font-weight:${r.effPerPoint===Infinity||(maxEff>0&&r.effPerPoint===maxEff)?'700':'400'}">${i+1}위. ${r.name}${r.maxed?' <span style="color:var(--sub)">(이미 만렙)</span>':''}</span>
        </div>
        <div style="background:var(--border);border-radius:4px;height:10px;overflow:hidden">
          ${hasBar?`<div style="background:${barColor};height:100%;width:${barPct}%;${maxEff>0&&r.effPerPoint===maxEff?'filter:brightness(.78);':''}"></div>`:''}
        </div>
        <div class="note" style="margin-top:2px;margin-bottom:0">
          ${blocked ? `1레벨 추가시 막힌 단계 확률 ${r.maxed?'-':'+'+r.relPct.toFixed(3)+'%p'}` : `1레벨 추가시 생산량 상대 증가 ${r.maxed?'-':(isFinite(r.relPct)?r.relPct.toFixed(3)+'%':'∞')}`}
        </div>
      </div>`;
  });
  out.innerHTML = `
    <div class="stat" style="margin-bottom:10px">
      <span>현재 상태 기준 ${title}</span>
      <span style="font-family:var(--mono)">${formatEfficiencyNumber(baseVal,3)} 개/시간</span>
    </div>
    ${blocked ? '<div class="note" style="margin:0 0 8px">특수확률이 0 이하인 단계가 있어 지금은 도달할 수 없습니다. 막힌 단계를 푸는 데 도움되는 순서로 표시합니다.</div>' : ''}
    ${rows}`;
}


// ===================== [1강~44강] +추천: 남은 스텟 포인트를 효율(증가량 ÷ 비용) 순으로 배분 =====================
const REC_EARLY_STORAGE_KEY = 'dps-rec-target-early-v1';
let recTargetEarly = 40, recTimerEarly = null;
try { const _v = parseInt(localStorage.getItem(REC_EARLY_STORAGE_KEY)); if(_v>=40 && _v<=44) recTargetEarly = _v; } catch(e) {}
function saveRecTargetEarly(){ try { localStorage.setItem(REC_EARLY_STORAGE_KEY, String(recTargetEarly)); } catch(e) {} }
function computeRecEarly(){
  const tg = recTargetEarly;
  let sb = charLevel*POINTS_PER_LEVEL;
  STAT_OPTIONS.forEach(s=>{ sb -= Math.max(0, Math.min(s.max, getStatInv(s.page,s.no))) * s.cost; });
  const lv = {}, opt = {}, add = {}, spend = {};
  EFF_MATRIX_KEYS.forEach(([p,n])=>{ const k=`${p}_${n}`; opt[k] = STAT_OPTIONS.find(o=>o.page===p&&o.no===n); lv[`inv_${k}`] = Math.max(0, Math.floor(getStatInv(p,n))); });
  const res = { add, spend, sb, tg, ok: true, unblock: false };
  // 목표 강까지 가는 데 필요한 40~(목표-1)강 중 가장 낮은 원확률. 0 이하인 단계가 있으면 생산량이 0이라 이 값을 먼저 올린다.
  const stages = [40,41,42,43].filter(L=>L<tg);
  const bottleneck = m => { const g=(p,n)=>m[`inv_${p}_${n}`]; return stages.length ? Math.min(...stages.map(L=>getRaw40to43(L,g))) : 1; };
  const prodOf = m => computeProductionN44Details(m).N[tg] || 0;
  let cur = prodOf(lv);
  const blocked0 = !(cur>0);
  if(blocked0 && stages.length===0){ res.ok = false; return res; }
  res.unblock = blocked0;
  const t0 = performance.now();
  for(let it=0; it<400 && performance.now()-t0<600; it++){
    if(!(sb>0)) break;
    const blocked = !(cur>0);
    const base = blocked ? bottleneck(lv) : cur;
    let best = null;
    Object.keys(opt).forEach(k=>{
      const s = opt[k], n = lv[`inv_${k}`]; if(n>=s.max || s.cost>sb) return;
      const m2 = {...lv, [`inv_${k}`]:n+1};
      const gain = (blocked ? bottleneck(m2) : prodOf(m2)) - base;
      if(gain>0){ const sc = gain/s.cost; if(!best || sc>best.sc) best = {k, s, n, sc}; }
    });
    if(!best) break;
    let q = 1;
    if(!blocked){ const m = Math.min(best.s.max - best.n, Math.floor(sb/best.s.cost)); q = Math.max(1, Math.floor(m/10)); }
    lv[`inv_${best.k}`] += q; add[best.k] = (add[best.k]||0) + q; spend[best.k] = (spend[best.k]||0) + q*best.s.cost; sb -= q*best.s.cost;
    cur = prodOf(lv);
  }
  res.sb = sb;
  return res;
}
function scheduleRecEarly(){ clearTimeout(recTimerEarly); recTimerEarly = setTimeout(applyRecEarly, 80); }
function applyRecEarly(){
  if(!document.getElementById('recTargetEarly')) return;
  const r = computeRecEarly();
  EFF_MATRIX_KEYS.forEach(([p,n])=>{
    const el = document.getElementById(`recE_${p}_${n}`); if(!el) return;
    const a = r.add[`${p}_${n}`] || 0;
    if(a>0){ el.textContent = '+'+a.toLocaleString(); el.title = `${a.toLocaleString()}Lv 추가 · 비용 ${(r.spend[`${p}_${n}`]||0).toLocaleString()}P`; }
    else { el.textContent = ''; el.title = ''; }
  });
  const note = document.getElementById('recNoteEarly'); if(!note) return;
  if(!r.ok){ note.textContent = `+추천: ${r.tg}강 기준은 계산할 수 있는 단계가 없습니다.`; return; }
  const used = Object.values(r.spend).reduce((a,b)=>a+b,0);
  const pre = r.unblock ? `현재 ${r.tg}강까지 도달할 수 없어(생산량 0) 막힌 단계를 푸는 스텟부터 채웠습니다. ` : '';
  note.textContent = `+추천 (${r.tg}강 기준, 증가량 ÷ 비용 효율순): ${pre}스텟 ${used.toLocaleString()}P 사용 → 남는 포인트 ${Math.round(r.sb).toLocaleString()}`;
}

// 스텟 투자 효율 표: 각 스텟을 1레벨 추가했을 때의 생산량과 비용 대비 효율
const EFF_MATRIX_KEYS = [[1,1],[1,2],[1,3],[1,4],[1,5],[1,6],[2,1],[2,2],[2,3],[2,4],[2,5],[2,6],[3,6]]; // 3P-6(자판기 1,2의 촉진량)은 2P-6 바로 아래
function calcStatEfficiencyMatrix(){
  if(!document.getElementById('outStatEfficiencyMatrix')) return;
  const cols = [40,41,42,43,44];
  const baseDetails = computeProductionN44Details({});
  const b0 = baseDetails.N;
  cols.forEach(L=>{ const e=document.getElementById('effprod_'+L); if(e) e.textContent = formatMatrixNumber(b0[L]||0); });
  const items = EFF_MATRIX_KEYS.map(([p,n])=>{
    const s = STAT_OPTIONS.find(o=>o.page===p && o.no===n), cur = getStatInv(p,n);
    const it = { p, n, e:{} };
    if(cur>=s.max){ it.maxed = true; return it; }
    const nextDetails = computeProductionN44Details({ [`inv_${p}_${n}`]: cur+1 });
    it.production = nextDetails.N;
    cols.forEach(L=>{
      const b=b0[L]||0, v=nextDetails.N[L]||0;
      it.e[L] = b>0 ? (v-b)/b*100/s.cost : v/s.cost;
    });
    return it;
  });
  const mx = {};
  cols.forEach(L=>{ mx[L] = Math.max(0, ...items.filter(i=>!i.maxed).map(i=>i.e[L]).filter(isFinite)); });
  items.forEach(it=>{
    const tds = cols.map(L=>document.getElementById(`eff_${it.p}_${it.n}_${L}`));
    if(tds.some(t=>!t)) return;
    tds.forEach(t=>{ t.style.display=''; t.colSpan=1; t.style.textAlign=''; t.style.color=''; });
    if(it.maxed){
      tds[0].className=''; tds[0].colSpan=cols.length; tds[0].style.textAlign='center'; tds[0].style.color='var(--sub)'; tds[0].textContent='만렙';
      tds.slice(1).forEach(t=>{ t.style.display='none'; });
      return;
    }
    cols.forEach(L=>{
    const td = document.getElementById(`eff_${it.p}_${it.n}_${L}`); if(!td) return;
    const v = it.e[L];
    const production = it.production[L]||0;
    const alwaysBar = it.p===3 && it.n===6; // 3P-6(촉진량): 뽑을 수 있는 강이면 증가량·생산량과 무관하게 막대를 항상 표시
    const hasBar = alwaysBar ? (production>0&&isFinite(v)) : (production>0&&v>0&&isFinite(v)&&mx[L]>0);
    if(!hasBar){
      td.className='eff-empty';
      td.innerHTML='<div style="height:26px"></div>';
      return;
    }
    const w = (v>0&&mx[L]>0) ? Math.max(4, v/mx[L]*100) : 4;
    const isBest = v>0&&v===mx[L];
    td.className = '';
    td.innerHTML = `<div style="height:26px;display:flex;flex-direction:column;justify-content:center"><div title="${formatHourlyProduction(production)}개/시간 (해당 스텟 +1레벨) · 효율 ${formatMatrixNumber(v)}%/P" style="font:.64rem var(--mono);line-height:13px;white-space:nowrap;font-weight:${isBest?'700':'400'}">${formatMatrixNumber(production)}</div><div style="height:8px;background:var(--border);border-radius:2px;overflow:hidden"><div style="height:100%;width:${w}%;background:var(--accent);border-radius:2px;${isBest?'filter:brightness(.78);':''}"></div></div></div>`;
    });
  });
}
// ---- 1~44강 탭: 무색 조각 보석(무조) 입력·효율 — 45~50강 탭 오른쪽 보석표와 같은 방식(보유 입력 · +추천 · 강별 그래프), 그래프 열은 40~44강 ----
// 40~44강 생산에 닿는 보석만 넣는다: 재물·적대(돈 수급 → 자판기), 촉진(자판기 속도), 궁극·초월(모든 개별확률 → 1~43강 +1강),
// 보호·수호(파괴방지 → 40~44강 생존). 경험·숙련은 경험치 배수라 생산 그래프 대신 시간당 경험치 증가율을 한 칸으로 보여 준다.
// 하급~고급(44~48강 개별확률)은 40~44강 생산에 영향이 없어 뺐다.
const EARLY_GEM_ROWS = [['wealth','재물'],['hostile','적대'],['accel','촉진'],['ultimate','궁극'],['transcend','초월'],['guard','보호'],['protect','수호'],['exp','경험'],['mastery','숙련']];
const EARLY_GEM_PROD = ['wealth','hostile','accel','ultimate','transcend','guard','protect'];
const REC_GEM_EARLY_KEY = 'dps-rec-target-gem-early-v1';
let recTargetGemEarly = 40, recTimerGemEarly = null;

function saveRecTargetGemEarly(){ try { localStorage.setItem(REC_GEM_EARLY_KEY, String(recTargetGemEarly)); } catch(e) {} }
// map = { 보석키: 개수 } — 그 개수로 바꿨을 때의 40~44강 시간당 도달량(N)과 최고 효율 판매의 시간당 일반 경험치(exp)
function earlyGemEval(map){
  map = map || {};
  const cnt = k => map[k] !== undefined ? map[k] : getGemInv(k);
  const agg = getGemAggregates(map), inv = {};
  if(map.wealth !== undefined) inv._wealth = 1 + map.wealth * 0.1;
  const fn = () => {
    const base = computeProductionN40(inv), N = Object.assign({}, base.N), failed = Object.assign({}, base.failed), feedHi = base.feedHi || {};
    const pabang = getPabangTotal();
    for(let lv = 40; lv <= 43; lv++){
      const raw = getRaw40to43(lv), eff = applyDestructionPrevention(raw, pabang);
      const rp = clamp01(raw / 100), pp = clamp01(pabang / 100), den = 1 - (1 - rp) * pp;
      failed[lv] = den > 0 ? N[lv] * (1 - rp) * (1 - pp) / den : 0;
      N[lv + 1] = N[lv] * eff / 100 + (feedHi[lv + 1] || 0);
    }
    const bb = getBossCumulativeBonus(maxBossLevel);
    const addPart = 1 + bb.expPercent / 100 + getRaceInv('E') * 20 / 100 + cnt('exp') * 10 / 100 + (charLevel < 1000 ? 1 : 0);
    const real = expMultiplierParts(addPart).real * Math.pow(1.1, cnt('mastery') - getGemInv('mastery'));
    let running = 0, best = 0;
    for(let lv = 1; lv <= 44; lv++){
      const u = UNIT_DPS_DATA.find(x => x.lv === lv) || UNIT_DPS_DATA_4144.find(x => x.lv === lv);
      if(!u || u.failExp === undefined) continue;
      if(lv < 41 || N[lv] > 0){ const tot = ((N[lv] || 0) * u.failExp * 10 + running) * real; if(tot > best) best = tot; }
      running += (failed[lv] || 0) * u.failExp;
    }
    return { N: { 40: N[40] || 0, 41: N[41] || 0, 42: N[42] || 0, 43: N[43] || 0, 44: N[44] || 0 }, exp: best };
  };
  return withHostileGem(cnt('hostile'), () => withVendGem(agg.vendFinalMult, () => withGemProb(agg.globalProbAdd, () => withGemPabang(agg.pabangAdd, fn))));
}

function computeRecGemEarly(){
  const tg = recTargetGemEarly;
  let gb = gemTotalShards > 0 ? gemTotalShards - gemSpentShards() : 0;
  const cur = {}; EARLY_GEM_PROD.forEach(k => { cur[k] = Math.max(0, Math.floor(getGemInv(k))); });
  const add = {}, spend = {}, res = { add, spend, gb, tg, ok: true, had: gb > 0 };
  const prodOf = m => earlyGemEval(m).N[tg] || 0;
  let base = prodOf(cur);
  if(!(gb > 0)) return res;
  const t0 = performance.now();
  for(let it = 0; it < 300 && performance.now() - t0 < 500; it++){
    let best = null;
    EARLY_GEM_PROD.forEach(k => {
      const g = GEM_OPTIONS.find(o => o.key === k), n = cur[k]; if(n >= g.max) return;
      const c = g.cost(n); if(!(c > 0) || c > gb) return;
      const gain = prodOf({ ...cur, [k]: n + 1 }) - base;
      if(gain > 0){ const sc = gain / c; if(!best || sc > best.sc) best = { k, g, n, c, sc }; }
    });
    if(!best) break;
    let q = 1;
    { let m = 0, tot = 0; for(let i = best.n; i < best.g.max; i++){ const ci = best.g.cost(i); if(tot + ci > gb) break; tot += ci; m++; } q = Math.max(1, Math.floor(m / 10)); }
    let paid = 0; for(let i = 0; i < q; i++) paid += best.g.cost(best.n + i);
    cur[best.k] += q; add[best.k] = (add[best.k] || 0) + q; spend[best.k] = (spend[best.k] || 0) + paid; gb -= paid;
    base = prodOf(cur);
  }
  res.gb = gb;
  return res;
}

// ---- 시간당 경험치 박스: N시간 입력 → 오르는 레벨 / 사용 크레딧 ----
let expHours = 1;        // 입력한 시간(탭을 오가도 유지)
let expSummary = null;   // 마지막 계산 결과: { normalHr, bestLv, bestHr, bestUnits } (경험치/시간, 시간당 판매 유닛 수)
const SELL_CREDIT_PER_UNIT = lv => lv>=57 ? sale5760Credit() : lv>=52 ? 1000 : lv>=45 ? 100 : (lv>=41 ? 10 : 0); // 15~40강 무료 · 41~44강 10 · 45~50강 100(할인 전) · 52~56강 1,000 · 57~60강 10,000 (51강 판매 불가)
function setExpHours(v){ expHours = Math.max(0, parseFloat(v)||0); renderExpHours(); }
// 큰 수 한글 표기 (간·구·양·자·해·경·조·억·만까지 지원)
//  - 1만 미만: 쉼표 없이 숫자 그대로 (예: 8007)
//  - 1만~1억 미만: 만 + 나머지 (예: 5432만 1987)
//  - 1억~1조 미만: 억 + 만 (예: 53억 9663만)
//  - 1조 이상: 가장 큰 단위 + 바로 아래 단위, 두 칸만 (조 → 조·억 / 경 → 경·조 / 해 → 해·경 …), 값이 0인 칸은 생략
function fmtKRExp(n){
  if(!(n>0) || !isFinite(n)) return '0';
  let b = BigInt(plainDigits(n));          // 15자리 넘는 float 잡음은 0으로 정리
  if(b < 10000n) return b.toString();
  const top = BIG_KR_UNITS.findIndex(([l,v]) => b >= v);   // BIG_KR_UNITS = [단위글자, 값], 큰 단위부터
  const useUnits = b >= 10n**12n ? BIG_KR_UNITS.slice(top, top+2) : BIG_KR_UNITS.slice(top);
  const parts = [];
  for(const [l,v] of useUnits){ const q = b / v; if(q > 0n){ parts.push(q.toString()+l); b -= q*v; } }
  if(useUnits.length===1 && useUnits[0][1]===10000n && b>0n) parts.push(b.toString()); // 1만~1억 미만만 만 아래 나머지를 붙임
  return parts.join(' ');
}
// 현재 레벨(진행도 0)에서 경험치 gain을 더 먹었을 때 도달하는 레벨 (경험치 곡선: 누적 F(L) = 652,040×(L(L+1)/2)²)
function expLevelAfter(startLv, gain){
  if(!(gain>=0) || !isFinite(gain)) return null;
  const s = Math.max(1, Math.min(EXP_MAX_LV, Math.floor(startLv)||1));
  const E = expCumBig(s-1) + BigInt(Math.floor(gain));
  let a=0, b=EXP_MAX_LV;
  while(a<b){ const mid=Math.floor((a+b+1)/2); if(expCumBig(mid)<=E) a=mid; else b=mid-1; }
  return { from:s, to:Math.min(EXP_MAX_LV, a+1) };
}

  // 시간당 획득 경험치(실패 고려): 판매/실패 경험치에 표시된 추가 획득량 보너스를 합연산으로 적용.
  // 보스 경험치 보너스, 고유유닛 E옵션, 경험의 보석(개당 +10%), 레벨 1000 미만 자동 2배(+100%)를 더한다.
  const expAddPart = 1 + bBonus.expPercent/100 + getRaceInv('E')*20/100 + getGemInv('exp')*10/100 + (charLevel < 1000 ? 1 : 0);   // 경험의 보석 개당 +10%도 같은 합산 묶음 (인게임 실측: 툴팁·판매 모두 G + 0.1n). 레벨 +100%는 999까지, LV.1000부터 없음(실측)
  const { disp: expDisp, real: expReal } = expMultiplierParts(expAddPart);
  const failExpByLv = {};
  UNIT_DPS_DATA.forEach(u=>{ if(u.failExp !== undefined) failExpByLv[u.lv] = u.failExp; });
  UNIT_DPS_DATA_4144.forEach(u=>{ if(u.failExp !== undefined) failExpByLv[u.lv] = u.failExp; });
  const exp44FailEl = document.getElementById('exp44FailHr');
  if(exp44FailEl) exp44FailEl.textContent = fmtKRExp(failed[44] * failExpByLv[44] * expReal) + ' EXP';
  let runningFailExp = 0;
  let bestSaleLv = 0, bestSaleExp = 0, bestSaleUnits = 0;
  for(let lv=1; lv<=44; lv++){
    const u = UNIT_DPS_DATA.find(x=>x.lv===lv) || UNIT_DPS_DATA_4144.find(x=>x.lv===lv);
    const c = document.getElementById(`exphr-${lv}`);
    const cFail = document.getElementById(`failhr-${lv}`);
    const cSale = document.getElementById(`saleexp-${lv}`);
    const stageReachable = lv < 41 || lateStageReachable[lv];
    if(cSale){
      // 판매 시 경험치도 동일한 경험치 배수(개인보스·고유유닛 E옵션·레벨1000미만 2배)를 곱연산으로 반영
      cSale.textContent = (u && u.failExp !== undefined) ? Math.round(u.failExp*expDisp).toLocaleString() : '-';
    }
    if(cFail) cFail.textContent = stageReachable && u && u.failExp !== undefined
      ? Math.round(runningFailExp * expReal).toLocaleString()
      : '-';
    if(c){
      if(stageReachable && u && u.failExp !== undefined){
        const successExpPerHour = (N[lv]||0) * (u.failExp*10) * expReal;
        const failExpPerHour = runningFailExp * expReal;
        c.textContent = Math.round(successExpPerHour + failExpPerHour).toLocaleString();
        if(successExpPerHour + failExpPerHour > bestSaleExp){ bestSaleExp = successExpPerHour + failExpPerHour; bestSaleLv = lv; bestSaleUnits = N[lv]||0; }
      } else {
        c.textContent = '-';
      }
    }
    if(failExpByLv[lv] !== undefined) runningFailExp += (failed[lv]||0) * failExpByLv[lv];
  }
  { const n=document.getElementById('expNormalHr'), bl=document.getElementById('expBestLabel'), bh=document.getElementById('expBestHr');
    if(n) n.textContent = fmtKRExp(runningFailExp*expReal) + ' EXP';
    if(bl) bl.innerHTML = bestSaleLv ? `<b>최고 효율(${bestSaleLv}강) 판매</b>` : '<b>최고 효율 판매</b>';
    if(bh) bh.textContent = bestSaleLv ? fmtKRExp(bestSaleExp) + ' EXP' : '-';
    expSummary = { normalHr: runningFailExp*expReal, bestLv: bestSaleLv, bestHr: bestSaleExp, bestUnits: bestSaleUnits };
    renderExpHours();
  }

  const { lvA, lvB, mix } = lastVendingAuto;
  let feedLabel;
  if(mix){
    const machineName = idx => idx===0 ? '1호기' : '2호기';
    const stableLv = mix.idx===0 ? lvB : lvA;
    feedLabel = `${machineName(mix.idx===0?1:0)} ${vendLvLabel(stableLv)}(100%) + ${machineName(mix.idx)} [${vendLvLabel(mix.fromLv)} ${((1-mix.toRatio)*100).toFixed(1)}% / ${vendLvLabel(mix.toLv)} ${(mix.toRatio*100).toFixed(1)}%]`;
  } else {
    feedLabel = lvA===lvB ? `${vendLvLabel(lvA)} × 2대` : `${vendLvLabel(lvA)} 1대 + ${vendLvLabel(lvB)} 1대`;
  }
  summaryEl.innerHTML = `
    <div class="stat"><span>+1강 확률 보너스</span><span>스텟 +${statP1.toFixed(1)}%p, 보스 +${bBonus.prob1.toFixed(1)}%p</span></div>
    <div class="stat"><span>+2강 확률 보너스</span><span>스텟 +${statP2.toFixed(1)}%p</span></div>
    <div class="stat"><span>+3강 확률 보너스</span><span>스텟 +${statP3.toFixed(1)}%p</span></div>
    <div class="stat" style="border-bottom:none"><span>자판기 투입 (자동, [2] 연동, 예산 100% 소진 기준)</span><span>${feedLabel} × 초당 구매 ${vendUnitsPerSec().toLocaleString()}번 (묶음이면 × 기수)</span></div>
  `;

  if(document.getElementById('outStatEfficiency')) calcStatEfficiency();
}

function curAtkInfo(lv){
  const u = getHuntUnitData(lv); if(!u) return null;

  return { exp, raw, used, dps: getUnitPracticalDps({ atk: used, hits: u.hits || 1, spd: u.spd }) };
}
function curAtkDpsCell(lv){
  const c = curAtkInfo(lv); if(!c) return '-';
  return `<span id="catk_dps_${lv}" title="${c.raw ? `입력 ${c.raw.toLocaleString()} ÷ 예상 ${Math.round(c.exp).toLocaleString()} = ${(c.raw / c.exp * 100).toLocaleString(undefined, { maximumFractionDigits: 1 })}%` : `예상 공격력 ${Math.round(c.exp).toLocaleString()} 기준`}" style="${c.raw ? 'font-weight:700' : 'color:var(--sub)'}">${formatHourlyProduction(c.dps)}</span>`;
}
function setCurAtk(lv, val){
  const v = parseFloat(val);
  if(v > 0) curAtk4450[lv] = v; else delete curAtk4450[lv];

  const cell = document.getElementById('catk_dps_' + lv);       // 입력 중에는 표를 다시 그리지 않고 DPS 칸만 바꾼다(커서 유지)

}

  };
  let rows = '';
  [44,45,46,47,48].forEach(lv=>{
    const st = INDIVIDUAL_STAT_44_48[lv], statB = getStatInv(st.page, st.no)*st.perLevel;
    const gemB = r.gemAgg.individualBonus[lv] + r.gemAgg.globalProbByLv[lv];
    const tdrop = individualTimeDrop();

// ===================== [44~50강] 총 무조 · 남은 무조 · 효율 기준 추천 배분(+추천 열) =====================
function fmtKRSigned(n){ return n<0 ? '-'+fmtKR(-n) : fmtKR(n); }
function gemSpentShards(){
  let t = 0;
  GEM_OPTIONS.forEach(g=>{ const n = Math.max(0, Math.min(g.max, Math.floor(getGemInv(g.key)))); for(let k=0;k<n;k++) t += g.cost(k); });
  return t;
}
function statSpentPoints(){
  let t = 0;
  STAT_OPTIONS.forEach(s=>{ t += Math.max(0, Math.min(s.max, getStatInv(s.page, s.no))) * s.cost; });
  return t;
}
// 넣을 수 있는 총 무조의 상한 = 보석 20종 최대치 누적 비용 합계(보석_비용 시트, 약 37해 20경)
function gemMaxTotalShards(){ let s = 0n; GEM_OPTIONS.forEach(g => { s += gemCumBig(g.key, g.max); }); return Number(s); }
// 해·경·조·억·만 단위로 읽고 쓰기 (숫자만 써도 되고, 섞어 써도 된다: 2해 1015경 920조 / 5조 / 5000000000000)
const KR_UNIT_MAP = {'해':10n**20n,'경':10n**16n,'조':10n**12n,'억':10n**8n,'만':10n**4n};
function parseUnits(str){
  let total = 0n;
  (String(str).replace(/[,\s]/g,'').match(/\d+(?:\.\d+)?[해경조억만]?/g) || []).forEach(tok=>{
    const m = tok.match(/^(\d+)(\.\d+)?([해경조억만])?$/); if(!m) return;
    const mult = m[3] ? KR_UNIT_MAP[m[3]] : 1n;
    total += m[2] ? BigInt(Math.round(parseFloat(m[1]+m[2]) * Number(mult))) : BigInt(m[1]) * mult;
  });
  return total;
}
function fmtUnits(n){
  n = Math.round(n); if(!(n>0)) return '0';
  let b = BigInt(plainDigits(n)); const parts = [];
  for(const [l,v] of Object.entries(KR_UNIT_MAP)){ const q = b/v; if(q>0n){ parts.push(q+l); b -= q*v; } }
  if(b>0n) parts.push(String(b));
  return parts.join(' ');
}
// 남은 무조 표시용: 억 이상이면 가장 큰 두 단위까지만 (예: 조·억, 억·만, 해·경). 억 미만은 만 아래 자리까지 그대로.
function fmtUnitsTop2(n){
  n = Math.round(n); if(!(n>0)) return '0';
  const b = BigInt(plainDigits(n));
  if(b < 10n**8n) return fmtUnits(n);
  const units = Object.entries(KR_UNIT_MAP);
  const i = units.findIndex(([l,v])=>b/v>0n);
  const [l1,v1] = units[i], q1 = b/v1, rest = b - q1*v1;
  const [l2,v2] = units[i+1], q2 = rest/v2;
  return q1+l1 + (q2>0n ? ' '+q2+l2 : '');
}
function setGemTotal(el){
  // 숫자만 받고 천 단위 쉼표를 붙인다(커서 위치 유지). 상한 초과는 상한으로 맞춤
  const before = el.value.slice(0, el.selectionStart||0).replace(/\D/g,'').length;
  let digits = el.value.replace(/\D/g,'').replace(/^0+(?=\d)/,'');
  const maxD = plainDigits(gemMaxTotalShards());
  if(digits && BigInt(digits) > BigInt(maxD)) digits = maxD;
  el.value = digits.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  let pos = 0, cnt = 0; while(pos<el.value.length && cnt<before){ if(/\d/.test(el.value[pos])) cnt++; pos++; }
  try { el.setSelectionRange(pos,pos); } catch(e) {}
  gemTotalShards = digits ? Number(digits) : 0;
  el.title = (gemTotalShards>0 ? '= '+fmtUnits(gemTotalShards)+'\n' : '') + '최대 ' + fmtDigits(gemMaxTotalShards());
  try { localStorage.setItem(GEM_TOTAL_STORAGE_KEY, String(gemTotalShards)); } catch(e) {}
  updateRemainGems();
  scheduleRec4450();
  if(typeof scheduleRecGemEarly === 'function') scheduleRecGemEarly();
}
