}
function recEvalN4450(gemMap, statLv, target){
  const keys = Object.keys(statLv), saved = {};
  keys.forEach(k=>{ saved[k] = statInvestments[k]; statInvestments[k] = statLv[k]; });
  try { return computeGemProduction4449(gemMap).N[target] || 0; }
  finally { keys.forEach(k=>{ if(saved[k]===undefined) delete statInvestments[k]; else statInvestments[k] = saved[k]; }); }
}
// 남은 무조(보석)·남은 스텟 포인트(스텟)를 각각 예산으로, "생산량 증가 ÷ 비용"이 가장 큰 항목부터 계속 사 나간다.
// 스텟과 보석은 서로 곱으로 얽혀 있어서 매 라운드 각 화폐의 최고 효율 항목을 함께 반영하고 다시 계산한다.
// 연산량을 줄이려고 살 수 있는 개수가 많으면 남은 수량의 약 10%씩 묶어서 사고, 끝에 가까워질수록 1개씩 산다.
function computeRec4450(){
  const tg = recTargetGem4450, ts = recTargetStat4450;
  let gb = gemTotalShards>0 ? gemTotalShards - gemSpentShards() : 0;
  let sb = charLevel*POINTS_PER_LEVEL - statSpentPoints();
  const gemCur = {}; GEM_OPTIONS.forEach(g=>{ gemCur[g.key] = Math.max(0, Math.floor(getGemInv(g.key))); });
  const statLv = {}, statOpt = {};
  STAT_ROWS_4450.forEach(([p,n])=>{ const k=`${p}_${n}`; statOpt[k] = STAT_OPTIONS.find(o=>o.page===p&&o.no===n); statLv[k] = Math.max(0, Math.floor(getStatInv(p,n))); });
  const gemCands = GEM_OPTIONS.filter(isSaleProductionGem);
  const addG = {}, addS = {}, spendG = {}, spendS = {};
  const gb0 = gb, sb0 = sb;
  const res = { addG, addS, spendG, spendS, gb, sb, tg, ts, ok: true, hadG: gb>0, hadS: sb>0 };
  const evalN = (gm, sl)=>{
    const keys = Object.keys(sl), saved = {};
    keys.forEach(k=>{ saved[k] = statInvestments[k]; statInvestments[k] = sl[k]; });
    try { return computeGemProduction4449(gm).N; }
    finally { keys.forEach(k=>{ if(saved[k]===undefined) delete statInvestments[k]; else statInvestments[k] = saved[k]; }); }
  };
  let cur = evalN(gemCur, statLv);
  // 도달이 0이어도 원확률이 0 이하라 막힌 것이면(막힌 단계가 있으면) 그 단계를 풀면서 추천한다
  res.ok = (cur[tg]>0 || cur[ts]>0 || blockedStage(cur, tg, gemCur, statLv)!==null || blockedStage(cur, ts, gemCur, statLv)!==null);
  if(!res.ok) return res;
  const t0 = performance.now();
  for(let it=0; it<400 && performance.now()-t0<600; it++){
    let bg = null, bs = null;
    const bkG = blockedStage(cur, tg, gemCur, statLv), bkS = blockedStage(cur, ts, gemCur, statLv);   // 막힌 단계 (없으면 null)
    // 막힌 동안의 점수: 한 번에 도달이 생기는 항목(1e30 가중)이 우선, 아니면 막힌 단계 원확률을 올리는 양 ÷ 비용. need = 막힘을 풀려면 필요한 개수
    if(gb>0) gemCands.forEach(g=>{
      const n = gemCur[g.key]; if(n>=g.max) return;
      const c = g.cost(n); if(!(c>0) || c>gb) return;
      const trial = {...gemCur, [g.key]:n+1};
      const gain = evalN(trial, statLv)[tg] - cur[tg];
      let sc = 0, need = 0;
      if(gain>0) sc = (bkG!==null ? 1e30 : 1) * gain / c;
      else if(bkG!==null){
        const r0 = rawStageAt(bkG, gemCur, statLv), imp = rawStageAt(bkG, trial, statLv) - r0;
        if(imp>0){ sc = imp / c; need = Math.floor(-r0 / imp) + 1; }
      }
      if(sc>0 && (!bg || sc>bg.sc)) bg = {g, n, sc, need};
    });
    if(sb>0) Object.keys(statOpt).forEach(k=>{
      const s = statOpt[k], n = statLv[k]; if(n>=s.max || s.cost>sb) return;
      const trial = {...statLv, [k]:n+1};
      const gain = evalN(gemCur, trial)[ts] - cur[ts];
      let sc = 0, need = 0;
      if(gain>0) sc = (bkS!==null ? 1e30 : 1) * gain / s.cost;
      else if(bkS!==null){
        const r0 = rawStageAt(bkS, gemCur, statLv), imp = rawStageAt(bkS, gemCur, trial) - r0;
        if(imp>0){ sc = imp / s.cost; need = Math.floor(-r0 / imp) + 1; }
      }
      if(sc>0 && (!bs || sc>bs.sc)) bs = {k, s, n, sc, need};
    });
    if(!bg && !bs) break;
    // 묶음으로 사다가 최적점을 넘으면(예: 촉진을 너무 올려 자판기가 낮은 강만 돌려서 도달이 줄어듦) 묶음 크기를 반으로 줄인다
    if(bg){
      let m = 0, tot = 0;
      for(let i=bg.n; i<bg.g.max; i++){ const c = bg.g.cost(i); if(tot+c>gb) break; tot += c; m++; }
      let q = bg.need>0 ? Math.max(1, Math.min(m, bg.need)) : Math.max(1, Math.floor(m/10));
      if(!(bg.need>0)) while(q>1 && evalN({...gemCur, [bg.g.key]: bg.n+q}, statLv)[tg] < cur[tg]) q = Math.max(1, Math.floor(q/2));
      let spend = 0; for(let i=0;i<q;i++) spend += bg.g.cost(bg.n+i);
      gemCur[bg.g.key] += q; addG[bg.g.key] = (addG[bg.g.key]||0) + q; spendG[bg.g.key] = (spendG[bg.g.key]||0) + spend; gb -= spend;
      cur = evalN(gemCur, statLv);
    }
    if(bs){
      const m = Math.min(bs.s.max - bs.n, Math.floor(sb/bs.s.cost));
      let q = bs.need>0 ? Math.max(1, Math.min(m, bs.need)) : Math.max(1, Math.floor(m/10));
      if(!(bs.need>0)) while(q>1 && evalN(gemCur, {...statLv, [bs.k]: bs.n+q})[ts] < cur[ts]) q = Math.max(1, Math.floor(q/2));
      statLv[bs.k] += q; addS[bs.k] = (addS[bs.k]||0) + q; spendS[bs.k] = (spendS[bs.k]||0) + q*bs.s.cost; sb -= q*bs.s.cost;
      cur = evalN(gemCur, statLv);
    }
  }
  res.gb = gb; res.sb = sb;
  // 추천대로 다 찍어도 목표 강 도달이 0이면(예산·최대치 부족) 그 화폐의 추천은 표시하지 않는다 — 0퍼를 넘기는 추천일 때만 + 숫자를 보여 준다
  res.stuckG = !(cur[tg]>0); res.stuckS = !(cur[ts]>0);
  if(res.stuckG){ Object.keys(addG).forEach(k=>{ delete addG[k]; delete spendG[k]; }); res.gb = gb0; }
  if(res.stuckS){ Object.keys(addS).forEach(k=>{ delete addS[k]; delete spendS[k]; }); res.sb = sb0; }
  return res;
}
function scheduleRec4450(){
  clearTimeout(recTimer4450);
  recTimer4450 = setTimeout(applyRec4450, 80);
}
function applyRec4450(){
  if(!document.getElementById('recTargetGem4450')) return;
  const r = computeRec4450();
  const setCell = (id, add, cost, unit)=>{
    const el = document.getElementById(id); if(!el) return;
    if(add>0){ el.textContent = '+'+add.toLocaleString(); el.title = `${add.toLocaleString()}${unit} 추가 · 비용 ${fmtUnits(cost)}`; }
    else { el.textContent = ''; el.title = ''; }
  };
  GEM_OPTIONS.forEach(g=>setCell('rec_g'+g.key, r.addG[g.key]||0, r.spendG[g.key]||0, '개'));
  STAT_ROWS_4450.forEach(([p,n])=>setCell(`rec_s${p}_${n}`, r.addS[`${p}_${n}`]||0, r.spendS[`${p}_${n}`]||0, 'Lv'));
  const note = document.getElementById('recNote'); if(!note) return;
  const gemUsed = Object.values(r.spendG).reduce((a,b)=>a+b,0), statUsed = Object.values(r.spendS).reduce((a,b)=>a+b,0);
  if(!r.ok){ note.textContent = '+추천: 선택한 추천 기준 단계의 시간당 생산량이 0이라 계산할 수 없습니다. 사냥터 유닛·스텟·보석 설정을 확인하세요.'; return; }
  const noReach = L => `${L}강 도달이 0 — 최고 효율대로 찍어도 0퍼를 못 넘겨 추천 없음`;
  const gemPart = gemTotalShards<=0 ? '총 무조를 입력하면 보석도 추천합니다' : (r.stuckG ? `보석(${noReach(r.tg)})` : `보석(${r.tg}강 기준) ${fmtUnits(gemUsed)} 사용 → 남는 무조 ${fmtUnits(Math.max(0,r.gb))}`);
  const statPart = r.stuckS && r.hadS ? `스텟(${noReach(r.ts)})` : `스텟(${r.ts}강 기준) ${statUsed.toLocaleString()}P 사용 → 남는 포인트 ${Math.round(r.sb).toLocaleString()}`;
  note.textContent = `+추천 (증가량 ÷ 비용 효율순): ${gemPart} / ${statPart}`;
}

function updateRemainPoints(){
  const remainEl=document.getElementById('remainPoints');
  if(!remainEl) return;
  const totalPoints=charLevel*POINTS_PER_LEVEL;
  let spent=0;
  STAT_OPTIONS.forEach(s=>{
    const inv=Math.max(0,Math.min(s.max, getStatInv(s.page,s.no)));
    spent+=inv*s.cost;
  });
  const remain=totalPoints-spent;
  remainEl.style.color=remain<0?'var(--danger)':'var(--accent2)';
  remainEl.innerHTML=`<b>${remain.toLocaleString()}</b>`;
  if(typeof scheduleRec4450==='function') scheduleRec4450();
  if(typeof scheduleRecEarly==='function') scheduleRecEarly();
}

      <span id="huntLvUnit${i}" title="51~56강, 그리고 허수광산이 열렸을 때(개인보스 10단계) 광산이 허수맥스보다 더 벌리는 41~50강은 허수광산 공식으로 계산" style="font-size:.78rem;color:var(--sub);white-space:nowrap">${unitHitsMine(row.lv) ? '강 광산' : '강'}</span>
      <input type="number" value="${row.count}" min="1" style="width:4.4em;padding:4px 3px;text-align:right" oninput="huntUnitRows[${i}].count = parseFloat(this.value)||0; refreshEarly();">
      <span style="font-size:.78rem;color:var(--sub)">개</span>
      ${huntUnitRows.length > 1 ? `<button type="button" class="btn-del" onclick="removeHuntUnitRow(${i})" style="padding:3px 6px;font-size:.7rem">×</button>` : ''}
    </div>`;
  });
  container.innerHTML = html;
  const addBtn = document.getElementById('addHuntRowBtn');
  if(addBtn){ const full = huntUnitRows.length >= HUNT_ROWS_MAX; addBtn.disabled = full; addBtn.style.opacity = full ? '.4' : '1'; addBtn.style.cursor = full ? 'default' : 'pointer'; }
}

function calcHuntIncome() {
  const statAtkUp = getStatInv(1,2);

  // 사냥터별 DPS 풀 + 51~56강 허수광산 돈 (공격력 배수 = (1 + 스텟공업*0.1 + 보스공격력%/100) * 적대, 합연산·상한 없음)
  // 25강 이하(LV.1 사냥터)와 26강 이상(LV.2 사냥터)은 DPS 풀과 돈 배수가 서로 독립적으로 계산됨
  const hc = huntComposition(statAtkUp);
  const { bBonus, totalAtkMult, uniq, uniqDps } = hc;
  const totalDpsLv1 = hc.dpsLv1, totalDpsLv2 = hc.dpsLv2, totalDpsMax = hc.dpsMax;
  const totalDps = totalDpsLv1 + totalDpsLv2 + totalDpsMax;

  const infoLv1 = getDpsMultiplierInfo(totalDpsLv1);
  const infoLv2 = getDpsMultiplierInfoLv2(totalDpsLv2);
  const moneyStatMult = 1 + getStatInv(1,1) * 0.01; // 1P-1: 모든 사냥터 돈 수급 +1%/Lv. 각성·재물·폭식은 LV.MAX·허수광산 전용이라 LV.1/LV.2에는 안 붙음(게임 안내문)
  const moneyLv1PerSec = totalDpsLv1 * infoLv1.mult * moneyStatMult * speedMult();
  const moneyLv2PerSec = totalDpsLv2 * infoLv2.mult * 100000 * moneyStatMult * speedMult(); // LV.2 사냥터 기본보상 ×10만
  const wealthGems = getGemInv('wealth');
  const moneyMaxMineMult = moneyPctMult(getStatInv(1,1), wealthGems, getOrb('glut'), effectiveAwakenLevel(), trueAwakenLevel); // LV.MAX·허수광산: 1P-1 → 재물 → 각성을 곱할 때마다 정수 %로 내린 배수(실측). 폭식의 보주는 [56~59강 정보] 탭 보주 입력
  const moneyMaxPerSec = totalDpsMax * 1e10 * moneyMaxMineMult * speedMult(); // LV.MAX 사냥터: DPS 구간 배수 없이 DPS×100억
  const moneyMinePerSec = hc.mineTick * moneyMaxMineMult * speedMult();      // 51~56강 허수광산: 1.179×10¹⁵ × (M + 2D) 공식
  const moneyEarnedPerSec = moneyLv1PerSec + moneyLv2PerSec + moneyMaxPerSec + moneyMinePerSec;

  const vendingAuto = autoClimbVending(moneyEarnedPerSec);
  lastVendingAuto = vendingAuto; // [3]에서 자판기 투입 강화단계·비율로 그대로 사용

  // 혼합가동 문구 (예: "2호기: 미구매 65.0% + 1강 35.0%", "2호기: 1강 65.0% + 7강 35.0%")
  const machineName = idx => idx===0 ? '1호기' : '2호기';
  const mixText = vendingAuto.mix
    ? `${machineName(vendingAuto.mix.idx)}: ${vendLvLabel(vendingAuto.mix.fromLv)} ${((1-vendingAuto.mix.toRatio)*100).toFixed(1)}% + ${vendLvLabel(vendingAuto.mix.toLv)} ${(vendingAuto.mix.toRatio*100).toFixed(1)}%`
    : null;

  const briefingEl = document.getElementById('autoBriefing');
  if (briefingEl) {
    let autoText = `<div style="font-weight:bold; color:var(--accent2); margin-bottom:4px;">⚡ 수급 현황 브리핑</div>`;
    autoText += `<div>• 적용 공격력 배수: <b>${totalAtkMult.toFixed(2)}배</b> (합연산 · 인게임 「공격력 +${(statAtkUp * 10 + bBonus.atkPercent).toLocaleString()}%」 = 스텟공업 +${statAtkUp}레벨 ${statAtkUp * 10}% + 보스공격력 ${bBonus.atkPercent}%${hostileMult() > 1 ? ' · 적대의 보석 ×' + hostileMult().toFixed(1) : ''})</div>`;
    autoText += hc.uniqInMine
      ? `<div>• 고유유닛: 쿨타임 ${uniq.frames}프레임 → 허수광산을 침 (24프레임당 ${uniq.hitRate.toLocaleString(undefined,{maximumFractionDigits:2})}타 × 1타 고정 돈)</div>`
      : `<div>• 고유유닛: 공격력 ${uniq.atk.toLocaleString()} / 쿨타임 ${uniq.frames}프레임 → DPS <b>${uniqDps.toLocaleString(undefined,{maximumFractionDigits:1})}</b> (사냥터 LV.${uniq.zone})</div>`;
    if (getStatInv(1,1) > 0) autoText += `<div>• 돈 수급 스텟(1P-1): <b>×${(1 + getStatInv(1,1) * 0.01).toFixed(2)}</b> (모든 사냥터)</div>`;
    if (effectiveAwakenLevel() > 0) autoText += `<div>• 각성 ${effectiveAwakenLevel().toLocaleString()}레벨: <b>×${awakenMoneyMult().toLocaleString(undefined,{maximumFractionDigits:1})}</b> (LV.MAX·허수광산만 — LV.1/LV.2에는 안 붙음, 곱연산 · 1P-1 × 재물 × 각성을 곱할 때마다 정수 %로 내림)</div>`;
    if (wealthGems > 0) autoText += `<div>• 재물의 보석 ${wealthGems.toLocaleString()}개: <b>×${(1 + 0.1 * wealthGems).toFixed(1)}</b> (LV.MAX·허수광산만 — 1P-1 × 재물 × 각성을 곱할 때마다 정수 %로 내려 총 <b>${Math.round(moneyMaxMineMult * 100).toLocaleString()}%</b>)</div>`;
    if (totalDpsLv1 > 0) autoText += `<div>• LV.1(1~25강) 수급: <b>${moneyLv1PerSec.toLocaleString(undefined, {maximumFractionDigits:1})}</b> / 초 (${infoLv1.mult}배 배수)</div>`;
    if (totalDpsLv2 > 0) autoText += `<div>• LV.2(26~40강) 수급: <b>${moneyLv2PerSec.toLocaleString(undefined, {maximumFractionDigits:1})}</b> / 초 (${infoLv2.mult}배 배수 × 10만)</div>`;
    if (totalDpsMax > 0) autoText += `<div>• LV.MAX 사냥터 수급: <b>${moneyMaxPerSec.toLocaleString(undefined, {maximumFractionDigits:1})}</b> / 초 (DPS×100억, 배수 없음)</div>`;
    if (hc.mineLowTick > 0) {
      const perSec = hc.mineLowTick * moneyMaxMineMult * speedMult();
      autoText += `<div>• 허수광산(41~50강·고유유닛) 수급: <b>${perSec.toLocaleString(undefined, {maximumFractionDigits:1})}</b> / 초 (1타 = 1.179×10¹⁵ × 반올림(공격력 배수 ${hc.atkSum.toFixed(2)}) = ${hc.m50}배 — 유닛과 무관, 공속만 차이 · 허수맥스 무조 없음)</div>`;
    }
    if (hc.mineHiTick > 0) {
      const ci = mineCritInfo(), perSec = hc.mineHiTick * moneyMaxMineMult * speedMult();
      autoText += `<div>• 허수광산(51~59강) 수급: <b>${perSec.toLocaleString(undefined, {maximumFractionDigits:1})}</b> / 초 (1.179×10¹⁵ × (M ${hc.M} + 2×표기 공격력) · 크리티컬 ${Math.round(ci.p * 1000) / 10}% ×${ci.mult})</div>`;
    }
    autoText += `<div>• 최종 수급: <b>${moneyEarnedPerSec.toLocaleString(undefined, {maximumFractionDigits:1})}</b> / 초</div>`;
    autoText += `<div>• 자판기 자동 배정: <b>1호기 ${vendLvLabel(vendingAuto.lvA)} / 2호기 ${vendLvLabel(vendingAuto.lvB)}</b>${vendingAuto.mix ? ` <span style="color:var(--accent2)">(다음 단계 일부 혼합 가동)</span>` : ''}</div>`;
    if (mixText) {
      autoText += `<div style="color:var(--accent2)">• 잔여 예산 혼합 가동 비율: <b>${mixText}</b> (예산을 100% 소진하는 만큼만 다음 단계/구매 반영, 0강 구간 포함)</div>`;
    }
    if (moneyEarnedPerSec === 0) {
      autoText += `<div style="color:var(--sub)">• 수급이 0이라 자판기를 아직 구매할 수 없습니다 (전부 미구매).</div>`;
    }
    briefingEl.innerHTML = autoText;
  }

  const totalCostPerSec = vendingAuto.actualCost;

  updateGlobalVending(vendingAuto);
  const vendingAutoEl = document.getElementById('outVendingAuto');
  if (vendingAutoEl) {
    const priceLabel = lv => lv>0 ? `${vendLvLabel(lv)} (${fmtPriceKR(vendPrice(lv))})` : '미구매';
    let line1, line2;
    if (vendingAuto.mix) {
      const m = vendingAuto.mix;
      const mixedLine = `${priceLabel(m.fromLv)} ${((1-m.toRatio)*100).toFixed(1)}% + ${priceLabel(m.toLv)} ${(m.toRatio*100).toFixed(1)}% <span style="color:var(--accent2)">(혼합)</span>`;
      if (m.idx === 0) { line1 = mixedLine; line2 = priceLabel(vendingAuto.lvB); }
      else { line1 = priceLabel(vendingAuto.lvA); line2 = mixedLine; }
    } else {
      line1 = priceLabel(vendingAuto.lvA);
      line2 = priceLabel(vendingAuto.lvB);
    }
    vendingAutoEl.innerHTML = `
      <div class="stat"><span>1호기</span><span><b>${line1}</b></span></div>
      <div class="stat" style="border-bottom:none"><span>2호기</span><span><b>${line2}</b></span></div>
    `;
  }

  // 자판기 유지 비율 = 골드 획득량 / 자판기 구매 가격
  const maintainRatio = totalCostPerSec > 0 ? (moneyEarnedPerSec / totalCostPerSec) * 100 : null;
  const netIncomePerSec = moneyEarnedPerSec - totalCostPerSec;

  const out = document.getElementById('outHuntIncome');
  if (!out) return;

  out.innerHTML = `
    <div class="stat"><span>총 실측 DPS (LV1+LV2+MAX)</span><span><b>${totalDps.toLocaleString(undefined, {maximumFractionDigits:1})}</b></span></div>
    ${totalDpsLv1 > 0 ? `<div class="stat"><span>LV.1 DPS / 배수 (${infoLv1.next === null ? '표 끝' : '다음:' + infoLv1.next.toLocaleString()})</span><span>${totalDpsLv1.toLocaleString(undefined,{maximumFractionDigits:1})} / <b>${infoLv1.mult}배</b></span></div>` : ''}
    ${totalDpsLv2 > 0 ? `<div class="stat"><span>LV.2 DPS / 배수 (${infoLv2.next === null ? '표 끝' : '다음:' + infoLv2.next.toLocaleString()})</span><span>${totalDpsLv2.toLocaleString(undefined,{maximumFractionDigits:1})} / <b>${infoLv2.mult}배</b> ×10만</span></div>` : ''}
    ${totalDpsMax > 0 ? `<div class="stat"><span>LV.MAX DPS (배수 없음, ×100억)</span><span>${totalDpsMax.toLocaleString(undefined,{maximumFractionDigits:1})}</span></div>` : ''}
    ${hc.mineTick > 0 ? `<div class="stat"><span>허수광산 수급 (${[hc.mineLowTick > 0 ? '41~50강·고유유닛' : '', hc.mineHiTick > 0 ? '51~59강' : ''].filter(Boolean).join(' + ')} · DPS가 아니라 1타 공식)</span><span>${moneyMinePerSec.toLocaleString(undefined,{maximumFractionDigits:1})} / 초</span></div>` : ''}
    <div class="stat" style="color:var(--accent)"><span>골드 수급량</span><span><b>${moneyEarnedPerSec.toLocaleString(undefined, {maximumFractionDigits:1})} / 초</b></span></div>
    <div class="stat"><span>자판기 소모</span><span>${totalCostPerSec >= 1e4 ? fmtPriceKR(totalCostPerSec) : totalCostPerSec.toLocaleString()} / 초</span></div>
    <div class="stat"><span>자판기 유지 비율 (골드÷자판기가격)</span><span>${maintainRatio===null ? '-' : maintainRatio.toFixed(1)+'%'}</span></div>
    <div class="stat" style="font-size:1rem; border-top:1px solid var(--border); padding-top:8px;">
      <span><b>초당 순수익</b></span>
      <span style="color:${netIncomePerSec < 0 ? 'var(--danger)' : 'var(--accent)'}"><b>${netIncomePerSec >= 0 ? '+' : ''}${netIncomePerSec.toLocaleString(undefined, {maximumFractionDigits:1})} / 초</b></span>
    </div>
  `;

  // 자판기 자동 배정이 바뀔 수 있으므로 [3] 표도 함께 갱신
  updateEnhance1to40();
};

// 보주 추천: 목표 강의 「56강 1마리당 도달」을 가장 싸게 1% 늘리는 순서 (다음 1개를 샀을 때의 증가율 ÷ 다음 1개 비용)
const Q59_PROB_ORBS = [['high', '상급 보주', 57, '56강 융합 +0.05%p'], ['fate', '명운의 보주', 57, '56강 융합 +0.02%p'], ['save', '절약의 보주', 57, '융합 필요 −10마리'], ['special', '특급 보주', 58, '57강 +0.02%p'], ['nebula', '성운의 보주', 58, '57강 +0.02%p'], ['premium', '고급 보주', 59, '58강 +0.01%p'], ['heaven', '천운의 보주', 59, '58강 +0.02%p'], ['void', '무위의 보주', 60, '59강 +0.001%p']];
function q59ProbRecs(goal){
  const base = quasarYield({})[goal];
  return Q59_PROB_ORBS.filter(d => d[2] <= goal).map(([k, name, , eff]) => {
    const own = getOrb(k);
    if(own >= ORB_MAX[k]) return { k, name, eff, own, max: true };
    const cost = gemNextCost(ORB_GEM_KEY[k], own), gain = base > 0 ? quasarYield({ [k]: own + 1 })[goal] / base - 1 : 0;
    return { k, name, eff, own, cost, gain, per: gain > 0 ? cost / (gain * 100) : Infinity };
  }).sort((a, b) => (a.max ? 1 : 0) - (b.max ? 1 : 0) || a.per - b.per);
}
// 공격력 보주: 해당 강 표기 공격력 D를 가장 싸게 1% 올리는 순서
function q59AtkRecs(){
  const rows = [];
  [['power', 57], ['status', 58], ['might', 59], ['divine', 57], ['divine', 58], ['divine', 59]].forEach(([k, lv]) => {
    const own = getOrb(k), name = { power:'힘의 보주', status:'지위의 보주', might:'권력의 보주', divine:'신위의 보주' }[k], atk = UNIT_DATA_5159.find(u => u.lv === lv).atk;
    if(own >= ORB_MAX[k]) { rows.push({ k, lv, name, own, max: true }); return; }
    const cost = gemNextCost(ORB_GEM_KEY[k], own), gain = unit5156Atk(lv, atk, { [k]: own + 1 }) / unit5156Atk(lv, atk) - 1;
    rows.push({ k, lv, name, own, cost, gain, per: gain > 0 ? cost / (gain * 100) : Infinity });
  });
  return rows.sort((a, b) => (a.max ? 1 : 0) - (b.max ? 1 : 0) || a.per - b.per);
}

// 초월 스탯 확률 3종(7쪽-3·4·5): 1레벨 더 찍었을 때 목표 강 도달 증가와 1% 올리는 데 드는 포인트
function q59StatRecs(goal){
  const base = quasarYield({})[goal];
  return [['stat73', 250, 100], ['s57', 2000, 100], ['s58', 3000, 100]].map(([k, pt, mx]) => {
    const obj = k === 'stat73' ? exCalcState.fus : quasarStat, keep = obj[k], own = Number(keep) || 0;
    if(own >= mx) return { k, max: true };
    let y1;
    try{ obj[k] = own + 1; y1 = quasarYield({})[goal]; } finally { obj[k] = keep; }
    const gain = base > 0 ? y1 / base - 1 : 0;
    return { k, gain, per: gain > 0 ? pt / (gain * 100) : Infinity };
  });
}

  // 막대: 같은 묶음에서 가장 싼 것(= 효율 최고)을 100%로 두고, 비용이 10배 커질 때마다 6분의 1씩 짧아진다(로그 눈금 — 값 차이가 수백만 배라 선형이면 막대가 안 보임). 진한 막대 = 최고

  ['low', 'mid', 'eon', 'exp', 'glut', 'mine', 'crit'].forEach(k => { const own = k === 'exp' ? Math.min(1000, Math.floor(exCalcState.orbExp || 0)) : getOrb(k); put('q59o_' + k, own >= ORB_MAX[k] ? '최대' : q59Big(gemNextCost(ORB_GEM_KEY[k], own)), '-', '-'); });

}

// ===================== 시트 데이터 기반 신버전 계산 (경험치 곡선 · 고유유닛 각성 · 미션) =====================
const BIG_KR_UNITS = [['간',10n**36n],['구',10n**32n],['양',10n**28n],['자',10n**24n],['해',10n**20n],['경',10n**16n],['조',10n**12n],['억',10n**8n],['만',10n**4n]];
function bigComma(b){ return BigInt(b).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function bigKR(b, maxParts){
  b = BigInt(b); maxParts = maxParts || 3;
  if(b < 10000n) return b.toString();
  const parts = [];
  for(const [l,v] of BIG_KR_UNITS){ const q = b / v; if(q > 0n){ parts.push(q + l); b -= q * v; } if(parts.length >= maxParts) break; }
  if(parts.length < maxParts && b > 0n) parts.push(b.toString());
  return parts.join(' ');
}
function bigBoth(b){ b = BigInt(b); return b < 10000n ? bigComma(b) : bigComma(b) + ' <span style="color:var(--sub)">(약 ' + bigKR(b) + ')</span>'; }
function parseBigKR(str){
  let t = 0n; const map = Object.fromEntries(BIG_KR_UNITS);
  (String(str).replace(/[,\s]/g,'').match(/\d+[간구양자해경조억만]?/g) || []).forEach(tok => {
    const m = tok.match(/^(\d+)([간구양자해경조억만])?$/); if(m) t += BigInt(m[1]) * (m[2] ? map[m[2]] : 1n);
  });
  return t;
}

// --- 일반 레벨 경험치 (경험치_곡선.csv 검증 완료: 필요 = 652,040×L³, 누적 F(L) = 652,040×(L(L+1)/2)²) ---
const EXP_K = 652040n, EXP_MAX_LV = 300000;
function expNeedBig(L){ L = BigInt(L); return EXP_K * L * L * L; }
function expCumBig(L){ L = BigInt(L); const t = L * (L + 1n) / 2n; return EXP_K * t * t; } // F(L)
function expLandmarkHTML(){
  const lv = [1,10,50,100,500,1000,5000,10000,30000,100000,300000];
  const rows = lv.map(L => `<tr><td>${L.toLocaleString()}</td><td>${bigBoth(expNeedBig(L))}</td><td>${bigBoth(expCumBig(L-1))}</td></tr>`).join('');
  return `<div style="margin-top:12px"><b style="font-size:.9rem">대표 레벨 필요 경험치 (경험치 곡선 시트, 최대 ${EXP_MAX_LV.toLocaleString()}레벨)</b>
    <table style="margin-top:6px"><tr><th>레벨 L</th><th>L → L+1 필요 경험치</th><th>레벨 L 시작 시 누적 F(L−1)</th></tr>${rows}</table>
    <p class="note" style="margin-top:4px">시트의 표는 1~300레벨은 1씩, 그 뒤로는 1,000레벨 간격(300,000까지)이며 모두 위 공식과 정확히 일치합니다. 300,000레벨 행은 「다음 레벨」 값이 비어 있습니다.</p>

      <div class="field" style="width:10em"><label>목표 레벨</label><input id="expB" type="number" min="1" max="${EXP_MAX_LV}" value="10000" oninput="calcExpRange()"></div>
      <div class="field" style="width:22em"><label>보유 총 경험치 → 현재 레벨 (예: 1조 2000억)</label><input id="expTotal" type="text" value="" placeholder="숫자 또는 조·억·만 단위" oninput="calcExpRange()"></div>
    </div>
    <div id="expRangeOut" style="margin-top:8px"></div></div>`;
}
function calcExpRange(){
  const out = document.getElementById('expRangeOut'); if(!out) return;
  const clampL = v => Math.max(1, Math.min(EXP_MAX_LV, Math.floor(parseFloat(v) || 1)));
  const A = clampL(document.getElementById('expA').value), B = clampL(document.getElementById('expB').value);
  const lo = Math.min(A,B), hi = Math.max(A,B);
  let html = `<div class="stat"><span>${lo.toLocaleString()}레벨 → ${hi.toLocaleString()}레벨 필요 경험치</span><span>${bigBoth(expCumBig(hi-1) - expCumBig(lo-1))}</span></div>`;
  html += `<div class="stat"><span>${lo.toLocaleString()}레벨에서 한 단계 올리는 데</span><span>${bigBoth(expNeedBig(lo))}</span></div>`;
  const tv = document.getElementById('expTotal').value.trim();
  if(tv){
    const E = parseBigKR(tv);
    let a = 0, b = EXP_MAX_LV;                       // F(L) <= E 를 만족하는 최대 L
    while(a < b){ const mid = Math.floor((a + b + 1) / 2); if(expCumBig(mid) <= E) a = mid; else b = mid - 1; }
    const level = Math.min(EXP_MAX_LV, a + 1);
    const into = E - expCumBig(level - 1);
    html += `<div class="stat"><span>총 경험치 ${bigKR(E)} → 현재 레벨</span><span><b>${level.toLocaleString()}</b>${level >= EXP_MAX_LV ? ' (최대 레벨)' : ''}</span></div>`;
    if(level < EXP_MAX_LV) html += `<div class="stat"><span>이 레벨 진행도</span><span>${bigKR(into)} / ${bigKR(expNeedBig(level))}</span></div>`;
  }
  out.innerHTML = html;
}

// --- 고유유닛 각성 비용 (고유유닛_각성.csv): 1회 비용 = (L+1)×곱 + 더함, L = 현재 각성 레벨 ---
const AWAKEN_MAX = 4000000000;
// step = 1회 증가량: 한 번 각성하면 비용만큼 재료를 쓰고 L이 step만큼 오른다 (구간별 1 · 100 · 1,000 · 10,000 · 100,000)
const AWAKEN_TIERS = [
  { lo: 0,          hi: 999999,     mul: 1n,      add: 0n,          step: 1n,      expr: 'L + 1' },
  { lo: 1000000,    hi: 9999999,    mul: 100n,    add: 5050n,       step: 100n,    expr: '(L + 1) × 100 + 5,050' },
  { lo: 10000000,   hi: 99999999,   mul: 1000n,   add: 500500n,     step: 1000n,   expr: '(L + 1) × 1,000 + 500,500' },
  { lo: 100000000,  hi: 999999999,  mul: 10000n,  add: 50005000n,   step: 10000n,  expr: '(L + 1) × 10,000 + 50,005,000' },
  { lo: 1000000000, hi: AWAKEN_MAX, mul: 100000n, add: 5000050000n, step: 100000n, expr: '(L + 1) × 100,000 + 5,000,050,000' },
];
function awakenCostBig(L){
  const t = AWAKEN_TIERS.find(t => L >= t.lo && L <= t.hi) || AWAKEN_TIERS[AWAKEN_TIERS.length - 1];
  return (BigInt(L) + 1n) * t.mul + t.add;
}
// 각성 레벨 0 → N까지(레벨이 N 이상이 될 때까지) 각성의 보석 합계: 구간마다 1회 증가량(step)씩 올라가므로 각성 횟수 e = ceil(구간 길이 ÷ step)
function awakenCumBig(N){
  let total = 0n;
  for(const t of AWAKEN_TIERS){
    if(N <= t.lo) break;
    const lo = BigInt(t.lo), lim = BigInt(Math.min(N, t.hi + (t.hi === AWAKEN_MAX ? 0 : 1)));
    const e = (lim - lo + t.step - 1n) / t.step;
    total += e * ((lo + 1n) * t.mul + t.add) + t.mul * t.step * e * (e - 1n) / 2n;
  }
  return total;
}
// 지금 각성 레벨 L0에서 보석 budget개(BigInt)로 몇 번 각성해 몇 레벨 오르는지. 남은 보석은 다음 각성 진행도(소수)로 돌려준다.
function awakenReach(L0, budget){
  let L = BigInt(L0), left = budget, gained = 0n;
  const MAX = BigInt(AWAKEN_MAX);
  for(const t of AWAKEN_TIERS){
    if(L > BigInt(t.hi) || L >= MAX) continue;
    const tierEnd = t.hi === AWAKEN_MAX ? MAX : BigInt(t.hi) + 1n;
    if(L < BigInt(t.lo)) continue;
    const maxE = (tierEnd - L + t.step - 1n) / t.step;           // 이 구간에서 남은 각성 횟수
    const c0 = (L + 1n) * t.mul + t.add;                         // 지금 각성 비용
    const costE = e => e * c0 + t.mul * t.step * e * (e - 1n) / 2n;
    let lo = 0n, hi = maxE;
    while(lo < hi){ const mid = (lo + hi + 1n) / 2n; if(costE(mid) <= left) lo = mid; else hi = mid - 1n; }
    left -= costE(lo); L += lo * t.step; gained += lo * t.step;
    if(lo < maxE){ const next = ((L + 1n) * t.mul + t.add); return { gained, frac: Number(left * 10000n / next) / 10000, step: t.step }; }
  }
  return { gained, frac: 0, step: 1n };
}
function awakenTierTableHTML(){
  const rows = AWAKEN_TIERS.map((t, i) => {
    const cnt = t.hi - t.lo + 1;
    return `<tr><td>${t.lo.toLocaleString()} ~ ${i === AWAKEN_TIERS.length - 1 ? '(최대 40억)' : t.hi.toLocaleString()}</td><td style="text-align:left">${t.expr}</td><td>${bigComma(awakenCostBig(t.lo))}</td><td>+${t.step.toLocaleString()}</td><td>${bigKR(awakenCumBig(t.hi + 1), 3)}</td></tr>`;
  }).join('');
  return `<table><tr><th>현재 각성 레벨 L</th><th style="text-align:left">1회 비용(각성의 보석)</th><th>구간 첫 비용</th><th>1회 증가량</th><th>0레벨부터 구간 끝까지 누적</th></tr>${rows}</table>`;
}
function calcAwaken(){
  const out = document.getElementById('awakenOut'); if(!out) return;
  const cl = v => Math.max(0, Math.min(AWAKEN_MAX, Math.floor(parseFloat(v) || 0)));
  const A = cl(document.getElementById('awA').value), B = cl(document.getElementById('awB').value);
  const lo = Math.min(A,B), hi = Math.max(A,B);
  let html = '';
  if(lo < AWAKEN_MAX) html += `<div class="stat"><span>${lo.toLocaleString()}레벨에서 다음 각성 1회 비용</span><span>${bigBoth(awakenCostBig(lo))}</span></div>`;
  html += `<div class="stat"><span>${lo.toLocaleString()} → ${hi.toLocaleString()}레벨 누적 각성의 보석</span><span>${bigBoth(awakenCumBig(hi) - awakenCumBig(lo))}</span></div>`;
  out.innerHTML = html;
}

function gemFormulaTableHTML(kind){                       // kind: 'gem' | 'orb'
  const L = 'style="text-align:left;font-family:inherit;white-space:normal"', N = 'style="text-align:left;font-family:inherit;white-space:nowrap"';
  const fmt = b => { b = BigInt(b); return b < 100000000n ? bigComma(b) : bigComma(b) + ' <span style="color:var(--sub)">(' + bigKR(b, 2) + ')</span>'; };
  const list = GEM_META.filter(m => kind === 'orb' ? m[0].startsWith('orb_') : !m[0].startsWith('orb_'));
  const rows = list.map(m => {
    const d = GEM_COST_DEFS[m[0]], max = d.max;
    return `<tr><td ${N}>${m[1].replace('보주 ','').replace('보석 ','')} ${m[2]}</td><td ${N}>${m[3]}</td><td ${L}>${m[4]}</td><td>${max.toLocaleString()}</td><td>${fmt(gemCostBig(m[0],1))}</td><td>${fmt(gemCostBig(m[0],max))}</td><td>${fmt(gemCumBig(m[0],max))}</td><td ${L}>${d.formula}</td></tr>`;
  }).join('');
  return `<table><tr><th style="white-space:nowrap">위치</th><th style="text-align:left;white-space:nowrap">이름</th><th style="text-align:left">효과</th><th>최대 개수</th><th>첫 1개 비용</th><th>마지막 1개 비용</th><th>최대까지 누적 비용</th><th style="text-align:left">비용 공식 (n = 몇 번째 1개)</th></tr>${rows}</table>`;
}
function gemLookupHTML(){
  const opts = GEM_META.map(m => `<option value="${m[0]}">${m[3]} (${m[5]})</option>`).join('');
  return `<div style="display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end;margin-top:8px">
    <div class="field" style="width:16em"><label>보석 / 보주</label><select id="glKey" onchange="calcGemLookup()">${opts}</select></div>
    <div class="field" style="width:9em"><label>n번째(개수)</label><input id="glN" type="number" min="1" value="10" oninput="calcGemLookup()"></div>
  </div><div id="glOut" style="margin-top:8px"></div>`;
}
function calcGemLookup(){
  const out = document.getElementById('glOut'); if(!out) return;
  const key = document.getElementById('glKey').value, d = GEM_COST_DEFS[key], m = GEM_META.find(x => x[0] === key);
  const n = Math.max(1, Math.min(d.max, Math.floor(parseFloat(document.getElementById('glN').value) || 1)));
  out.innerHTML = `<div class="stat"><span>${m[3]} ${n.toLocaleString()}번째 1개 비용 (${m[5]})</span><span>${bigBoth(gemCostBig(key, n))}</span></div>
    <div class="stat"><span>1~${n.toLocaleString()}개 누적 비용</span><span>${bigBoth(gemCumBig(key, n))}</span></div>
    <div class="stat"><span>공식</span><span style="text-align:right;white-space:normal">${d.formula}</span></div>
    <div class="stat" style="border-bottom:none"><span>최대 ${d.max.toLocaleString()}개까지 누적</span><span>${bigBoth(gemCumBig(key, d.max))}</span></div>`;
}

    <p class="note" style="margin-top:0;margin-bottom:8px"><b>적용 규칙</b> — ① <b>상위 단계를 뽑으면 아래 단계 첫 달성 보상도 모두 받습니다</b>(제보 #74). 자동화 보석·내부계산으로 중간 단계를 건너뛰어도 예를 들어 50강을 뽑는 순간 아직 안 받은 20~50강 보상이 한꺼번에 들어옵니다. 오른쪽 「누적」 열이 그 단계를 처음 뽑을 때(아래를 하나도 안 받았을 때) 받는 합계입니다. ② <b>크레딧·경험치에 각성 자릿수 ×1.5ⁿ</b>(무색 조각은 그대로). 누적 열은 지금 입력(성취의 보석 ${g}개 · 각성 ${d}자리 ×${(Math.round(Math.pow(1.5, d) * 1000) / 1000).toLocaleString()}) 기준이며, 보석 몫을 내린 뒤 각성 배수를 곱했습니다(게임의 내림 순서는 미확인).</p>

// ===================== 44~50강 시간당 무조 · 각보 · 크레딧 요약 (스탯 표 바로 아래) =====================
// 개인보스 단계 배수 = LV.MAX 허수아비 타격당 무색 조각 적립 배수(개인보스 시트). 0단계(미클리어)도 인게임에서 타격당 +1 적립이 확인되어 1로 둔다(1단계와 같음).
function bossScarecrowMult(stage){
  stage = Math.max(0, Math.min(10, Math.floor(stage) || 0));
  if(stage <= 0) return 1;
  return stage <= 5 ? BOSS_DATA[stage - 1].scare : BOSS_DATA_HIGH[stage - 6].scare;
}
// LV.MAX 허수아비(허수맥스)를 치는 유닛의 시간당 타격 수 — 공속 실측 배율·배속 반영. (돈은 모든 타격만큼 들어온다)
// 41~50강 유닛과 LV.MAX 사냥터의 고유유닛(현재 레벨 1만 이상)이 대상이고, 허수광산을 치는 유닛(51강 이상, 광산이 열려 광산이 더 벌리는 41~50강·고유유닛)은 허수맥스를 안 쳐서 무조가 없다.
function maxScarecrowHitsPerHour(){
  let perSec = 0;
  huntUnitRows.forEach(row => {
    if(row.lv >= 41 && row.lv <= 50 && !unitHitsMine(row.lv) && row.count > 0){ const u = getHuntUnitData(row.lv); if(u) perSec += row.count * getUnitPracticalDps({ atk: 1, hits: u.hits || 1, spd: u.spd }); }
  });
  const uq = getUniqueUnitHunt(); if(uq.zone === 'MAX' && !uniqHitsMine()) perSec += uq.hitRate;
  return perSec * 3600 * speedMult();
}
// ===== 허수아비 무색 조각 적립 = 「때린 순간」마다 한 번 (제보 #72: 같은 순간에 여러 유닛이 때려도 적립은 한 번, 돈은 모든 피해만큼) =====
// 순간 = 1프레임으로 본다. 한 프레임에 적립이 일어날 확률 = 1 − Π(1 − p) (p = 그 흐름이 적립하는 프레임 비율, 다타 유닛도 공격 1번 = 1순간). 강이 다르면 박자가 따로라 서로 독립.
//  · 공속 고정(극한·초월·무한 = 48·49·50강, 5·3·1프레임마다 공격): 사냥터에 들어온 순간이 박자(위상)를 정한다 — 함께 옮긴 유닛만 같은 박자(48강 2기·12기 묶음 = 1/N).
//    실제 플레이처럼 따로 들어오면 기마다 새 박자를 차지 (실측 2026-10-06, 10보스 테스트 맵, 돈으로 타수·무조로 순간을 셈):
//    48강 시차 2기 겹침 0 · 1기씩 12기 0.801 · 0→48기 채움 6~48기 내내 0.79~0.81(5박자 중 4개에서 멈춤) → min(기수, 4) ÷ 5
//    49강 1기씩 ⅓ → ⅔ → 3기↑ ⅔~1을 오감(평균 약 0.85) → min(기수 ÷ 3, 0.85) · 50강 1기 = 매 프레임(48강 꽉 찬 사냥터 + 50강 1기 1.00) → 1
//  · 그 밖(매우느림~매우빠름, 41~47강): 공속 랜덤으로 기마다 독립 흐름, p = 24프레임당 공격 수 ÷ 24. 실측 47강 12기(묶어 옮김) 0.657 ↔ 예측 0.659.

// 지금 플레이 시간(gameHours)부터 hours시간 동안 S강 판매 개수의 합.

function salePullsOverHours4450(S, hours, cache, valOf){

function crystalCostTableHTML(nums, lo, hi){
  const groups = [];
  nums.forEach(n => {
    const seq = CRYSTAL_COSTS[n].slice(lo - 1, hi), key = JSON.stringify(seq);
    let g = groups.find(x => x.key === key); if(!g){ g = { key, seq, nums: [] }; groups.push(g); }
    g.nums.push(n);
  });
  const label = g => {
    const grades = {}; g.nums.forEach(n => { const gr = CRYSTAL_SHEET.find(r => +r[0] === n)[1]; grades[gr] = (grades[gr] || 0) + 1; });
    return g.nums.length > 4 ? Object.entries(grades).map(([k, v]) => k + ' ' + v + '종').join(' · ') : g.nums.map(crystalShortName).join(' · ');
  };
  groups.forEach(g => { g.cum = []; const c = {}; CRYSTAL_COSTS[g.nums[0]].forEach(([m, v], i) => { c[m] = (c[m] || 0) + v; if(i + 1 >= lo && i + 1 <= hi) g.cum.push(c[m]); }); });
  const maxLen = Math.max(...groups.map(g => g.seq.length));
  let body = '';
  for(let i = 0; i < maxLen; i++){
    body += `<tr><td>${lo + i}</td>` + groups.map(g => g.seq[i] === undefined ? '<td>-</td><td>-</td><td>-</td>' : `<td style="white-space:nowrap;text-align:left;font-family:inherit;color:var(--sub)">${CRYSTAL_MATS[g.seq[i][0]]}</td><td>${sheetNum(g.seq[i][1])}</td><td>${sheetNum(g.cum[i])}</td>`).join('') + '</tr>';
  }
  const head1 = groups.map(g => `<th colspan="3" style="text-align:center;white-space:normal">${label(g)}</th>`).join('');
  const head2 = groups.map(() => '<th style="text-align:left">재료</th><th>비용</th><th>누적 비용(같은 재료)</th>').join('');
  return `<table><tr><th rowspan="2">단계</th>${head1}</tr><tr>${head2}</tr>${body}</table>`;
}

// 뽑기 배수(배수_정리 시트) = 기본 1 + 핫타임 1 + 특별 핫타임 3 + 멀티 보너스 1 + 45~50강 판매 2배 쿠폰 1 (최대 7).
//  → 유닛 1기를 팔 때 뽑기 결과가 「뽑기 배수」번 붙는다(크레딧 비용은 배수와 무관 — 45~50강 1기당 100; 50강 크레딧 보상에도 배수 적용 확인).
function gachaPullMult(){ return 1 + (couponState.hot ? 1 : 0) + (couponState.special ? 3 : 0) + (couponState.multi ? 1 : 0) + (couponState.sell2x ? 1 : 0); }
function gachaUnitExpectation(lv){                       // 유닛 1기를 팔았을 때의 기대값
  const unit = GACHA_DROPS_4550[lv], M = gachaPullMult();
  let shards = unit.baseShards, awaken = 0, credit = 0;
  unit.rewards.forEach(rw => {
    const e = rw.amount * rw.prob / 100;
    if(rw.kind === 'shards') shards += e; else if(rw.kind === 'awakening') awaken += e; else if(rw.kind === 'credit') credit += e;
  });
  return { M, shards: shards * M * shardSupportMult(), awaken: awaken * M * awakenSupportMult(), creditNet: (unit.cost - credit * M) * (1 - sellDiscountPct() / 100),   /* 판매가와 뽑기 크레딧 당첨 모두 × (100 − 할인)% (건의 #17 — 영상 확인 2026-10-07: 할인 50% · 뽑기 배수 2에서 50강 크레딧 당첨 1회 = 2,000 × 2 × (1 − 0.5) = 2,000, 옛 규칙이면 4,000) */ perPull: { shards, awaken, credit } };   // 후원 무색 조각·각성의 보석 배수 포함
}

// 허수맥스 1타 = 표기 공격력 × 10^10 × 돈 증가량 배수,  표기 공격력 = 기본 × (1 + 0.1×공업 + 보스%) × (1 + 0.1×적대)

// 51강 이상 유닛 1타 = 1.179×10^15 × (M + 2×표기 공격력 D) × 돈 증가량 배수 (크리티컬은 M + 4×D), M = int(1 + 0.1×공업 + 보스%)
const MINE_BASE = 1.179e15;

// 실측 (1P-1 56 · 재물 2): 각성 0 → 120% × 1.56 = 187.2 → 187, × 폭식 7개(1.7) = 317.9 → 317
//   각성 2 → 144% × 1.56 = 224.64 → 224, × 1.7 = 380.8 → 380 / 각성 3 → 156% × 1.56 = 243.36 → 243, × 1.7 = 413.1 → 413
//   각성 4 → 168% × 1.56 = 262.08 → 262, × 1.7 = 445.4 → 445 (각성이 1P-1 뒤에 오는 순서는 443%라 아님. 마지막에 한 번만 내리는 방식은 각성 0 · 폭식 7개에서 318%라 이미 탈락)
// 51레벨 + 재물 1 → 110% × 1.51 = 166.1 → 166, 56레벨 + 재물 1 → 171.6 → 171. 정수 비교를 위해 BigInt 사용.

// 재물 × 각성 바로 뒤에 한 번 내리는 것으로 가정(진 각성 0이면 아무 영향 없음).
function moneyPctMult(s, w, g, a, t, pm){
  t = t || 0; pm = pm === undefined ? pamMoneyMult() * bondMoneyMult() : pm;   // pm: 파멸 최종 돈 배수 × 인연의 보주 (허수광산 계산기는 파멸을 자기 입력칸으로 따로 곱해서 인연만 넘긴다)
  const raw = (1 + 0.01 * s) * (1 + 0.1 * w) * (1 + 0.1 * g) * (1 + 0.1 * a) * (1000 + t) / 1000;
  if(![s, w, g, a, t].every(x => isFinite(x) && x < 1e10)) return raw * pm;
  let p = BigInt(Math.round(10 + w)) * BigInt(Math.round(10 + a));   // 재물 × 각성 (이미 정수 %)
  if(t > 0) p = p * BigInt(Math.round(1000 + t)) / 1000n;             // × 진 각성, 내림 (가정)
  p = p * BigInt(Math.round(100 + s)) / 100n;                          // × 1P-1, 내림
  p = p * BigInt(Math.round(10 + g)) / 10n;                            // × 폭식, 내림
  return Number(p) / 100 * pm;
}
function mineMoneyCalc(p){

  const moneyMult = moneyPctMult(p.stat11, p.wealth, p.glut || 0, p.awaken, trueAwakenLevel, bondMoneyMult());

}

// ===================== 허수광산 계산기 =====================
function bigOf(x){
  // 부동소수 잡음(…9999조) 제거: 15자리 유효숫자로 반올림한 십진 정수를 BigInt 로
  if(!isFinite(x) || x < 1e15) return BigInt(Math.round(x));
  const e = x.toExponential(14), m = e.match(/^(\d)\.(\d+)e\+(\d+)$/);
  if(!m) return BigInt(Math.round(x));
  return BigInt(m[1] + m[2]) * (10n ** BigInt(parseInt(m[3], 10) - 14));
}

// 51~59강 허수광산 크레딧의 강별 배수: 같은 시간 기준 51강 1배, 이후 한 단계마다 2배 (59강 256배)
function mineCreditLvMult(lv){ return Math.pow(2, Math.max(0, Math.min(59, lv) - 51)); }
// 광산 단수(내 광산 포인트로 결정, 0·1단은 ×1)는 강별 배수에 곱해지고, 2배권은 그 뒤 최종 2배
function mineCreditMult(lv, step, c2x){ return mineCreditLvMult(lv) * Math.max(1, step) * c2x; }
// 생명의 크리스탈: 51~59강 허수광산 크레딧 최종 ×1.1ⁿ
function mineCreditExtraMult(){ return Math.pow(1.1, Math.max(0, Math.min(30, Math.floor(exCalcState.lifeCry) || 0))); }
// 채취효율(L창 4쪽 표기, 정수 %) = ⌊채광의 보주 × (탐욕·창조) × 후원 ×3 × 초월 8쪽-3(1 + 0.01n)⌋ — 보주 1개 + 8쪽-3 1회 + 후원 3 = 333%, 한 타 크레딧도 3.333이 아니라 정수 333%로 계산됨(2026-10-12 실측)
function mineEffTotalPct(orbN){ return Math.floor(mineEffPct(orbN) * mineCreditSupportMult() * (1 + 0.01 * Math.max(0, Math.min(200, Math.floor(quasarStat.s83) || 0))) + 1e-9); }
// 광산 타격시 크레딧 채취효율 (인게임 L창 4쪽 「광산 타격시 크레딧 채취효율」 = 채광의 보주 x 탐욕·창조) — 2026-10-04 실측:
//   채광의 보주 n개 = 100%에서 시작해 한 개마다 ⌊효율 × 1.1⌋(정수 %): 10개 256%, 100개 1,333,776% ≈ ×13,338(보석 표 문구와 일치). 55강·광산 16단·2배권(한 타 128)에 보주 10개 → 한 타 327(= ⌊128 × 2.56⌋).
//   탐욕 1레벨 + 보주 10개: L창 307% (= ⌊256 × 1.2⌋) 확인. 창조(+30%/Lv)는 탐욕과 합연산 — 창조 (+2) 480%, 거기에 탐욕 (+1) 540% 확인(2026-10-10, 채광의 보주 0개, 후원 3배 포함 표기). 한 타 크레딧의 소수는 버려지지 않고 이월(누적)된다(54강 5타 합 368 = ⌊5×73.68⌋, S21) — 그래서 소수 그대로 평균으로 둔다.
function mineOrbPct(n){ let p = 100; const k = Math.max(0, Math.min(100, Math.floor(n) || 0)); for(let i = 0; i < k; i++) p = Math.floor(p * 11 / 10); return p; }
function mineEffPct(orbN){ return Math.floor(mineOrbPct(orbN) * (100 + 20 * getQuasarLv('tamyok') + 30 * getOriginLv('changjo')) / 100); }
// 광산 1타 크레딧(진 각성·후원 배수까지) = (프레임 ÷ 24) × 추가 배수 × (강별 배수 × 광산 단수) × 2배권 × 채취효율(후원 ×3 · 초월 8쪽-3 포함, 정수 % — L창 4쪽 표기) × 진 각성 × 생명. [허수광산 계산기]와 [56~59강 정보]의 크레딧 수지가 같이 쓴다.
function mineCreditHitOf(u, orbN, cm, step, c2x){ return (SPD_FRAMES[u.spd] / 24) * cm * mineCreditMult(u.lv, step, c2x) * (mineEffTotalPct(orbN) / 100) * trueAwakenMult() * mineCreditExtraMult(); }
function updateMineField(sfx){

  normal.push(['특수 파괴 방지확률 총 증가량', P(sp.pabang), `스텟·고유유닛 ${stat((g(2, 5) + g(2, 6)) * 0.1 + getRaceInv('X'))} + 보석 ${stat(agg.pabangAdd)} + 크리스탈 ${stat(crystalPabang())} (합이 ${PABANG_MAX}%p를 넘으면 잘림) · 인게임 MAX ${PABANG_MAX}%p`]);

  // ---- 강화확률: 초월 강화 (50~59강) — 초월 스탯 기준 추가분 ----
  const trans = [
    ['50강 초월강화 확률', P(ex.p[50]), `초월 레벨 ${stat(exLevel * 0.01)} + 스탯 ${stat(ex.exPart.stat)} + 인내의 보석 ${stat(ex.exPart.pat)} + 크리스탈 ${stat(ex.exPart.crystal)}`],
    ['추가 51강 강화확률', P(exStep('5_2')), '초월 스탯 5쪽-2'],
    ['추가 52강 강화확률', P(exStep('5_3')), '초월 스탯 5쪽-3'],
    ['추가 53강 강화확률', P(exStep('5_4')), '초월 스탯 5쪽-4'],
    ['추가 54강 강화확률', P(exStep('5_5') + exStep('7_1')), '초월 스탯 5쪽-5 + 7쪽-1'],
    ['추가 55강 강화확률', P(exStep('5_6') + exStep('7_2')), '초월 스탯 5쪽-6 + 7쪽-2'],
    ['추가 56강 융합확률', P(fusionProb().p - fusionProb().parts.base - fusionProb().parts.multi, 3), '7쪽-3 스탯 + 집중 + 상급·명운의 보주 + 60강 희생 버프 ([56~59강 정보] 탭 입력) · 필요 마릿수 ' + fusionNeed().toLocaleString() + '마리(절약의 보주·절제)'],
    ['추가 57강 강화확률', P(quasarProbs().p[57] - quasarProbs().parts[57].base - quasarProbs().parts[57].multi, 3), '7쪽-4 스탯 + 특급·성운의 보주 + 파멸 ([56~59강 정보] 탭 입력)'],
    ['추가 58강 강화확률', P(quasarProbs().p[58] - quasarProbs().parts[58].base - quasarProbs().parts[58].multi, 3), '7쪽-5 스탯 + 고급·천운의 보주 + 파멸 ([56~59강 정보] 탭 입력)'],
    ['추가 59강 강화확률', P(quasarProbs().parts[59].void, 3), '무위의 보주 ([56~59강 정보] 탭 입력)'],
  ];

  // ---- 획득량 · 할인 ----
  const expAdd = (1 + bb.expPercent / 100 + getRaceInv('E') * 20 / 100 + getGemInv('exp') * 10 / 100 + (charLevel < 1000 ? 1 : 0) - 1) * 100;
  const mineEff = (1 + 0.2 * getQuasarLv('tamyok') + 0.3 * getOriginLv('changjo')) * 100;
  const rest = getGemInv('rest'), relax = getGemInv('relax');
  const gain = [
    ['개별확률 하락 방어 시간', `+${dropDefendHours()} 시간`, '후원 특전 + 크리스탈(방어·홍색·파랑 24시간/Lv, 흑색 60시간/Lv). LV.10 후원·우주 크리스탈이면 하락 없음'],
    ['45~50강 유닛 판매시 가격 할인량', '+' + sellDiscountPct() + '%p', `크리스탈 합산(절약·주황·보라 1% · 흑색 2% · 우주 5%/Lv, 100%면 무료) → 1기당 ${Math.round(10000 * (1 - sellDiscountPct() / 100)).toLocaleString()} 크레딧 · 52강 이상 판매는 이 할인이 없음(52~56강 1,000 · 57~60강은 시간의 크리스탈 1강당 −1%, 최대 30% → 현재 ${sale5760Credit().toLocaleString()})`],
    ['무색 조각 획득량', n2(shardSupportMult() * 100, 2) + '%', `(100 + 후원 +${supportAddSum('무색 조각')}% + 크리스탈 +${crystalShardPct()}%[총명·주황·하늘 50 · 흑색 100 · 우주 200 /Lv]) × 후원 최종 ×${supportFinalMult('무색 조각')} — 크리스탈은 [50~56강] 탭 입력`],
    ['각성의 보석 획득량', n2(awakenSupportMult() * 100, 2) + '%', `(100 + 후원 +${supportAddSum('각성의 보석')}% + 크리스탈 +${crystalAwakenPct()}%[각성·노랑·하늘 100 · 흑색 200 /Lv · 우주 500/Lv(15,000%까지)+10,000×(Lv−20)]) × 후원 최종 ×${supportFinalMult('각성의 보석')} × 창조 ×${n2(1 + 0.1 * getOriginLv('changjo'), 2)}`],
    ['초월 경험치 획득량 (일반 경험치와 별개)', n2(exExpMult() * 100, 2) + '%', `후원 +${supportAddSum('초월 경험치')}%·최종 ×${exExpMultParts().fin} + 크리스탈·경험의 보주 ([50~56강] 탭 입력) + 창조 + 생명 × 진 각성 ${trueAwakenDigits()}자리 ×${n2(trueAwakenMult(), 3)} ×핫타임(${exExpHotMult()}배)`],
    ['응축된 무색 조각 획득량', n2(condGainPct(), 2) + '%', `(100 + 후원 +${supportAddSum('응축된 무색 조각')}% + 60강 희생 +${sac60CondBuff()}% + 초월 7쪽-6 +${quasarStat.s76}%p + 생명의 크리스탈 ${exCalcState.lifeCry || 0}Lv ×10%, 합연산) × 후원 최종 ×${supportFinalMult('응축된 무색 조각')} — 7쪽-6 +1%p/Lv(500% → 501%)와 생명 +10%p/Lv(501% → 511%)는 인게임 확인`],
    ['일반 경험치 최종 획득량', n2(100 * Math.pow(1.1, getGemInv('mastery')) * awakenExpMult(), 2) + '%', `숙련의 보석 ${getGemInv('mastery')}개 × 각성 ${awakenDigits()}자리 (각각 ×1.1, 곱연산 — L 키 4쪽)`],
    ['판매시 경험치 추가 획득량', PC(expAdd, 0), `개인보스 ${bb.expPercent}% + 고유유닛 경험치 ${getRaceInv('E') * 20}% + 경험의 보석 ${getGemInv('exp')}개 ${getGemInv('exp') * 10}%${charLevel < 1000 ? ' + 1000레벨 미만 100%' : ''}`],
    ['광산 타격시 크레딧 채취효율', n2(mineEffTotalPct(getOrb('mine')), 0) + '%', `(채광의 보주 ${getOrb('mine')}개 → ${mineOrbPct(getOrb('mine'))}% × 탐욕 ${getQuasarLv('tamyok')}강 · 창조 ${getOriginLv('changjo')}강) × 초월 8쪽-3 ${quasarStat.s83 || 0}회(+1%p/회) × 후원 ×${mineCreditSupportMult()} — L창 4쪽 표기와 같은 값이고 한 타 크레딧도 이 정수 %로 계산됨(보주 1개 + 8쪽-3 1회 + 후원 3 = 333% → 한 타 +11,347 실측 ✅, 8쪽-3 50회 + 보주 1개 = 495% 실측 ✅ — 곱, 합산이면 480%)`],
    ['허수광산 크레딧 최종 곱 (생명)', '×' + n2(mineCreditExtraMult(), 3), `생명의 크리스탈 ${exCalcState.lifeCry || 0}Lv × 1.1ⁿ — 51~59강 허수광산 크레딧 한 타에 곱함(초월 8쪽-3 ${quasarStat.s83 || 0}회는 위 채취효율 %에 들어 있음)`],
    ['첫 달성 보상 배수 (크레딧·경험치)', Math.floor((100 + 10 * getGemInv('achieve')) * awakenFirstClearMult()).toLocaleString() + '%', `성취의 보석 ${getGemInv('achieve')}개 = ${100 + 10 * getGemInv('achieve')}% (개당 +10% 합연산) × 각성 ${Math.floor(awakenFirstClearMult() * 100).toLocaleString()}% (${awakenDigits()}자리, 자리당 ×1.5) — L 키 4쪽 표기와 같음`],
    ['허수광산 크레딧 진 각성 배수 (51강 이상)', '×' + n2(trueAwakenMult(), 3), `진 각성 ${trueAwakenLevel.toLocaleString()} = ${trueAwakenDigits()}자리 (자리당 ×1.1)`],
    ['오프라인 보상 (ExPoint)', `최대 ${24 + rest + (supportLevel >= 9 ? 48 : 0) + 2 * timeCryLv()} 시간 인정, 배수 ${100 + 5 * relax + (supportLevel >= 9 ? 100 : 0) + 10 * Math.min(30, exCalcState.lifeCry || 0)}%`, `시간당 ExPoint ${(10000 * (1 + 0.05 * relax)).toLocaleString()}(= 1만 × (1 + 휴양 5%/개), 인게임 확인: 배수 200%에서 1만 · 휴양 100개 배수 700%에서 6만 — 후원 +100%는 안 곱해지고 생명 반영은 미시험) · 휴식의 보석 ${rest}개(+${rest}시간) · 휴양의 보석 ${relax}개(개당 +5%) · 후원 LV.9 이상 +48시간·+100% · 시간의 크리스탈 ${timeCryLv()}Lv × 2시간 · 생명의 크리스탈 ${Math.min(30, exCalcState.lifeCry || 0)}Lv × 10%p (인게임 확인: 시간 (+2) 최대 216 → 220시간, 생명 (+2) 700 → 720% · 후원 LV.20 · 보석 · 크리스탈 없음에서 L창 2쪽 「최대 72시간 · 배수 200%」, 비운 1분 → 236 · 5분 → 980 · 9분 → 1,561 ExPoint, 휴양 100개 배수 700%에서 5분 → 5,883)`],
    ['ExPoint 수급량 (크리스탈)', `+${20 * getQuasarLv('mirae') + 30 * getOriginLv('changjo')}%`, `미래 ${getQuasarLv('mirae')}Lv × 20% + 창조 ${getOriginLv('changjo')}Lv × 30% (합산 방식·적용되는 ExPoint 수급원은 인게임 확인 전 — 엑보 FI 타격 ExPoint에는 최종 배수가 안 붙는다는 README 문구와의 관계도 미확인)`],
    ['Extra Boss 데미지 (크리스탈)', `+${10 * getQuasarLv('dolpa')}%`, `돌파 ${getQuasarLv('dolpa')}Lv × 10% (크리스탈.csv 「Extra Boss에 대한 데미지」 — 52강 공격력 200 · 강타 1 · 돌파 1에서 엑보 타수 +1,101, BOSS DPS ×1.1 확인)`],
  ];

  // ---- 공격력 · 돈 수급 ----
  const moneyMult = moneyPctMult(g(1, 1), getGemInv('wealth'), getOrb('glut'), effectiveAwakenLevel(), trueAwakenLevel);
  const power = [
    ['총 공격력 증가량', PC(g(1, 2) * 10 + bb.atkPercent, 0), `공업 ${g(1, 2)}레벨 ${g(1, 2) * 10}% + 개인보스 ${bb.atkPercent}% (적대의 보석은 별도 곱)`],
    ['LV.MAX 허수아비, 허수광산 돈 수급 총 증가량', PC(moneyMult * 100, 0), `총 배수 (인게임 표기: 1P-1 1레벨 = +101%) = 재물의 보석 ×${n2(1 + 0.1 * getGemInv('wealth'), 2)} × 각성 ×${n2(awakenMoneyMult(), 2)}${trueAwakenLevel > 0 ? ' × 진 각성 ×' + n2(trueAwakenBaseMult(), 3) : ''}를 먼저 곱한 뒤 1P-1 ×${n2(1 + 0.01 * g(1, 1), 2)}를 곱해 정수 %로 내림 (예: 120% × 1.56 = 187.2% → 187%) (폭식의 보주 ${getOrb('glut')}개는 그 뒤에 한 번 더 곱해 내림)${bondOrbOwned() ? ' · 인연의 보주 ×' + bondMoneyMult() + ' 포함' : ''}`],
  ];

  // ---- 자판기 · 크리티컬 · 배속 ----
  const crit = mineCritInfo();
  const speed = [
    ['자판기 1 최종 촉진 계수', String(Math.round(vendBoostOf(1) * 1000) / 1000), `(1 + 3P-6 ${g(3, 6)}레벨×10 + 고유유닛 단수 촉진 ${raceVendBonus(1)} + 초월 8쪽-1 ${quasarStat.s81.toLocaleString()}Lv×1,000) × 최종 유닛 생산량 ×${n2(finalProdMult(), 2)} (증식 ${getQuasarLv('jeungsik')}Lv · 파멸 ${getOriginLv('pamyul')}Lv · 시간 ${timeCryLv()}Lv, 합연산, 소수 버림)${moonOrbOwned() ? ` × 월륜의 보주 ×${n2(moonVendMult(), 1)} (초월 레벨 ${digitCount(exLevel)}자리 × 10%, 소수 버림)` : ''} × 촉진의 보석 ×${n2(vendGemMult(), 2)} (${Math.min(getGemInv('accel'), VENDING_DATA.gemMax)}개 × 0.01, 최대 ${VENDING_DATA.gemMax}개 · 마지막에 곱하고 다시 내림)`],
    ['자판기 2 최종 촉진 계수', String(Math.round(vendBoostOf(2) * 1000) / 1000), `자판기 1과 같은 식 (고유유닛 단수 촉진 ${raceVendBonus(2)} · 8쪽-2 ${quasarStat.s82.toLocaleString()}Lv) — 총 단수 ${unitStepDisplay().toLocaleString()}단, 500n+106단마다 +1이 자판기 2 → 자판기 1 순으로 번갈아 붙음`],
    ['크리티컬 확률', n2(crit.p * 100, 2) + ' %', '기본 1% + 파멸의 크리스탈 2%/Lv (절명의 보주는 [56~59강 정보] 탭 보주 칸 — 인게임 확인: 절명 500개 = 51%)'],
    ['크리티컬에 의한 데미지 배율', crit.mult + ' 배', `기본 2배 + 우주의 크리스탈 21강부터 1강당 +1배 (우주 ${Math.min(50, (exCalcState.cry && exCalcState.cry.uju) || 0)}강, [50~56강] 탭 입력)`],
    ['현재 배속', `1프레임 ${speedFrame()}ms (×${n2(speedMult(), 3)})`, `일반 레벨 ${digitCount(charLevel)}자리 + 초월 레벨 ${digitCount(exLevel)}자리 = ${speedDigits()}자리 (12자리면 13ms)`],
    ['ExPoint', { html: `<input id="specExPt" type="number" min="0" step="1" placeholder="0" value="${specExPoint || ''}" style="width:9em;height:26px;padding:0 6px;font-size:.85rem;text-align:right" oninput="setSpecExPoint(this.value)">` }, '직접 입력 (저장됨)'],
  ];

  return [
    { title: '강화확률', groups: [{ sub: '일반 강화 (1~48강)', rows: normal }, { sub: '초월 강화 (50~58강)', rows: trans }] },
    { title: '획득량 · 할인', groups: [{ rows: gain }] },
    { title: '공격력 · 돈 수급', groups: [{ rows: power }] },
    { title: '자판기 · 크리티컬 · 배속', groups: [{ rows: speed }] },
  ];
}
function renderSpecSummary(){
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const cards = specSummarySections().map(sec => {
    const body = sec.groups.map(gr => (gr.sub ? `<tr><th colspan="3" style="text-align:left;color:var(--accent2);padding-top:8px">${esc(gr.sub)}</th></tr>` : '')
      + gr.rows.map(r => `<tr><td>${esc(r[0])}</td><td style="text-align:right;font-family:var(--mono);${r[1] && !r[1].html && String(r[1]).length > 14 ? 'white-space:normal;min-width:11em' : 'white-space:nowrap'}">${r[1] && r[1].html ? r[1].html : '<b>' + esc(r[1]) + '</b>'}</td><td style="text-align:left;font-family:inherit;color:var(--sub);font-size:.76rem">${esc(r[2] || '')}</td></tr>`).join('')).join('');
    return `<div class="result" style="margin-top:0;min-width:0"><b>${esc(sec.title)}</b><table style="margin-top:6px"><tr><th>항목</th><th>값</th><th style="text-align:left">계산 근거</th></tr>${body}</table></div>`;
  }).join('');
  host.innerHTML = `
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(560px,1fr));gap:16px">${cards}</div>
  <p class="note" style="margin-top:10px">시트에 입력한 값으로 계산한 총 증가량입니다. 크리스탈 효과, 초월 7쪽-3·8쪽 스탯, 폭식·절명·채광의 보주처럼 입력칸이 없는 값은 포함하지 않았습니다.</p>`;
}

// 모든 변수/함수 선언이 끝난 뒤 상단 공통 입력줄과 첫 탭을 렌더링 (초기화 순서 문제 방지)
renderGlobalBar();
tabs[0].render();
