// ===================== 시트 데이터 기반 신버전 계산 (경험치 곡선 · 고유유닛 각성 · 미션) =====================
const BIG_KR_UNITS = [['간',10n**36n],['구',10n**32n],['양',10n**28n],['자',10n**24n],['해',10n**20n],['경',10n**16n],['조',10n**12n],['억',10n**8n],['만',10n**4n]];
function bigComma(b){ return BigInt(b).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function bigKR(b, maxParts){
  b = BigInt(b); maxParts = maxParts || 3;
  if(b < 10000n) return b.toString();
  const parts = [];
  for(const [l,v] of BIG_KR_UNITS){ const q = b / v; if(q > 0n){ parts.push(q + l); b -= q * v; } if(parts.length >= maxParts) break; }
  if(parts.length < maxParts && b > 0n) parts.push(b.toString());
  return parts.join(' ');
}
function bigBoth(b){ b = BigInt(b); return b < 10000n ? bigComma(b) : bigComma(b) + ' <span style="color:var(--sub)">(약 ' + bigKR(b) + ')</span>'; }
function parseBigKR(str){
  let t = 0n; const map = Object.fromEntries(BIG_KR_UNITS);
  (String(str).replace(/[,\s]/g,'').match(/\d+[간구양자해경조억만]?/g) || []).forEach(tok => {
    const m = tok.match(/^(\d+)([간구양자해경조억만])?$/); if(m) t += BigInt(m[1]) * (m[2] ? map[m[2]] : 1n);
  });
  return t;
}

// --- 일반 레벨 경험치 (경험치_곡선.csv 검증 완료: 필요 = 652,040×L³, 누적 F(L) = 652,040×(L(L+1)/2)²) ---
const EXP_K = 652040n, EXP_MAX_LV = 300000;
function expNeedBig(L){ L = BigInt(L); return EXP_K * L * L * L; }
function expCumBig(L){ L = BigInt(L); const t = L * (L + 1n) / 2n; return EXP_K * t * t; } // F(L)
function expLandmarkHTML(){
  const lv = [1,10,50,100,500,1000,5000,10000,30000,100000,300000];
  const rows = lv.map(L => `<tr><td>${L.toLocaleString()}</td><td>${bigBoth(expNeedBig(L))}</td><td>${bigBoth(expCumBig(L-1))}</td></tr>`).join('');
  return `<div style="margin-top:12px"><b style="font-size:.9rem">대표 레벨 필요 경험치 (경험치 곡선 시트, 최대 ${EXP_MAX_LV.toLocaleString()}레벨)</b>
    <table style="margin-top:6px"><tr><th>레벨 L</th><th>L → L+1 필요 경험치</th><th>레벨 L 시작 시 누적 F(L−1)</th></tr>${rows}</table>
    <p class="note" style="margin-top:4px">시트의 표는 1~300레벨은 1씩, 그 뒤로는 1,000레벨 간격(300,000까지)이며 모두 위 공식과 정확히 일치합니다. 300,000레벨 행은 「다음 레벨」 값이 비어 있습니다.</p>
    <div style="display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end;margin-top:8px">
      <div class="field" style="width:10em"><label>시작 레벨</label><input id="expA" type="number" min="1" max="${EXP_MAX_LV}" value="1000" oninput="calcExpRange()"></div>
      <div class="field" style="width:10em"><label>목표 레벨</label><input id="expB" type="number" min="1" max="${EXP_MAX_LV}" value="10000" oninput="calcExpRange()"></div>
      <div class="field" style="width:22em"><label>보유 총 경험치 → 현재 레벨 (예: 1조 2000억)</label><input id="expTotal" type="text" value="" placeholder="숫자 또는 조·억·만 단위" oninput="calcExpRange()"></div>
    </div>
    <div id="expRangeOut" style="margin-top:8px"></div></div>`;
}
function calcExpRange(){
  const out = document.getElementById('expRangeOut'); if(!out) return;
  const clampL = v => Math.max(1, Math.min(EXP_MAX_LV, Math.floor(parseFloat(v) || 1)));
  const A = clampL(document.getElementById('expA').value), B = clampL(document.getElementById('expB').value);
  const lo = Math.min(A,B), hi = Math.max(A,B);
  let html = `<div class="stat"><span>${lo.toLocaleString()}레벨 → ${hi.toLocaleString()}레벨 필요 경험치</span><span>${bigBoth(expCumBig(hi-1) - expCumBig(lo-1))}</span></div>`;
  html += `<div class="stat"><span>${lo.toLocaleString()}레벨에서 한 단계 올리는 데</span><span>${bigBoth(expNeedBig(lo))}</span></div>`;
  const tv = document.getElementById('expTotal').value.trim();
  if(tv){
    const E = parseBigKR(tv);
    let a = 0, b = EXP_MAX_LV;                       // F(L) <= E 를 만족하는 최대 L
    while(a < b){ const mid = Math.floor((a + b + 1) / 2); if(expCumBig(mid) <= E) a = mid; else b = mid - 1; }
    const level = Math.min(EXP_MAX_LV, a + 1);
    const into = E - expCumBig(level - 1);
    html += `<div class="stat"><span>총 경험치 ${bigKR(E)} → 현재 레벨</span><span><b>${level.toLocaleString()}</b>${level >= EXP_MAX_LV ? ' (최대 레벨)' : ''}</span></div>`;
    if(level < EXP_MAX_LV) html += `<div class="stat"><span>이 레벨 진행도</span><span>${bigKR(into)} / ${bigKR(expNeedBig(level))}</span></div>`;
  }
  out.innerHTML = html;
}

// --- 고유유닛 각성 비용 (고유유닛_각성.csv): 1회 비용 = (L+1)×곱 + 더함, L = 현재 각성 레벨 ---
const AWAKEN_MAX = 4000000000;
const AWAKEN_TIERS = [
  { lo: 0,          hi: 999999,     mul: 1n,      add: 0n,          expr: 'L + 1' },
  { lo: 1000000,    hi: 9999999,    mul: 100n,    add: 5050n,       expr: '(L + 1) × 100 + 5,050' },
  { lo: 10000000,   hi: 99999999,   mul: 1000n,   add: 500500n,     expr: '(L + 1) × 1,000 + 500,500' },
  { lo: 100000000,  hi: 999999999,  mul: 10000n,  add: 50005000n,   expr: '(L + 1) × 10,000 + 50,005,000' },
  { lo: 1000000000, hi: AWAKEN_MAX, mul: 100000n, add: 5000050000n, expr: '(L + 1) × 100,000 + 5,000,050,000' },
];
function awakenCostBig(L){
  const t = AWAKEN_TIERS.find(t => L >= t.lo && L <= t.hi) || AWAKEN_TIERS[AWAKEN_TIERS.length - 1];
  return (BigInt(L) + 1n) * t.mul + t.add;
}
function awakenCumBig(N){                       // 각성 레벨 0 → N까지 각성의 보석 합계
  let total = 0n;
  for(const t of AWAKEN_TIERS){
    if(N <= t.lo) break;
    const last = Math.min(N - 1, t.hi), n = BigInt(last - t.lo + 1), lo = BigInt(t.lo);
    total += t.mul * ((lo + 1n) + (lo + n)) * n / 2n + t.add * n;
  }
  return total;
}
function awakenTierTableHTML(){
  const rows = AWAKEN_TIERS.map((t, i) => {
    const cnt = t.hi - t.lo + 1;
    return `<tr><td>${t.lo.toLocaleString()} ~ ${i === AWAKEN_TIERS.length - 1 ? '(최대 40억)' : t.hi.toLocaleString()}</td><td style="text-align:left">${t.expr}</td><td>${bigComma(awakenCostBig(t.lo))}</td><td>${bigKR(awakenCumBig(t.hi + 1), 3)}</td></tr>`;
  }).join('');
  return `<table><tr><th>현재 각성 레벨 L</th><th style="text-align:left">1회 비용(각성의 보석)</th><th>구간 첫 비용</th><th>0레벨부터 구간 끝까지 누적</th></tr>${rows}</table>`;
}
function calcAwaken(){
  const out = document.getElementById('awakenOut'); if(!out) return;
  const cl = v => Math.max(0, Math.min(AWAKEN_MAX, Math.floor(parseFloat(v) || 0)));
  const A = cl(document.getElementById('awA').value), B = cl(document.getElementById('awB').value);
  const lo = Math.min(A,B), hi = Math.max(A,B);
  let html = '';
  if(lo < AWAKEN_MAX) html += `<div class="stat"><span>${lo.toLocaleString()}레벨에서 다음 각성 1회 비용</span><span>${bigBoth(awakenCostBig(lo))}</span></div>`;
  html += `<div class="stat"><span>${lo.toLocaleString()} → ${hi.toLocaleString()}레벨 누적 각성의 보석</span><span>${bigBoth(awakenCumBig(hi) - awakenCumBig(lo))}</span></div>`;
  out.innerHTML = html;
}

function gemFormulaTableHTML(kind){                       // kind: 'gem' | 'orb'
  const L = 'style="text-align:left;font-family:inherit;white-space:normal"', N = 'style="text-align:left;font-family:inherit;white-space:nowrap"';
  const fmt = b => { b = BigInt(b); return b < 100000000n ? bigComma(b) : bigComma(b) + ' <span style="color:var(--sub)">(' + bigKR(b, 2) + ')</span>'; };
  const list = GEM_META.filter(m => kind === 'orb' ? m[0].startsWith('orb_') : !m[0].startsWith('orb_'));
  const rows = list.map(m => {
    const d = GEM_COST_DEFS[m[0]], max = d.max;
    return `<tr><td ${N}>${m[1].replace('보주 ','').replace('보석 ','')} ${m[2]}</td><td ${N}>${m[3]}</td><td ${L}>${m[4]}</td><td>${max.toLocaleString()}</td><td>${fmt(gemCostBig(m[0],1))}</td><td>${fmt(gemCostBig(m[0],max))}</td><td>${fmt(gemCumBig(m[0],max))}</td><td ${L}>${d.formula}</td></tr>`;
  }).join('');
  return `<table><tr><th style="white-space:nowrap">위치</th><th style="text-align:left;white-space:nowrap">이름</th><th style="text-align:left">효과</th><th>최대 개수</th><th>첫 1개 비용</th><th>마지막 1개 비용</th><th>최대까지 누적 비용</th><th style="text-align:left">비용 공식 (n = 몇 번째 1개)</th></tr>${rows}</table>`;
}
function gemLookupHTML(){
  const opts = GEM_META.map(m => `<option value="${m[0]}">${m[3]} (${m[5]})</option>`).join('');
  return `<div style="display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end;margin-top:8px">
    <div class="field" style="width:16em"><label>보석 / 보주</label><select id="glKey" onchange="calcGemLookup()">${opts}</select></div>
    <div class="field" style="width:9em"><label>n번째(개수)</label><input id="glN" type="number" min="1" value="10" oninput="calcGemLookup()"></div>
  </div><div id="glOut" style="margin-top:8px"></div>`;
}
function calcGemLookup(){
  const out = document.getElementById('glOut'); if(!out) return;
  const key = document.getElementById('glKey').value, d = GEM_COST_DEFS[key], m = GEM_META.find(x => x[0] === key);
  const n = Math.max(1, Math.min(d.max, Math.floor(parseFloat(document.getElementById('glN').value) || 1)));
  out.innerHTML = `<div class="stat"><span>${m[3]} ${n.toLocaleString()}번째 1개 비용 (${m[5]})</span><span>${bigBoth(gemCostBig(key, n))}</span></div>
    <div class="stat"><span>1~${n.toLocaleString()}개 누적 비용</span><span>${bigBoth(gemCumBig(key, n))}</span></div>
    <div class="stat"><span>공식</span><span style="text-align:right;white-space:normal">${d.formula}</span></div>
    <div class="stat" style="border-bottom:none"><span>최대 ${d.max.toLocaleString()}개까지 누적</span><span>${bigBoth(gemCumBig(key, d.max))}</span></div>`;
}

// ===================== 44~50강 시간당 무조 · 각보 · 크레딧 요약 (스탯 표 바로 아래) =====================
// 개인보스 단계 배수 = LV.MAX 허수아비 타격당 무색 조각 적립 배수(개인보스 시트). 0단계(미클리어)도 인게임에서 타격당 +1 적립이 확인되어 1로 둔다(1단계와 같음).
function bossScarecrowMult(stage){
  stage = Math.max(0, Math.min(10, Math.floor(stage) || 0));
  if(stage <= 0) return 1;
  return stage <= 5 ? BOSS_DATA[stage - 1].scare : BOSS_DATA_HIGH[stage - 6].scare;
}
// 사냥터에 넣은 41강 이상 유닛(LV.MAX 허수아비를 치는 유닛)의 시간당 타격 수 — 공속 실측 배율·배속 반영
function maxScarecrowHitsPerHour(){
  let perSec = 0;
  huntUnitRows.forEach(row => {
    if(row.lv >= 41 && row.count > 0){ const u = getHuntUnitData(row.lv); if(u) perSec += row.count * getUnitPracticalDps({ atk: 1, hits: u.hits || 1, spd: u.spd }); }
  });
  return perSec * 3600 * speedMult();
}
function bossScarecrowMultText(){                      // 예: 0~1단계 1 · 2~3단계 2 · …
  const parts = []; let start = 0, prev = bossScarecrowMult(0);
  for(let st = 1; st <= 11; st++){
    const m = st <= 10 ? bossScarecrowMult(st) : null;
    if(m !== prev){ parts.push((start === st - 1 ? start : start + '~' + (st - 1)) + '단계 ' + prev); start = st; prev = m; }
  }
  return parts.join(' · ');
}
function updateHourlyGainBox(r){
  const box = document.getElementById('hourlyGainBox'); if(!box) return;
  let gachaShards = 0, awaken = 0, creditNet = 0;
  [45,46,47,48,49,50].forEach(lv => {
    const unit = GACHA_DROPS_4550[lv], pulls = r.N[lv] || 0;
    let es = unit.baseShards, ea = 0, ec = 0;
    unit.rewards.forEach(rw => { const e = rw.amount * rw.prob / 100; if(rw.kind === 'shards') es += e; else if(rw.kind === 'awakening') ea += e; else if(rw.kind === 'credit') ec += e; });
    gachaShards += pulls * es; awaken += pulls * ea; creditNet += pulls * (unit.cost - ec);
  });
  const mult = bossScarecrowMult(maxBossLevel), statLv = Math.max(0, Math.min(100, Math.floor(getStatInv(4, 1))));
  const hits = maxScarecrowHitsPerHour();
  const scareShards = hits * (mult + statLv) / 10;
  const total = gachaShards + scareShards;
  const f = formatHourlyProduction;
  const R = 'style="padding:2px 0"', RL = 'style="padding:2px 0;border-bottom:none"';
  box.innerHTML = `
    <div style="font-size:.8rem;color:var(--sub);margin-bottom:1px"><b style="color:var(--text)">시간당 획득</b> (현재 설정)</div>
    <div class="stat" ${R}><span>무색 조각</span><span><b>${f(total)}</b></span></div>
    <div class="stat" ${R}><span>각성의 보석</span><span><b>${f(awaken)}</b></span></div>
    <div class="stat" ${RL}><span>크레딧 소모</span><span><b>${creditNet < 0 ? f(-creditNet) + ' (순수익)' : f(creditNet)}</b></span></div>
    <p class="note" style="margin:3px 0 0;line-height:1.35;font-size:.72rem">무조 = 45~50강 뽑기 ${f(gachaShards)} + 허수아비 ${f(scareShards)}. <b>허수아비 무조</b>: LV.MAX 허수아비를 한 번 때릴 때마다 <b>(개인보스 단계 배수 + 일반 4쪽 스탯)</b>만큼 적립되고, 10적립마다 무색 조각 1개가 됩니다(사냥터의 41강 이상 유닛 타격 수 기준, 획득량 보너스 미포함). 개인보스 배수: ${bossScarecrowMultText()} (현재 +${mult}) · 4쪽 스탯: 1레벨당 +1, 300P, 최대 100 (현재 +${statLv}).</p>`;
}

function crystalInfoTableHTML(nums, ujuMode){

// nums 크리스탈들의 강화 비용을 [lo,hi]단계 구간에서 같은 곡선끼리 묶어 한 열로 보여 준다 (누적은 시트처럼 같은 재료끼리)
function crystalCostTableHTML(nums, lo, hi){
  const groups = [];
  nums.forEach(n => {
    const seq = CRYSTAL_COSTS[n].slice(lo - 1, hi), key = JSON.stringify(seq);
    let g = groups.find(x => x.key === key); if(!g){ g = { key, seq, nums: [] }; groups.push(g); }
    g.nums.push(n);
  });
  const label = g => {
    const grades = {}; g.nums.forEach(n => { const gr = CRYSTAL_SHEET.find(r => +r[0] === n)[1]; grades[gr] = (grades[gr] || 0) + 1; });
    return g.nums.length > 4 ? Object.entries(grades).map(([k, v]) => k + ' ' + v + '종').join(' · ') : g.nums.map(crystalShortName).join(' · ');
  };
  groups.forEach(g => { g.cum = []; const c = {}; CRYSTAL_COSTS[g.nums[0]].forEach(([m, v], i) => { c[m] = (c[m] || 0) + v; if(i + 1 >= lo && i + 1 <= hi) g.cum.push(c[m]); }); });
  const maxLen = Math.max(...groups.map(g => g.seq.length));
  let body = '';
  for(let i = 0; i < maxLen; i++){
    body += `<tr><td>${lo + i}</td>` + groups.map(g => g.seq[i] === undefined ? '<td>-</td><td>-</td><td>-</td>' : `<td style="white-space:nowrap;text-align:left;font-family:inherit;color:var(--sub)">${CRYSTAL_MATS[g.seq[i][0]]}</td><td>${sheetNum(g.seq[i][1])}</td><td>${sheetNum(g.cum[i])}</td>`).join('') + '</tr>';
  }
  const head1 = groups.map(g => `<th colspan="3" style="text-align:center;white-space:normal">${label(g)}</th>`).join('');
  const head2 = groups.map(() => '<th style="text-align:left">재료</th><th>비용</th><th>누적 비용(같은 재료)</th>').join('');
  return `<table><tr><th rowspan="2">단계</th>${head1}</tr><tr>${head2}</tr>${body}</table>`;
}
