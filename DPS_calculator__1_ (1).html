<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DPS 강화하기 종합 계산기</title>
<style>
:root{
  --bg:#0e1116; --panel:#161b22; --border:#2a3140; --text:#e6e9ef; --sub:#8b96a8;
  --side:40px; --accent:#5fc9a8; --accent2:#e2b04a; --danger:#e2694a; --mono:'SFMono-Regular',Consolas,monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --bg:#f5f6f8; --panel:#ffffff; --border:#dde1e8; --text:#1b1f27; --sub:#5b6472; }
}
:root[data-theme="dark"]{ --bg:#0e1116; --panel:#161b22; --border:#2a3140; --text:#e6e9ef; --sub:#8b96a8; }
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,'Pretendard',sans-serif;line-height:1.5;}
header{padding:8px var(--side) 0;max-width:calc(1200px + 2*var(--side));margin:0 auto;}
h1{font-size:1.2rem;margin:0 0 2px;font-weight:700;}
header p{margin:0 0 6px;color:var(--sub);font-size:.85rem;}
nav{display:flex;gap:6px;max-width:calc(1200px + 2*var(--side));margin:0 auto;padding:0 var(--side);overflow-x:auto;}
nav button{flex:0 0 auto;padding:8px 12px;background:none;border:1px solid var(--border);border-radius:8px 8px 0 0;color:var(--sub);font-size:.82rem;cursor:pointer;border-bottom:none;}
nav button.active{color:var(--text);background:var(--panel);border-color:var(--accent);}
main{max-width:calc(1200px + 2*var(--side));margin:0 auto;padding:4px var(--side) 12px;}
@media (max-width:600px){ :root{ --side:16px; } }
.card{background:var(--panel);border:1px solid var(--border);border-radius:0 8px 8px 8px;padding:8px 14px 12px;}

/* 2단 분할 레이아웃 */
.split-layout { display: flex; flex-direction: column; gap: 6px; }
.split-left, .split-right { display: flex; flex-direction: column; }
@media (min-width: 800px) {
  .split-layout { flex-direction: row; gap: 24px; }
  .split-left { flex: 1; min-width: 0; }
  .split-right { flex: 1.1; min-width: 0; }
}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-bottom:14px;}
.field{display:flex;flex-direction:column;gap:4px;}
.field.full{grid-column:1/-1;}
label{font-size:.78rem;color:var(--sub);}
input,select{background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:8px 10px;font-size:.9rem;width:100%;}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;}
button.run{background:var(--accent);color:#08130f;border:none;border-radius:6px;padding:10px 16px;font-size:.9rem;font-weight:600;cursor:pointer;}
button.run:hover{opacity:.9;}
button.btn-del{background:var(--danger);color:#fff;border:none;border-radius:4px;padding:6px 8px;font-size:.75rem;cursor:pointer;}
.result{margin-top:8px;border-top:1px solid var(--border);padding-top:8px;}
.summary-box{background:var(--bg);border:1px solid var(--accent);border-radius:8px;padding:12px 14px;margin-bottom:16px;}
table{width:100%;border-collapse:collapse;font-size:.85rem;overflow-x:auto;display:block;}
th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--border);font-family:var(--mono);}
th:first-child,td:first-child{text-align:left;font-family:inherit;}
.stat{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);font-size:.88rem;}
.stat:last-child{border-bottom:none;}
.stat span:last-child{font-family:var(--mono);color:var(--accent2);}
.note{color:var(--sub);font-size:.78rem;margin-top:4px;}
.unit-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}

/* 44~50강 탭: 왼쪽 입력표 ↔ 오른쪽 효율표 줄 맞춤 */
.al{table-layout:fixed;width:100%;border-collapse:collapse;}
.al td,.al th{height:32px;padding:0 4px;box-sizing:border-box;border-bottom:1px solid var(--border);vertical-align:middle;overflow:hidden;}
.al th{text-align:right;font-size:.78rem;} .al th:first-child{text-align:left;}
.al td{font-size:.8rem;} .al .c{text-align:right;color:var(--sub);font-family:var(--mono);font-size:.76rem;white-space:nowrap;overflow:visible;}
.al input{height:26px;padding:0 6px;width:100%;}
.al tr.sp td{height:12px;padding:0;border-bottom:none;border-top:1px dashed var(--border);}
.al .emp{background:var(--border);opacity:.25;}
.al td.eff-empty{background:transparent;opacity:1;}
.al.mx td,.al.mx th{padding:0 3px;}
.al td.rec{text-align:right;font-family:var(--mono);font-size:.78rem;font-weight:700;color:var(--accent);white-space:nowrap;overflow:visible;}
.al th.rec{white-space:nowrap;}
.al3{display:table;table-layout:fixed;width:100%;min-width:900px;}
.al3 th{vertical-align:bottom;line-height:1.3;}
.al3 th,.al3 td{padding-left:4px;padding-right:4px;}
.effname{display:none;} @media (max-width:799px){ .al td.effname,.al th.effname{display:table-cell;width:26%;text-align:left;} }
/* 모든 탭 공통: 본문 폭 1300px 고정 (창이 좁으면 화면 전체 가로 스크롤, 넓으면 가운데 정렬). 위(제목·탭·공통입력줄)와 아래 본문을 같은 폭으로 맞춤 */
body{ min-width:calc(1300px + 2*var(--side)); }
header, nav, main{ width:calc(1300px + 2*var(--side)); max-width:none; min-width:0; }
#globalBar{ width:1300px; max-width:none !important; }
.split-layout{ flex-direction:row; gap:24px; }
.split-left, .split-right{ min-width:0; }
body.wide4450 .split-left, body.wide4450 .split-right{ flex:1; overflow:visible !important; }
body.wide4450 .split-left table, body.wide4450 .split-right table{ overflow:visible; }
</style>
</head>
<body>
<header>
  <h1>DPS 강화하기 종합 계산기</h1>
  <p>개인 플레이 참고용 — 초반 효율 · 강화확률 · 레벨경험치 · 뽑기/레이스 기댓값</p>
</header>
<nav id="tabnav"></nav>
<div id="globalBar" class="card" style="margin:0 auto 4px;max-width:1200px;padding:6px 14px;"></div>
<main><div class="card" id="tabhost"></div></main>

<script>
// ===================== 데이터 정의 =====================
function clamp01(x){return Math.max(0,Math.min(1,x));}

// ===================== 배속 (배속.csv) =====================
// [배속 단, 방 전체 포인트 합(이상), 프레임 길이(ms), 기본 대비 빠르기(배), 실제 1초에 닳는 포인트(방 전체)]
const SPEED_TABLE = [[0, 0, 29, 1.0, 0.0], [1, 1, 28, 1.036, 35.7], [2, 10001, 27, 1.074, 74.1], [3, 40001, 26, 1.115, 115.4], [4, 90001, 25, 1.16, 160.0], [5, 160001, 24, 1.208, 208.3], [6, 250001, 23, 1.261, 260.9], [7, 360001, 22, 1.318, 318.2], [8, 490001, 21, 1.381, 381.0], [9, 640001, 20, 1.45, 450.0], [10, 810001, 19, 1.526, 526.3], [11, 1000001, 18, 1.611, 611.1], [12, 1210001, 17, 1.706, 705.9], [13, 1440001, 16, 1.812, 812.5], [14, 1690001, 15, 1.933, 933.3], [15, 1960001, 14, 2.071, 1071.4], [16, 2250001, 13, 2.231, 1230.8]];
const SPEED_STORAGE_KEY = 'dps-speed-level-v1';
let speedLevel = 0;
try { const v = parseInt(localStorage.getItem(SPEED_STORAGE_KEY)); if(Number.isFinite(v)) speedLevel = Math.max(0, Math.min(16, v)); } catch(e) {}
// 계산에 곱하는 배수 = 42 ÷ 프레임 길이(ms) — 스타에디터 게임 속도 기준(구버전도 13ms일 때 42/13 ≈ 3.2308배).
// 프레임 길이 = 29 − 배속 단. 0단 = 42/29 ≈ 1.448배, 16단 = 42/13 ≈ 3.231배.
// (배속.csv의 「기본 대비 빠르기」는 0단을 1.0으로 잡은 29 기준 값이라 참고용으로만 표에 남겨 둔다.)
function speedMult(){ return 42 / (29 - speedLevel); }
function updateSpeedInfo(){
  const e = document.getElementById('speedInfo'); if(!e) return;
  const r = SPEED_TABLE[speedLevel];
  e.textContent = `계산 ×${speedMult().toFixed(4)} (42/${r[2]}) · 방 포인트 합 ${r[1].toLocaleString()}${speedLevel ? ' 이상' : ''} · 방 전체 ${r[4]}/초 소모`;
}
function setSpeedLevel(v){
  speedLevel = Math.max(0, Math.min(16, Math.round(parseFloat(v) || 0)));
  try { localStorage.setItem(SPEED_STORAGE_KEY, String(speedLevel)); } catch(e) {}
  updateSpeedInfo();
  if(typeof refreshEarly === 'function') refreshEarly();
}
function speedTableHTML(){
  const rows = SPEED_TABLE.map(r => `<tr${r[0] === speedLevel ? ' style="background:rgba(95,201,168,.14)"' : ''}><td>${r[0]}단</td><td>${r[1].toLocaleString()}</td><td>${r[2]}</td><td>${r[3].toFixed(3)}</td><td><b>${(42 / r[2]).toFixed(4)}</b></td><td>${r[4]}</td></tr>`).join('');
  return `<table style="margin-top:8px"><tr><th>배속 단</th><th>방 전체 포인트 합(이상)</th><th>프레임 길이(ms)</th><th>기본 대비 빠르기(배)</th><th>계산에 곱하는 배수(42÷프레임)</th><th>실제 1초에 닳는 포인트(방 전체)</th></tr>${rows}</table>`;
}


const POINTS_PER_LEVEL = 150;

// Page 9 개인 보스 데이터
const BOSS_DATA = [
  // dps = 클리어 목표 DPS(개인보스.csv), scare = LV.MAX 허수아비 무색 조각 비율(개인보스.csv)

// credit=1회 크레딧 · shard=1회 무색 조각 · extra=보스 처치 추가 리워드 크레딧 · group=단체 크레딧(방 전원, 판당 1회)
const BOSS_DATA_HIGH = [
  { stage: 6,  dps: 3222,     credit: 10000,  shard: 3,     extra: 50000,  group: 20000, scare: 5 },
  { stage: 7,  dps: 32222,    credit: 30000,  shard: 5,     extra: 60000,  group: 20000, scare: 5 },

];
function bossTableHTML(){
  const n = v => v.toLocaleString();
  const low = BOSS_DATA.map(b => {
    const reward = [b.expPercent ? '추가 EXP +'+b.expPercent+'%' : '', b.credit ? '크레딧 '+n(b.credit) : ''].filter(Boolean).join(' · ') || '-';
    return `<tr><td>${b.stage}단계</td><td>${n(b.dps)}</td><td style="text-align:left;font-family:inherit">+1확률 +${b.prob1.toFixed(1)}%p · 사냥터 +${b.hunt} · 공격력 +${b.atkPercent}%</td><td style="text-align:left;font-family:inherit">${reward}</td><td>-</td><td>${b.scare}</td></tr>`;
  }).join('');
  const high = BOSS_DATA_HIGH.map(b => {
    const reward = '크레딧 '+n(b.credit)+' + 추가 '+n(b.extra)+(b.shard ? ' · 무색 조각 '+n(b.shard) : '');
    return `<tr><td>${b.stage}단계</td><td>${n(b.dps)}</td><td style="text-align:left;font-family:inherit">41강 이상으로 공략</td><td style="text-align:left;font-family:inherit">${reward}</td><td>${n(b.group)}</td><td>${b.scare}</td></tr>`;
  }).join('');
  const mine = `<tr><td>11단계</td><td>-</td><td colspan="4" style="text-align:left">허수광산 — 깨지지 않는다 (보상은 「허수광산_DPS보상」 표 기준)</td></tr>`;
  return `<table><tr><th>개인 보스</th><th>목표 DPS</th><th style="text-align:left">확률/효과</th><th style="text-align:left">1회 보상</th><th>단체 크레딧</th><th>LV.MAX 허수아비 무색 조각 비율</th></tr>${low}${high}${mine}</table>`;
}
function bossCumulativeStatHTML(){
  const c = getBossCumulativeBonus(5);
  return `<div class="stat" style="margin-top:8px"><span>1~5단계 상시 버프 누적(전부 클리어)</span><span>+1확률 +${c.prob1.toFixed(1)}%p · 사냥터 +${c.huntBonus} · 공격력 +${c.atkPercent}% · 추가 EXP +${c.expPercent}%</span></div>`;
}

const SPD_FRAMES = { '매우느림': 72, '느림': 48, '보통': 24, '빠름': 12, '매우빠름': 6, '극한': 5, '초월': 3, '무한': 1 };

const UNIT_DPS_DATA = [

const UNIT_BUY_PRICE = {
  1: 1500, 7: 40000, 11: 700000, 15: 8000000, 18: 100000000,
  20: 600000000, 22: 3500000000, 24: 20000000000, 26: 100000000000,

// 1강~39강 일반 강화 "+1강" 기준확률 (실측). +2/+3강은 기준값 없이 순수 투자 스텟에서만 나옴.
const BASE_PROB={1:0.6,2:0.6,3:0.575,4:0.543,5:0.5,6:0.5,7:0.5,8:0.5,9:0.47,10:0.465,
  11:0.463,12:0.452,13:0.45,14:0.45,15:0.44,16:0.44,17:0.44,18:0.43,19:0.42,20:0.38,
  21:0.38,22:0.36,23:0.36,24:0.35,25:0.3,26:0.25,27:0.25,28:0.25,29:0.25,30:0.25,
  31:0.25,32:0.2,33:0.2,34:0.2,35:0.2,36:0.16,37:0.12,38:0.1,39:0.05};
// +2/+3강의 "도달 목표 레벨"이 이 값을 넘으면 그 확률이 낮은 단계로 흡수됨
// (35강: +3→+2로 합산 / 36~39강: +2·+3 모두 +1로 합산)

function setInvestmentStorageWarning(message){
  investmentStorageWarning = message;
  const status = document.getElementById('investmentPersistenceStatus');
  if(status){
    status.textContent = message || '스탯·고유유닛 투자값은 이 브라우저에 자동 저장됩니다.';
    status.style.color = message ? 'var(--danger)' : 'var(--sub)';
  }
}

function loadInvestmentState(){
  let saved;
  try {
    const serialized = localStorage.getItem(INVESTMENT_STORAGE_KEY);
    if(!serialized) return;
    saved = JSON.parse(serialized);
  } catch(error) {
    console.error('저장된 투자값을 불러오지 못했습니다.', error);
    setInvestmentStorageWarning('저장된 투자값을 불러오지 못했습니다. 브라우저 저장소 설정을 확인하세요.');
    return;
  }

  if(!saved || typeof saved !== 'object' || Array.isArray(saved)){
    setInvestmentStorageWarning('저장된 투자값 형식이 올바르지 않아 기본값으로 시작했습니다.');
    return;
  }
  const storedStats = saved.statInvestments;
  if(storedStats && typeof storedStats === 'object' && !Array.isArray(storedStats)){
    STAT_OPTIONS.forEach(option=>{
      const key = `${option.page}_${option.no}`;
      const value = Number(storedStats[key]);
      if(Number.isFinite(value)) statInvestments[key] = Math.max(0, Math.min(option.max, value));
    });
  }
  const storedRace = saved.raceInvestments;
  if(storedRace && typeof storedRace === 'object' && !Array.isArray(storedRace)){
    RACE_OPTIONS.forEach(option=>{
      const value = Number(storedRace[option.key]);
      if(Number.isFinite(value)) raceInvestments[option.key] = Math.max(0, Math.min(option.max, Math.round(value)));
    });
  }
}

function saveInvestmentState(){
  try {
    localStorage.setItem(INVESTMENT_STORAGE_KEY, JSON.stringify({statInvestments, raceInvestments}));
    if(investmentStorageWarning) setInvestmentStorageWarning('');
  } catch(error) {
    console.error('투자값을 브라우저에 저장하지 못했습니다.', error);
    setInvestmentStorageWarning('투자값을 저장하지 못했습니다. 브라우저 저장소 설정을 확인하세요.');
  }
}

// ===================== 40~50강 강화확률 (신규, 2026-09-26 확인 기준) =====================
// 40~43강 "특수확률" 기본값(%): 여기에 특수강화확률 스텟(1P-6+2P-4)을 더한 뒤 파괴방지 재귀식 적용
const SPECIAL_BASE_PROB_40_43 = { 40: -9, 41: -12, 42: -20, 43: -25 };
// 40~43강 원확률 = 기본값 + 특수강화확률 스텟 + (+1/+2/+3강 강화확률 보너스)
//  +1강 보너스 = 1P-3 + 2P-1 (각 0.1%p/Lv) + 고유유닛 A(0.25%p/회) + 개인보스 누적 +1강확률
//  +2강 보너스 = 1P-4 + 2P-2 (각 0.1%p/Lv),  +3강 보너스 = 1P-5 + 2P-3 (각 0.1%p/Lv)
// g(page,no)로 스텟 투자값을 대체할 수 있어(효율 비교용) 가상의 +1레벨 계산에도 쓴다.
function get40to43Bonus(g){
  g = g || getStatInv;
  return {
    p1: (g(1,3) + g(2,1)) * 0.1 + getRaceInv('A') * 0.25 + getBossCumulativeBonus(maxBossLevel).prob1,
    p2: (g(1,4) + g(2,2)) * 0.1,
    p3: (g(1,5) + g(2,3)) * 0.1,
    special: (g(1,6) + g(2,4)) * 0.1 + getRaceInv('S') * 0.5,
  };
}
function getRaw40to43(lv, g){
  const b = get40to43Bonus(g);
  return Math.round((SPECIAL_BASE_PROB_40_43[lv] + b.p1 + b.p2 + b.p3 + b.special + gemGP()) * 1e9) / 1e9; // 소수 오차 제거
}
// 44~48강 "개별확률" 기본값(%)
const INDIVIDUAL_BASE_PROB_44_48 = { 44: 10, 45: 7, 46: 4, 47: 1, 48: 0 };
// 44~48강 개별 스텟(3P-1~5) 매핑: 페이지/번호, 레벨당 증가량(%p)
const INDIVIDUAL_STAT_44_48 = {
  44: { page: 3, no: 1, perLevel: 0.1 },
  45: { page: 3, no: 2, perLevel: 0.1 },
  46: { page: 3, no: 3, perLevel: 0.1 },
  47: { page: 3, no: 4, perLevel: 0.1 },
  48: { page: 3, no: 5, perLevel: 0.05 },
};
// 49강: 스텟 영향 없이 고정 원확률(%), 파괴방지 재귀식만 적용
const FIXED_PROB_49 = 0.5;

// 41~50강 효율 분석에서 비교할 스텟 후보. 특수강화확률(1P-6+2P-4)은 40~43강에만, 특수파괴방지확률(2P-5+2P-6)은
// 40~49강 전체에 동시에 영향을 주는 "공통" 스텟이라 두 하위 스텟을 각각 별도 후보로 비교하고
// (같은 효과라도 비용이 다르면 효율이 달라짐), 44~48강 개별 스텟(3P)은 자기 레벨에만 영향을 준다.
const SPECIAL4050_STAT_CANDIDATES = [
  { page:1, no:3 }, { page:1, no:4 }, { page:1, no:5 }, { page:2, no:1 }, { page:2, no:2 }, { page:2, no:3 }, // +1/+2/+3 강화확률 (40~43강 원확률에 합산)
  { page:1, no:6 }, { page:2, no:4 }, // 특수 강화확률
  { page:2, no:5 }, { page:2, no:6 }, // 특수 파괴방지확률
  { page:3, no:1 }, { page:3, no:2 }, { page:3, no:3 }, { page:3, no:4 }, { page:3, no:5 }, // 44~48강 개별
];

// 파괴방지 재귀식: 유효확률 = 원확률 / (1 - (1-원확률)×파방확률)  (모두 0~1 비율로 변환해 계산 후 %로 반환)
function applyDestructionPrevention(rawPercent, pabangPercent){
  const raw = clamp01(rawPercent / 100);
  const pb = clamp01(pabangPercent / 100);
  if (raw <= 0) return 0;
  const denom = 1 - (1 - raw) * pb;
  if (denom <= 0) return 100;
  return clamp01(raw / denom) * 100;
}

// [초반 효율] 탭에서 투자한 "특수강화확률"(1P-6+2P-4, 40~50강 공통 보너스) / "특수 파괴방지확률"(2P-5+2P-6) 스텟 합산(%p)
function getSpecial40to50StatBonus(){
  const specialProb = (getStatInv(1,6) + getStatInv(2,4)) * 0.1 + getRaceInv('S') * 0.5; // %p (고유유닛 S 포함)
  const pabang = (getStatInv(2,5) + getStatInv(2,6)) * 0.1 + getRaceInv('X') * 1;         // %p (고유유닛 X 포함)
  return { specialProb, pabang };
}

// 40~49강 유효확률의 합(%p)을 계산하는 순수 함수. invOverride로 특정 스텟 1개만 가상으로
// +레벨 해봤을 때 이 합이 얼마나 늘어나는지를 비교해 "다음 1포인트를 어디에 쓸지" 효율을 낸다.
// 50강(Ex레벨)은 계산 로직이 없어 이 합계에서 제외한다.
function computeSpecial4050EffSum(invOverride){
  invOverride = invOverride || {};
  const inv = (page,no) => {
    const key = `${page}_${no}`;
    return invOverride[key] !== undefined ? invOverride[key] : getStatInv(page,no);
  };
  const specialProb = (inv(1,6) + inv(2,4)) * 0.1 + getRaceInv('S') * 0.5;
  const pabang = (inv(2,5) + inv(2,6)) * 0.1 + getRaceInv('X') * 1;

  let sum = 0;
  [40,41,42,43].forEach(lv=>{
    const raw = getRaw40to43(lv, inv);
    sum += applyDestructionPrevention(raw, pabang);
  });
  [44,45,46,47,48].forEach(lv=>{
    const statInfo = INDIVIDUAL_STAT_44_48[lv];
    const statBonus = inv(statInfo.page, statInfo.no) * statInfo.perLevel;
    const raw = INDIVIDUAL_BASE_PROB_44_48[lv] + statBonus;
    sum += applyDestructionPrevention(raw, pabang);
  });
  sum += applyDestructionPrevention(FIXED_PROB_49, pabang);
  return sum;
}

// [44~50강 강화확률] 탭 - 스텟 투자 효율 분석 (다음 1포인트를 어디에?)
function calcStatEfficiency4050(){
  const out = document.getElementById('outStatEfficiency4050');
  if(!out) return;

  const baseSum = computeSpecial4050EffSum({});

  const results = SPECIAL4050_STAT_CANDIDATES.map(c=>{
    const s = STAT_OPTIONS.find(o=>o.page===c.page && o.no===c.no);
    const curLv = getStatInv(c.page, c.no);
    const maxed = curLv >= s.max;
    let delta = 0;
    if(!maxed){
      const key = `${c.page}_${c.no}`;
      const newSum = computeSpecial4050EffSum({ [key]: curLv+1 });
      delta = newSum - baseSum;
    }
    return {
      name: `${c.page}P-${c.no}. ${s.name}`, cost: s.cost, curLv, max: s.max, maxed, delta,
      effPerPoint: maxed ? -Infinity : delta/s.cost,
    };
  });

  results.sort((a,b)=>b.effPerPoint-a.effPerPoint);
  const finiteEff = results.filter(r=>isFinite(r.effPerPoint) && r.effPerPoint>0).map(r=>r.effPerPoint);
  const maxEff = finiteEff.length ? Math.max(...finiteEff) : 0;

  let rows='';
  results.forEach((r,i)=>{
    const barPct = (maxEff>0 && isFinite(r.effPerPoint) && r.effPerPoint>0) ? (r.effPerPoint/maxEff*100) : 0;
    const barColor = i===0 ? 'var(--accent)' : 'var(--accent2)';
    rows += `
      <div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:3px">
          <span style="font-weight:${maxEff>0&&r.effPerPoint===maxEff?'700':'400'}">${i+1}위. ${r.name}${r.maxed?' <span style="color:var(--sub)">(이미 만렙)</span>':''}</span>
          <span style="font-family:var(--mono);color:var(--accent2);font-weight:${maxEff>0&&r.effPerPoint===maxEff?'700':'400'}">${r.maxed?'-':r.effPerPoint.toFixed(5)+'%p/P'}</span>
        </div>
        <div style="background:var(--border);border-radius:4px;height:10px;overflow:hidden">

const VENDING_DATA = { baseUnitsPerSide: 24, perStatLevel: 10, gemPerUnit: 1 };
let vendBoostOverride = null;
function vendBoost(){ return vendBoostOverride!==null ? vendBoostOverride : vendingBoost(getStatInv(3,6), getGemInv('accel')); }
function vendUnitsPerSec(){ return VENDING_DATA.baseUnitsPerSide * vendBoost() * speedMult(); } // 자판기 한 대의 초당 생산 개수
function withVendBoost(v, fn){ const o=vendBoostOverride; vendBoostOverride=v; try{ return fn(); } finally{ vendBoostOverride=o; } }
function vendingBoost(lv36, gems){ return 1 + VENDING_DATA.perStatLevel*lv36 + VENDING_DATA.gemPerUnit*gems; }

// 궁극·초월 보석의 "모든유닛 강화확률"은 1~43강 +1 확률에도 적용된다. 44~50강 생산 계산 중에는 가상 보석(+1개) 값을 넣을 수 있게 override 지원.
let gemProbOverride = null;
function gemGP(){ return gemProbOverride!==null ? gemProbOverride : getGemAggregates({}).globalProbAdd; }
function withGemProb(v, fn){ const o=gemProbOverride; gemProbOverride=v; try{ return fn(); } finally{ gemProbOverride=o; } }
// 적대의 보석: 50강 이하 유닛 기본공격력 개당 +10% — 스텟 공업(1P-2)·보스 공격력과 "곱연산" (100개 = ×11). 허수광산에는 붙지 않음(패치), 허수아비·개인보스에는 적용
function hostileMult(){ return 1 + 0.1*getGemInv('hostile'); }
// 후원 특전 "판매·강화 실패 경험치 최종 N배" (윗단계 값으로 덮어씀)
let supportLevel = 0;
function supportExpFinal(){ const t=[[20,20],[16,15],[13,10],[10,7],[7,5],[4,3],[1,2]]; for(const [l,m] of t) if(supportLevel>=l) return m; return 1; }
// 경험치 배율: (합산 묶음) × 쿠폰·핫타임 × 후원 최종배수. 숙련의 보석(개당 ×1.1, 곱연산)은 게임 「EXP 실패」 표기에서는 빠지고 실제 획득에만 곱해진다.
function expMultiplierParts(addPart){ const disp = addPart * couponMult() * supportExpFinal(); return { disp, real: disp * Math.pow(1.1, getGemInv('mastery')) }; }
// 44~50강 탭 좌측 입력표/우측 효율표가 공유하는 스텟 행 순서: 허수아비(1P-1) - 파방1(2P-5) - 파방2(2P-6) - 44강 확률~자판기 촉진량(3P-1~6)
const STAT_ROWS_4450 = [[1,1],[2,5],[2,6],[3,1],[3,2],[3,3],[3,4],[3,5],[3,6],[4,1]];
const STAT_ROW_LABEL = { '1_1':'허수아비', '2_5':'파방1', '2_6':'파방2', '4_1':'허수아비 무조' };
let gemCostOverride = {};
function parseKR(s){ s=String(s).replace(/[,\s원]/g,''); let t=0; (s.match(/\d+(?:\.\d+)?(?:경|조|억|만)?/g)||[]).forEach(x=>{const r=x.match(/(\d+(?:\.\d+)?)(경|조|억|만)?/); t+=parseFloat(r[1])*({'경':1e16,'조':1e12,'억':1e8,'만':1e4}[r[2]]||1);}); return t; }
// 1만 미만은 숫자 그대로, 이후 만→억→조→경 순으로 자리마다 붙여 표기 (조 이상: 조·억·만, 경 이상: 경·조·억·만)
function fmtKR(n){ n=Math.round(n); if(n<1e4) return String(n); let b=BigInt(n), s=''; [[10n**16n,'경'],[10n**12n,'조'],[10n**8n,'억'],[10n**4n,'만']].forEach(([v,l])=>{const q=b/v; if(q>0n){s+=q.toString()+l; b-=q*v;}}); return s; }
function gemCost(g){ const o=gemCostOverride[g.key]; return o>0 ? o : g.cost(getGemInv(g.key)); }

let gemInvestments = {};
function getGemInv(key){ return gemInvestments[key] || 0; }
function setGemInv(key, val, max){ gemInvestments[key] = Math.max(0, Math.min(max, parseFloat(val) || 0)); }
// [44~50강] 총 무색조각(무조) 입력값·추천 기준 단계. 총 무조는 브라우저에 저장한다.

// 큰 수를 float 잡음 없이 정수 문자열로: 유효숫자 15자리까지만 쓰고 나머지는 0
function plainDigits(n){
  n = Math.round(n); if(!(n>0)) return '0';
  if(n < 1e15) return String(n);
  const [m,e] = n.toExponential(14).split('e');
  return m.replace('.','') + '0'.repeat(parseInt(e)-14);
}
function fmtDigits(n){ return plainDigits(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
// 추천 기준 강(보석/스텟): 기본 45강, 브라우저에 저장

// 보석 투자 전체를 훑어 생산량 계산에 필요한 값들을 합산
function getGemAggregates(gemOverride){
  gemOverride = gemOverride || {};
  const inv = key => (gemOverride[key] !== undefined) ? gemOverride[key] : getGemInv(key);
  const agg = {
    individualBonus: {44:0,45:0,46:0,47:0,48:0},
    lvmaxMultPercent: 0, pabangAdd: 0, globalProbAdd: 0, globalProbByLv: {44:0,45:0,46:0,47:0,48:0},
    vendSpeedMult: {1:1, 2:1}, miningSpeedAdd: 0, miningCapMult: 0, expAddPercent: 0,
  };
  GEM_OPTIONS.forEach(g=>{
    const n = inv(g.key);
    if(n<=0) return;
    const e = g.effect;
    if(e.type==='individual') agg.individualBonus[e.level] += n*e.perUnit;
    else if(e.type==='lvmaxMult') agg.lvmaxMultPercent += n*e.perUnit;
    else if(e.type==='pabang') agg.pabangAdd += n*e.perUnit;
    else if(e.type==='globalProb'){ agg.globalProbAdd += n*e.perUnit; [44,45,46,47,48].forEach(L=>{ if(L<=(e.maxLv||48)) agg.globalProbByLv[L] += n*e.perUnit; }); }
    else if(e.type==='vendBoth'){ agg.vendSpeedMult[1] += n*e.perUnit; agg.vendSpeedMult[2] += n*e.perUnit; }
    else if(e.type==='vendSpeedAdd') agg.vendSpeedMult[e.vend] += n*e.perUnit;
    else if(e.type==='miningSpeedMult') agg.miningSpeedAdd += n*e.perUnit;
    else if(e.type==='miningCapMult') agg.miningCapMult += n*e.perUnit;
    else if(e.type==='expAdd') agg.expAddPercent += n*e.perUnit;
  });
  return agg;
}

// 44~50강 시간당 생산량 시뮬레이션. gemOverride로 보석 1개만 가상으로 더해볼 수 있다.
function computeGemProduction4449(gemOverride){
  const gemAgg = getGemAggregates(gemOverride || {});
  const { pabang: statPabang } = getSpecial40to50StatBonus();
  const pabang = statPabang + gemAgg.pabangAdd;

  // 44강 도달량 = [1강~44강] 탭 계산(사냥터·스텟·보스·레이스 → 돈 → 자판기 → 1~43강 강화)을 그대로 연동.
  // 재물 보석은 LV.MAX 돈 수급에, 촉진 보석은 44강 도달 결과에 반영한다.
  const boost = gemAgg.vendSpeedMult[1] + VENDING_DATA.perStatLevel*getStatInv(3,6); // 촉진값 (가상 보석 반영)
  const pipe = withGemProb(gemAgg.globalProbAdd, ()=>withVendBoost(boost, ()=>computeProductionN44Details({ _wealth: 1 + gemAgg.lvmaxMultPercent/100 })));
  const feedPerHour44 = pipe.N[44] || 0; // 촉진은 자판기 생산 속도([2])에 이미 반영됨

  const N = {44: feedPerHour44, 45:0, 46:0, 47:0, 48:0, 49:0, 50:0};
  [44,45,46,47,48].forEach(lv=>{
    if(N[lv] <= 0) return;
    const statInfo = INDIVIDUAL_STAT_44_48[lv];
    const statBonus = getStatInv(statInfo.page, statInfo.no) * statInfo.perLevel;
    const gemBonus = gemAgg.individualBonus[lv];
    // 특수강화확률(specialProb)은 40~43강에만 적용되므로 44~48강 개별확률에는 더하지 않는다.
    const rawTotal = Math.max(
      INDIVIDUAL_BASE_PROB_44_48[lv] + statBonus + gemBonus + gemAgg.globalProbByLv[lv], 0);
    const eff = applyDestructionPrevention(rawTotal, pabang);
    N[lv+1] += N[lv] * (eff/100);
  });
  N[50] = N[49] * applyDestructionPrevention(FIXED_PROB_49, pabang) / 100;

  return { N, gemAgg, pabang, feedPerHour44 };
}

// [44~50강 강화확률] 탭 - 보석 투자 효율 분석 (다음 1개, 어디에?)
// '경험의 보석'(생산량과 무관, 경험치 전용)은 순위에서 제외하고 참고용으로만 표시한다.
function calcGemEfficiency(){
  const out = document.getElementById('outGemEfficiency');
  if(!out) return;

  const base = computeGemProduction4449({});
  const baseN49 = base.N[49];

  const candidates = GEM_OPTIONS.filter(g=>!['expAdd','none'].includes(g.effect.type));
  const results = candidates.map(g=>{
    const curN = getGemInv(g.key);
    const maxed = curN >= g.max;
    const cost = gemCost(g);
    let delta = 0;
    if(!maxed){
      const r = computeGemProduction4449({ [g.key]: curN+1 });
      delta = r.N[49] - baseN49;
    }
    return { name:g.name, currency:g.currency, cost, curN, max:g.max, maxed, delta,
      effPerCost: maxed ? -Infinity : delta/cost };
  });

  results.sort((a,b)=>b.effPerCost-a.effPerCost);
  const finiteEff = results.filter(r=>isFinite(r.effPerCost) && r.effPerCost>0).map(r=>r.effPerCost);
  const maxEff = finiteEff.length ? Math.max(...finiteEff) : 0;

  let rows='';
  results.forEach((r,i)=>{
    const barPct = (maxEff>0 && isFinite(r.effPerCost) && r.effPerCost>0) ? (r.effPerCost/maxEff*100) : 0;
    const barColor = i===0 ? 'var(--accent)' : 'var(--accent2)';
    rows += `
      <div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:3px">
          <span>${i+1}위. ${r.name}${r.maxed?' <span style="color:var(--sub)">(이미 만렙)</span>':''}</span>
          <span style="font-family:var(--mono);color:var(--accent2);font-weight:${maxEff>0&&r.effPerCost===maxEff?'700':'400'}">${r.maxed?'-':formatEfficiencyNumber(r.effPerCost,3)+'/'+r.currency}</span>
        </div>
        <div style="background:var(--border);border-radius:4px;height:10px;overflow:hidden">
          ${!r.maxed&&r.effPerCost>0?`<div style="background:${barColor};height:100%;width:${barPct}%;${maxEff>0&&r.effPerCost===maxEff?'filter:brightness(.78);':''}"></div>`:''}
        </div>
        <div class="note" style="margin-top:2px;margin-bottom:0">
          1개 비용 ${Math.round(r.cost).toLocaleString()}${r.currency} · 현재 ${r.curN}/${r.max}개 · 1개 추가시 시간당 49강 생산량 ${r.maxed?'-':'+'+r.delta.toFixed(6)+'개'}
        </div>
      </div>`;
  });

  out.innerHTML = `
    <div class="stat" style="margin-bottom:10px">
      <span>현재 시간당 49강 생산량</span>
      <span style="font-family:var(--mono)">${baseN49.toFixed(4)} 개/시간</span>
    </div>
    ${rows}
    <p class="note">※ "생산량"은 시간당 49강 도달 개수(N49) 기준입니다. 경험의 보석은 생산량과 무관해(경험치 전용) 순위에서 제외했습니다. 보석은 1·2페이지 모두 무색조각으로 구매하므로 서로 비교할 수 있으니, 같은 화폐(단위) 안에서의 순위만 참고하세요. 44강 도달량은 [1강~44강] 탭에서 계산하며, 재물의 보석은 LV.MAX 크레딧 수급에, 촉진(3P-6·촉진의 보석)은 [2] 자판기 생산 속도에 반영됩니다.</p>`;
}

const TIER_U=[1000,2233,3862,6211,9990,16995,32795,80232,301743,2544122];
const TIER_V=[1000,3333,8750,18571,35000,62000,107500,190000,365000,910000];
const PROMOTE_COST=1000000;

function cycleCost(vaccineFrom,guarFrom){
  let cost=0;
  for(let t=1;t<=10;t++) cost += t<=vaccineFrom ? TIER_U[t-1] : TIER_V[t-1];
  const at=t=>t<=vaccineFrom?TIER_U[t-1]:TIER_V[t-1];
  if(guarFrom===7) cost-=at(8)+at(9)+at(10);
  else if(guarFrom===8) cost-=at(9)+at(10);
  else if(guarFrom===9) cost-=at(10);
  return cost;
}

function cumulativeExp(L){
  const base = 3 * Math.pow(L, 2) - 3 * L + 10;
  if(L <= 50000) return base;
  const x = L - 50000;
  return base + Math.pow(x, 4) / 240 + Math.pow(x, 3) / 15 + 11 * x * x / 60 - 2 * x / 3;
}

// 공속별 실측 배율: 빠름·매우빠름은 24/frames 이론값 대신 실측으로 확인된 배율을 직접 사용
function getUnitPracticalDps(u) {
  const totalAtk = u.atk * u.hits;
  if (u.spd === '빠름') return totalAtk * 1.92;
  if (u.spd === '매우빠름') return totalAtk * 4.17;
  const frames = SPD_FRAMES[u.spd] || 24;
  return totalAtk * (24 / frames);
}

function formatHourlyProduction(value) {
  if (value === 0) return '0';
  const magnitude = Math.abs(value);
  if (magnitude < 0.000001) return value.toExponential(4);
  const decimals = magnitude < 0.1 ? 7
    : magnitude < 1 ? 5
      : magnitude < 10 ? 3
        : magnitude < 100 ? 2 : 1;
  return value.toLocaleString(undefined, { maximumFractionDigits: decimals });
}

function formatMatrixNumber(value){
  if(value===0) return '0';
  const m = Math.abs(value);
  if(m < 0.0001 || m >= 10000) return value.toExponential(1);
  return (m>=1 ? value.toFixed(3) : value.toFixed(4)).replace(/0+$/,'').replace(/\.$/,'');
}

function fmtAfterProd(v){
  if(!v) return '0';
  const m = Math.abs(v);
  if(m < 0.0001 || m >= 100000) return v.toExponential(2);
  return String(parseFloat(v.toPrecision(3)));
}

  if(magnitude < 0.00001 || magnitude >= 10000) return value.toExponential(digits);
  return value.toFixed(5).replace(/0+$/,'').replace(/\.$/,'');
}

function dpsMultThresholds(dps){
  const thresholds=[100,1000,10000,100000];
  let cur=100000, toggle=5;
  while(thresholds[thresholds.length-1] <= dps){
    cur = cur*toggle;
    thresholds.push(cur);
    toggle = toggle===5?2:5;
  }
  return thresholds;
}

function getDpsMultiplierInfo(dps) {
  if (dps < 100) return { mult: 1, next: 100 };
  const thresholds = dpsMultThresholds(dps);
  const n = thresholds.filter(t => dps >= t).length;
  const mult = Math.pow(2, n);
  const next = thresholds[n];
  return { mult, next };
}

// LV.2 전용 배수 구간표: 10만 → 100만(×10) → 500만(×5) → 1000만(×2) → 1억(×10) → 5억(×5) → 10억(×2) ... (10-5-2 반복)
// LV.1(dpsMultThresholds/getDpsMultiplierInfo)은 기존 그대로 유지하고, LV.2에만 이 보정된 구간을 적용한다.
function dpsMultThresholdsLv2(dps){
  const thresholds=[100,1000,10000,100000];
  const cycle=[10,5,2];
  let cur=100000, idx=0;
  while(thresholds[thresholds.length-1] <= dps){
    cur = cur*cycle[idx%3];
    thresholds.push(cur);
    idx++;
  }
  return thresholds;
}

function getDpsMultiplierInfoLv2(dps) {
  if (dps < 100) return { mult: 1, next: 100 };
  const thresholds = dpsMultThresholdsLv2(dps);
  const n = thresholds.filter(t => dps >= t).length;
  const mult = Math.pow(2, n);
  const next = thresholds[n];
  return { mult, next };
}

// 자판기(최대 2대) 비용: 레벨 0은 가동 안함
function costOfVendingPair(lvA, lvB){
  const u = vendUnitsPerSec();
  const cA = lvA > 0 ? (UNIT_BUY_PRICE[lvA] || 0) * u : 0;
  const cB = lvB > 0 ? (UNIT_BUY_PRICE[lvB] || 0) * u : 0;
  return cA + cB;
}

// 자판기 2대를 (0,0=미구매)→(0,1)→(1,1)→(1,L1)→(L1,L1)→(L1,L2)→(L2,L2)→... 순서로 계속 유지 가능한 동안 올려서
// 현재 골드 수급량으로 "완전히" 감당 가능한 가장 높은 조합(best)을 먼저 찾는다.
// 그 다음 단계(nextPair)는 두 조합 중 한 대(1호기 또는 2호기)만 레벨이 바뀌므로(0→1강 포함),
// best를 완전 가동하고 남는 잔여 예산(surplus)으로 그 한 대를 "일부 비율만" 다음 레벨로 섞어 돌린다
// (예: 완전 미구매(0,0)와 1강/1강 사이일 때, 2호기만 잔여 예산 비율만큼 1강을 섞어서 구매 → 나머지 시간은 미구매).
// 이렇게 하면 예산을 100%까지 실제로 소진하면서, 다음 레벨(혹은 0강→1강 진입)은 "가동 가능한 비율만큼만" 생산에 반영된다.
// 0강(미구매) 구간도 동일한 비율 로직으로 다뤄지므로, "1강 한 대조차 못 채우는" 초반 저소득 구간도 자연스럽게 계산된다.
function autoClimbVending(moneyEarnedPerSec){
  const LEVELS = Object.keys(UNIT_BUY_PRICE).map(Number).sort((a,b)=>a-b);
  let pairs = [[0,0]];
  let lastLo = 0;
  LEVELS.forEach(lv=>{
    pairs.push([lastLo, lv]); // 2호기를 다음 레벨로
    pairs.push([lv, lv]);     // 1호기도 맞춰서 올림
    lastLo = lv;
  });

  const priceOf = lv => lv>0 ? (UNIT_BUY_PRICE[lv]||0) : 0; // 0강(미구매)의 단가는 0

  let bestIdx = 0; // pairs[0]=[0,0](미구매)은 비용 0이라 항상 감당 가능
  for(let i=0;i<pairs.length;i++){
    if(costOfVendingPair(pairs[i][0], pairs[i][1]) <= moneyEarnedPerSec) bestIdx = i;
    else break;
  }
  const best = pairs[bestIdx];
  const bestCost = costOfVendingPair(best[0], best[1]);

  // 다음 단계와 "섞어서" 잔여 예산을 마저 쓰는 비율(mix) 계산 — 0강(미구매)↔1강 전환 구간도 동일하게 적용
  let mix = null; // { idx: 0(1호기)|1(2호기), fromLv, toLv, toRatio(0~1) }
  const nextPair = pairs[bestIdx+1];
  if(nextPair){
    const diffIdx = nextPair[0]!==best[0] ? 0 : 1; // 어느 대가 레벨이 바뀌는지
    const fromLv = best[diffIdx], toLv = nextPair[diffIdx];
    const deltaRatePerSec = vendUnitsPerSec()*(priceOf(toLv) - priceOf(fromLv));
    const surplus = moneyEarnedPerSec - bestCost; // best를 완전 가동하고 남는 돈
    if(deltaRatePerSec>0 && surplus>0){
      const toRatio = Math.min(1, surplus/deltaRatePerSec);
      if(toRatio>0) mix = { idx: diffIdx, fromLv, toLv, toRatio };
    }
  }

  // 실제로 지출되는 비용: best 완전가동 비용 + mix로 추가 지출되는 만큼 (mix가 있으면 거의 항상 income과 일치)
  const actualCost = bestCost + (mix ? mix.toRatio*vendUnitsPerSec()*(priceOf(mix.toLv)-priceOf(mix.fromLv)) : 0);

  return { lvA: best[0], lvB: best[1], cost: bestCost, actualCost, mix };
}

// vendingAuto 결과로부터 실제 투입 스트림을 {강화단계: 초당개수} 형태로 계산 (혼합 가동 반영, 0강/미구매는 제외)
function getVendingFeedStreams(vendingAuto){
  const { lvA, lvB, mix } = vendingAuto;
  const pair = [lvA, lvB];
  const raw = [], U = vendUnitsPerSec();
  if(mix){
    const stableIdx = mix.idx===0 ? 1 : 0;
    if(pair[stableIdx]>0) raw.push({ lv: pair[stableIdx], rate: U });
    if(mix.fromLv>0) raw.push({ lv: mix.fromLv, rate: U*(1-mix.toRatio) });
    if(mix.toLv>0) raw.push({ lv: mix.toLv, rate: U*mix.toRatio });
  } else {
    if(lvA>0) raw.push({ lv: lvA, rate: U });
    if(lvB>0) raw.push({ lv: lvB, rate: U });
  }
  const merged = {};
  raw.forEach(s=>{ if(s.rate>0) merged[s.lv] = (merged[s.lv]||0) + s.rate; });
  return merged; // {lv: 초당 개수}
}

// 레벨 lv에서의 +1/+2/+3 강화확률(%) 계산: 기준확률 + 스텟/보스 보너스 + 37강 상한 병합 규칙
function getMergedEnhanceProb(lv, statP1, statP2, statP3, bossProb1){
  if(BASE_PROB[lv] === undefined) return {p1:0,p2:0,p3:0};
  const base1 = BASE_PROB[lv]*100;
  const base2 = base1 * 0.1;   // +2강 기준확률 = +1강 기준확률의 1/10
  const base3 = base1 * 0.01;  // +3강 기준확률 = +1강 기준확률의 1/100
  let p1 = base1 + statP1 + bossProb1;
  let p2 = base2 + statP2;
  let p3 = base3 + statP3;

  const p2Valid = (lv+2) <= ENHANCE_MERGE_CEIL;
  const p3Valid = (lv+3) <= ENHANCE_MERGE_CEIL;
  if(!p2Valid){ p1 += p2 + p3; p2 = 0; p3 = 0; }       // +2·+3 → +1로 합산
  else if(!p3Valid){ p2 += p3; p3 = 0; }               // +3 → +2로 합산

  if(p1 + p2 + p3 > 100) p1 = 100 - p2 - p3;
  return {p1,p2,p3};
}

// ===================== 39강 이하 스텟 투자 효율 분석 (순수 계산 함수) =====================
// 화면(DOM)의 "현재 실제 입력값"을 그대로 읽어서 계산하되, invOverride로 특정 스텟 투자값만
// 가상으로 바꿔볼 수 있게 한 함수. [2]에서 계산되는 골드 수급→자판기 자동배정까지 전부 다시
// 반영하므로, 강화확률에 직접 영향이 없는 "보유 유닛 공업"(1P-2) 스텟도 (돈→자판기 단계 변화를
// 통해) 정확히 비교에 포함된다. 41강 이후(LV.MAX 사냥터)는 계산식 자체가 다르므로 이 분석 범위에
// 포함하지 않고, 1~39강 구간의 "시간당 40강 도달 개수(N40)"만을 생산량 지표로 사용한다.
function computeProductionN40(invOverride){
  invOverride = invOverride || {};
  const inv = id => (invOverride[id] !== undefined) ? invOverride[id] : statInvById(id);

  const statAtkUp = inv('inv_1_2');
  const moneyStatMult = 1 + inv('inv_1_1') * 0.01; // 1P-1: 모든 사냥터(LV.1/LV.2/LV.MAX) 돈 수급 +1%/Lv
  const statP1 = (inv('inv_1_3') + inv('inv_2_1')) * 0.1 + getRaceInv('A') * 0.25 + gemGP(); // 고유유닛 A: +1강확 +0.25%p/회
  const statP2 = (inv('inv_1_4') + inv('inv_2_2')) * 0.1;
  const statP3 = (inv('inv_1_5') + inv('inv_2_3')) * 0.1;

  const bossLv = maxBossLevel;
  const bBonus = getBossCumulativeBonus(bossLv);
  const totalAtkMult = getCappedAtkMult(statAtkUp, bBonus.atkPercent);

  let dpsLv1=0, dpsLv2=0, dpsMax=0;
  huntUnitRows.forEach(row=>{
    const uData = getHuntUnitData(row.lv);
    if(uData && row.count>0){
      const contribution = getUnitPracticalDps(uData) * row.count * totalAtkMult;
      if(row.lv<=25) dpsLv1+=contribution; else if(row.lv<=40) dpsLv2+=contribution; else dpsMax+=contribution;
    }
  });
  { // 고유유닛(레이스) DPS 반영 — [2] 사냥터 돈 수급 계산기와 동일
    const uq = getUniqueUnitHunt();
    const ud = uq.baseDps * totalAtkMult;
    if(uq.zone===2) dpsLv2+=ud; else dpsLv1+=ud;
  }
  const infoLv1=getDpsMultiplierInfo(dpsLv1), infoLv2=getDpsMultiplierInfoLv2(dpsLv2);
  const moneyPerSec = (dpsLv1*infoLv1.mult + dpsLv2*infoLv2.mult*100000 + dpsMax*1e10*(invOverride._wealth||1)) * moneyStatMult * speedMult(); // _wealth: 재물 보석(LV.MAX 돈 배율, [44~50강] 탭에서 전달) // LV.MAX: DPS 배수 보너스 없이 DPS×100억

  const vendingAuto = autoClimbVending(moneyPerSec);
  const feedStreams = getVendingFeedStreams(vendingAuto);

  const N={}; for(let lv=1; lv<=40; lv++) N[lv]=0;
  Object.keys(feedStreams).forEach(lvStr=>{
    const lv=parseInt(lvStr);
    if(lv>=1 && lv<=40) N[lv]+=feedStreams[lvStr]*3600;
  });
  const failed={}; for(let lv=1; lv<=40; lv++) failed[lv]=0;
  for(let lv=1; lv<=39; lv++){
    if(N[lv]<=0) continue;
    const {p1,p2,p3}=getMergedEnhanceProb(lv, statP1, statP2, statP3, bBonus.prob1);
    const succRate = (p1+p2+p3)/100;
    failed[lv] = N[lv] * Math.max(0, 1-succRate);
    if(p1>0) N[lv+1]+=N[lv]*(p1/100);
    if(p2>0 && lv+2<=40) N[lv+2]+=N[lv]*(p2/100);
    if(p3>0 && lv+3<=40) N[lv+3]+=N[lv]*(p3/100);
  }
  return { N40:N[40], N, failed, moneyPerSec, vendingAuto };
}

// ~39강 효율 후보: 1P-1(모든 사냥터 돈 → 자판기) + 39강 이하 강화확률/공업 스텟
const EARLY_STAT_KEYS = ['1_1','1_2','1_3','1_4','1_5','2_1','2_2','2_3'];
// 40~44강 효율 후보: 공업·돈 수급 스텟과 40~43강 특수 강화 관련 스텟
const LATE_STAT_KEYS = ['1_1','1_2','1_3','1_4','1_5','1_6','2_1','2_2','2_3','2_4','2_5','2_6'];

// 40강 → 44강 생산량과 단계별 확률을 계산한다.
// 현재 단계의 +1 확률이 0이면, 해당 단계의 생산량은 가장 가까운 이전 단계로 표시한다.
function computeProductionN44Details(invOverride){
  invOverride = invOverride || {};
  const base = computeProductionN40(invOverride);
  const g = (p,n) => { const k=`inv_${p}_${n}`; return invOverride[k]!==undefined ? invOverride[k] : getStatInv(p,n); };
  const pabang = (g(2,5) + g(2,6)) * 0.1 + getRaceInv('X') * 1;
  const N = { 40: base.N40 };
  const prob = {};
  [40,41,42,43].forEach(lv=>{
    const eff = applyDestructionPrevention(getRaw40to43(lv, g), pabang); // 원확률 0% 이하(-0.1 → 0 포함)는 생산 0으로 처리, 0 초과(-0.099 → +0.001 등)부터 표시
    prob[lv] = eff;
    N[lv + 1] = N[lv] * eff / 100;
  });
  let displayStage = 44;
  for(let lv=40; lv<=43; lv++){
    if(prob[lv] <= 0){
      displayStage = lv;
      break;
    }
  }
  return { N, prob, displayStage, production: N[displayStage] };
}
function computeProductionN44(invOverride){
  return computeProductionN44Details(invOverride).production;
}
function computeProductionN40Val(o){ return computeProductionN40(o).N40; }

// 44강 도달이 막혀 있을 때(총 성공확률 0) 비교 기준: 40~43강 중 가장 낮은 원확률(특수확률 최저값)
function computeN44BottleneckRaw(invOverride){
  invOverride = invOverride || {};
  const g = (p,n) => { const k=`inv_${p}_${n}`; return invOverride[k]!==undefined ? invOverride[k] : getStatInv(p,n); };
  const specialProb = (g(1,6) + g(2,4)) * 0.1 + getRaceInv('S') * 0.5;
  return Math.min(...[40,41,42,43].map(lv=>getRaw40to43(lv, g)));
}

function renderEfficiencyList(out, title, baseVal, keys, computeFn, blockedFn){
  const blocked = baseVal<=0 && typeof blockedFn==='function';
  const blockedBase = blocked ? blockedFn({}) : 0;
  const results = keys.map(k=>{
    const [p,n] = k.split('_').map(Number);
    const s = STAT_OPTIONS.find(o=>o.page===p && o.no===n);
    const curLv = getStatInv(p,n);
    const maxed = curLv >= s.max;
    let relPct = 0, gain = 0;
    if(!maxed){
      if(blocked){
        gain = blockedFn({ [`inv_${k}`]: curLv+1 }) - blockedBase;
        relPct = gain;
      } else {
        const v = computeFn({ [`inv_${k}`]: curLv+1 });
        relPct = baseVal>0 ? ((v-baseVal)/baseVal*100) : (v>0 ? Infinity : 0);
      }
    }
    return { name:`${p}P-${n}. ${s.name}`, maxed, relPct, effPerPoint: maxed ? -Infinity : relPct/s.cost };
  });
  results.sort((a,b)=>b.effPerPoint-a.effPerPoint);
  const finite = results.filter(r=>isFinite(r.effPerPoint) && r.effPerPoint>0).map(r=>r.effPerPoint);
  const maxEff = finite.length ? Math.max(...finite) : 0;
  let rows='';
  results.forEach((r,i)=>{
    const hasBar = !r.maxed&&!blocked&&isFinite(r.effPerPoint)&&r.effPerPoint>0;
    const barPct = hasBar&&maxEff>0 ? r.effPerPoint/maxEff*100 : 0;
    const barColor = i===0 ? 'var(--accent)' : 'var(--accent2)';
    rows += `
      <div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:3px">
          <span style="font-weight:${r.effPerPoint===Infinity||(maxEff>0&&r.effPerPoint===maxEff)?'700':'400'}">${i+1}위. ${r.name}${r.maxed?' <span style="color:var(--sub)">(이미 만렙)</span>':''}</span>
        </div>
        <div style="background:var(--border);border-radius:4px;height:10px;overflow:hidden">
          ${hasBar?`<div style="background:${barColor};height:100%;width:${barPct}%;${maxEff>0&&r.effPerPoint===maxEff?'filter:brightness(.78);':''}"></div>`:''}
        </div>
        <div class="note" style="margin-top:2px;margin-bottom:0">
          ${blocked ? `1레벨 추가시 막힌 단계 확률 ${r.maxed?'-':'+'+r.relPct.toFixed(3)+'%p'}` : `1레벨 추가시 생산량 상대 증가 ${r.maxed?'-':(isFinite(r.relPct)?r.relPct.toFixed(3)+'%':'∞')}`}
        </div>
      </div>`;
  });
  out.innerHTML = `
    <div class="stat" style="margin-bottom:10px">
      <span>현재 상태 기준 ${title}</span>
      <span style="font-family:var(--mono)">${formatEfficiencyNumber(baseVal,3)} 개/시간</span>
    </div>
    ${blocked ? '<div class="note" style="margin:0 0 8px">특수확률이 0 이하인 단계가 있어 지금은 도달할 수 없습니다. 막힌 단계를 푸는 데 도움되는 순서로 표시합니다.</div>' : ''}
    ${rows}`;
}


// ===================== [1강~44강] +추천: 남은 스텟 포인트를 효율(증가량 ÷ 비용) 순으로 배분 =====================
const REC_EARLY_STORAGE_KEY = 'dps-rec-target-early-v1';
let recTargetEarly = 40, recTimerEarly = null;
try { const _v = parseInt(localStorage.getItem(REC_EARLY_STORAGE_KEY)); if(_v>=40 && _v<=44) recTargetEarly = _v; } catch(e) {}
function saveRecTargetEarly(){ try { localStorage.setItem(REC_EARLY_STORAGE_KEY, String(recTargetEarly)); } catch(e) {} }
function computeRecEarly(){
  const tg = recTargetEarly;
  let sb = charLevel*POINTS_PER_LEVEL;
  STAT_OPTIONS.forEach(s=>{ sb -= Math.max(0, Math.min(s.max, getStatInv(s.page,s.no))) * s.cost; });
  const lv = {}, opt = {}, add = {}, spend = {};
  EFF_MATRIX_KEYS.forEach(([p,n])=>{ const k=`${p}_${n}`; opt[k] = STAT_OPTIONS.find(o=>o.page===p&&o.no===n); lv[`inv_${k}`] = Math.max(0, Math.floor(getStatInv(p,n))); });
  const res = { add, spend, sb, tg, ok: true, unblock: false };
  // 목표 강까지 가는 데 필요한 40~(목표-1)강 중 가장 낮은 원확률. 0 이하인 단계가 있으면 생산량이 0이라 이 값을 먼저 올린다.
  const stages = [40,41,42,43].filter(L=>L<tg);
  const bottleneck = m => { const g=(p,n)=>m[`inv_${p}_${n}`]; return stages.length ? Math.min(...stages.map(L=>getRaw40to43(L,g))) : 1; };
  const prodOf = m => computeProductionN44Details(m).N[tg] || 0;
  let cur = prodOf(lv);
  const blocked0 = !(cur>0);
  if(blocked0 && stages.length===0){ res.ok = false; return res; }
  res.unblock = blocked0;
  const t0 = performance.now();
  for(let it=0; it<400 && performance.now()-t0<600; it++){
    if(!(sb>0)) break;
    const blocked = !(cur>0);
    const base = blocked ? bottleneck(lv) : cur;
    let best = null;
    Object.keys(opt).forEach(k=>{
      const s = opt[k], n = lv[`inv_${k}`]; if(n>=s.max || s.cost>sb) return;
      const m2 = {...lv, [`inv_${k}`]:n+1};
      const gain = (blocked ? bottleneck(m2) : prodOf(m2)) - base;
      if(gain>0){ const sc = gain/s.cost; if(!best || sc>best.sc) best = {k, s, n, sc}; }
    });
    if(!best) break;
    let q = 1;
    if(!blocked){ const m = Math.min(best.s.max - best.n, Math.floor(sb/best.s.cost)); q = Math.max(1, Math.floor(m/10)); }
    lv[`inv_${best.k}`] += q; add[best.k] = (add[best.k]||0) + q; spend[best.k] = (spend[best.k]||0) + q*best.s.cost; sb -= q*best.s.cost;
    cur = prodOf(lv);
  }
  res.sb = sb;
  return res;
}
function scheduleRecEarly(){ clearTimeout(recTimerEarly); recTimerEarly = setTimeout(applyRecEarly, 80); }
function applyRecEarly(){
  if(!document.getElementById('recTargetEarly')) return;
  const r = computeRecEarly();
  EFF_MATRIX_KEYS.forEach(([p,n])=>{
    const el = document.getElementById(`recE_${p}_${n}`); if(!el) return;
    const a = r.add[`${p}_${n}`] || 0;
    if(a>0){ el.textContent = '+'+a.toLocaleString(); el.title = `${a.toLocaleString()}Lv 추가 · 비용 ${(r.spend[`${p}_${n}`]||0).toLocaleString()}P`; }
    else { el.textContent = ''; el.title = ''; }
  });
  const note = document.getElementById('recNoteEarly'); if(!note) return;
  if(!r.ok){ note.textContent = `+추천: ${r.tg}강 기준은 계산할 수 있는 단계가 없습니다.`; return; }
  const used = Object.values(r.spend).reduce((a,b)=>a+b,0);
  const pre = r.unblock ? `현재 ${r.tg}강까지 도달할 수 없어(생산량 0) 막힌 단계를 푸는 스텟부터 채웠습니다. ` : '';
  note.textContent = `+추천 (${r.tg}강 기준, 증가량 ÷ 비용 효율순): ${pre}스텟 ${used.toLocaleString()}P 사용 → 남는 포인트 ${Math.round(r.sb).toLocaleString()}`;
}

// 스텟 투자 효율 표: 각 스텟을 1레벨 추가했을 때의 생산량과 비용 대비 효율
const EFF_MATRIX_KEYS = [[1,1],[1,2],[1,3],[1,4],[1,5],[1,6],[2,1],[2,2],[2,3],[2,4],[2,5],[2,6]];
function calcStatEfficiencyMatrix(){
  if(!document.getElementById('outStatEfficiencyMatrix')) return;
  const cols = [40,41,42,43,44];
  const baseDetails = computeProductionN44Details({});
  const b0 = baseDetails.N;
  cols.forEach(L=>{ const e=document.getElementById('effprod_'+L); if(e) e.textContent = formatMatrixNumber(b0[L]||0); });
  const items = EFF_MATRIX_KEYS.map(([p,n])=>{
    const s = STAT_OPTIONS.find(o=>o.page===p && o.no===n), cur = getStatInv(p,n);
    const it = { p, n, e:{} };
    if(cur>=s.max){ it.maxed = true; return it; }
    const nextDetails = computeProductionN44Details({ [`inv_${p}_${n}`]: cur+1 });
    it.production = nextDetails.N;
    cols.forEach(L=>{
      const b=b0[L]||0, v=nextDetails.N[L]||0;
      it.e[L] = b>0 ? (v-b)/b*100/s.cost : v/s.cost;
    });
    return it;
  });
  const mx = {};
  cols.forEach(L=>{ mx[L] = Math.max(0, ...items.filter(i=>!i.maxed).map(i=>i.e[L]).filter(isFinite)); });
  items.forEach(it=>{
    const tds = cols.map(L=>document.getElementById(`eff_${it.p}_${it.n}_${L}`));
    if(tds.some(t=>!t)) return;
    tds.forEach(t=>{ t.style.display=''; t.colSpan=1; t.style.textAlign=''; t.style.color=''; });
    if(it.maxed){
      tds[0].className=''; tds[0].colSpan=cols.length; tds[0].style.textAlign='center'; tds[0].style.color='var(--sub)'; tds[0].textContent='만렙';
      tds.slice(1).forEach(t=>{ t.style.display='none'; });
      return;
    }
    cols.forEach(L=>{
    const td = document.getElementById(`eff_${it.p}_${it.n}_${L}`); if(!td) return;
    const v = it.e[L];
    const production = it.production[L]||0;
    const hasBar = production>0&&v>0&&isFinite(v)&&mx[L]>0;
    if(!hasBar){
      td.className='eff-empty';
      td.innerHTML='<div style="height:30px"></div>';
      return;
    }
    const w = hasBar ? Math.max(4, v/mx[L]*100) : 0;
    const isBest = hasBar&&v===mx[L];
    td.className = '';
    td.innerHTML = `<div style="height:30px;display:flex;flex-direction:column;justify-content:center"><div title="${formatHourlyProduction(production)}개/시간 (해당 스텟 +1레벨) · 효율 ${formatMatrixNumber(v)}%/P" style="font:.64rem var(--mono);line-height:13px;white-space:nowrap;font-weight:${isBest?'700':'400'}">${formatMatrixNumber(production)}</div><div style="height:8px;background:var(--border);border-radius:2px;overflow:hidden"><div style="height:100%;width:${w}%;background:var(--accent);border-radius:2px;${isBest?'filter:brightness(.78);':''}"></div></div></div>`;
    });
  });
}

// [3] 1~40강 +1/+2/+3강 확률 + 시간당 생산량: 레벨별 기준확률(+1) + 스텟(+1/+2/+3 강화확률, ...2) 투자
// + 개인 보스 처치(+1강만 가산), 37강 상한 병합 규칙 반영. 1~39강은 실패 시 유닛 파괴(다음 레벨로 이어지지 않음).
function updateEnhance1to40(){
  const summaryEl=document.getElementById('enhanceP123Summary');
  if(!summaryEl) return;

  const inv=id=>statInvById(id);
  // 페이지1/페이지2의 +1,+2,+3 강화확률 스텟(각 perLevel 0.1%p) + 고유유닛 A(+1강확 +0.25%p/회)
  const statP1 = (inv('inv_1_3') + inv('inv_2_1')) * 0.1 + getRaceInv('A') * 0.25 + gemGP();
  const statP2 = (inv('inv_1_4') + inv('inv_2_2')) * 0.1;
  const statP3 = (inv('inv_1_5') + inv('inv_2_3')) * 0.1;

  const bossLv = parseInt(document.getElementById('maxBoss')?.value) || 0;
  const bBonus = getBossCumulativeBonus(bossLv); // 개인 보스는 +1강 확률(prob1)만 가산

  // 1강~40강 각 레벨의 확률을 먼저 구해둔다 (시간당 생산량 계산에도 재사용)
  const probByLv = {};
  for(let lv=1; lv<=40; lv++) probByLv[lv] = getMergedEnhanceProb(lv, statP1, statP2, statP3, bBonus.prob1);

  UNIT_DPS_DATA.forEach(u => {
    const lv = u.lv;
    const c1=document.getElementById(`enh-p1-${lv}`), c2=document.getElementById(`enh-p2-${lv}`), c3=document.getElementById(`enh-p3-${lv}`);
    if(!c1) return;
    const {p1,p2,p3} = probByLv[lv];
    if(BASE_PROB[lv] === undefined){ c1.textContent='-'; c2.textContent='-'; c3.textContent='-'; return; }
    c1.textContent = p1.toFixed(2)+'%';
    c2.textContent = p2>0 ? p2.toFixed(2)+'%' : '-';
    c3.textContent = p3>0 ? p3.toFixed(3)+'%' : '-';
  });

  // 40~43강(44강은 표시 안 함): +1만 가능. 원확률 / 파괴방지 확률 / 총 성공 확률(파괴방지 반영)
  {
    const sp = getSpecial40to50StatBonus();
    [40,41,42,43].forEach(lv=>{ // 44강은 확률 칸을 비워둠
      const raw = getRaw40to43(lv);
      const eff = applyDestructionPrevention(raw, sp.pabang);
      const ea=document.getElementById(`sp-a-${lv}`), eb=document.getElementById(`sp-b-${lv}`), ec=document.getElementById(`sp-c-${lv}`);
      if(ea) ea.textContent = raw.toFixed(2)+'%';
      if(eb) eb.textContent = sp.pabang.toFixed(1)+'%';
      if(ec) ec.innerHTML = '<b>'+eff.toFixed(2)+'%</b>';
    });
    const e44 = document.getElementById('sp-a-44');
    if(e44) e44.textContent = '-';
  }

  // 시간당 생산량: [2]에서 자동 배정된 자판기 강화 단계·혼합비율(getVendingFeedStreams)을 그대로 투입한다고 보고,
  // 확률대로 +1/+2/+3 성공분만 다음 레벨로 넘어가며 나머지(실패분)는 1~39강에서 파괴되어 사라진다고 보고 순차적으로 흘려보내는 모델.
  // 돈이 부족해 다음 레벨을 100% 가동 못 하면(예: 20%만 감당 가능) 그 20%만큼만 해당 레벨 투입량에 반영된다.
  const feedStreams = getVendingFeedStreams(lastVendingAuto); // {강화단계: 초당개수}
  const N = {};
  for(let lv=1; lv<=44; lv++) N[lv]=0;
  Object.keys(feedStreams).forEach(lvStr=>{
    const lv = parseInt(lvStr);
    if(lv>=1 && lv<=40) N[lv] += feedStreams[lvStr]*3600;
  });
  const failed = {};
  for(let lv=1; lv<=44; lv++) failed[lv]=0;
  for(let lv=1; lv<=39; lv++){
    if(N[lv] <= 0) continue;
    const {p1,p2,p3} = probByLv[lv];
    const succRate = (p1+p2+p3)/100;
    failed[lv] = N[lv] * Math.max(0, 1-succRate);
    if(p1>0) N[lv+1] += N[lv]*(p1/100);
    if(p2>0 && lv+2<=40) N[lv+2] += N[lv]*(p2/100);
    if(p3>0 && lv+3<=40) N[lv+3] += N[lv]*(p3/100);
    // 실패분(1 - p1-p2-p3)은 파괴되어 소멸, 다음 레벨로 이어지지 않음
  }
  // 40~44강은 +1강 성공분을 다음 단계로 순차 전파한다.
  const sp = getSpecial40to50StatBonus();
  const specialProbByLv = {};
  [40,41,42,43].forEach(lv=>{
    const raw = getRaw40to43(lv);
    specialProbByLv[lv] = applyDestructionPrevention(raw, sp.pabang);
    const rawProb = clamp01(raw / 100);
    const protectionProb = clamp01(sp.pabang / 100);
    const retryDenominator = 1 - (1 - rawProb) * protectionProb;
    failed[lv] = retryDenominator > 0
      ? N[lv] * (1 - rawProb) / retryDenominator
      : Infinity;
    N[lv + 1] = N[lv] * specialProbByLv[lv] / 100;
  });
  UNIT_DPS_DATA.forEach(u => {
    const c=document.getElementById(`hourly-${u.lv}`);
    if(!c) return;
    c.textContent = formatHourlyProduction(N[u.lv]);
  });
  const lateStageReachable = {};
  let canReachNextStage = N[40] > 0;
  UNIT_DPS_DATA_4144.forEach(u => {
    const lv = u.lv;
    canReachNextStage = canReachNextStage && specialProbByLv[lv - 1] > 0;
    lateStageReachable[lv] = canReachNextStage;
    const c = document.getElementById(`hourly-${lv}`);
    if(c) c.textContent = canReachNextStage
      ? formatHourlyProduction(N[lv]||0)
      : '-';
  });

  // 시간당 획득 경험치(실패 고려): 판매/실패 경험치에 표시된 추가 획득량 보너스를 합연산으로 적용.
  // 보스 경험치 보너스, 고유유닛 E옵션, 레벨 1000 이하 자동 2배(+100%)를 더한다.
  const expAddPart = 1 + bBonus.expPercent/100 + getRaceInv('E')*20/100 + (charLevel <= 1000 ? 1 : 0);
  const { disp: expDisp, real: expReal } = expMultiplierParts(expAddPart);
  const failExpByLv = {};
  UNIT_DPS_DATA.forEach(u=>{ if(u.failExp !== undefined) failExpByLv[u.lv] = u.failExp; });
  UNIT_DPS_DATA_4144.forEach(u=>{ if(u.failExp !== undefined) failExpByLv[u.lv] = u.failExp; });
  let runningFailExp = 0;
  let bestSaleLv = 0, bestSaleExp = 0;
  for(let lv=1; lv<=44; lv++){
    const u = UNIT_DPS_DATA.find(x=>x.lv===lv) || UNIT_DPS_DATA_4144.find(x=>x.lv===lv);
    const c = document.getElementById(`exphr-${lv}`);
    const cFail = document.getElementById(`failhr-${lv}`);
    const cSale = document.getElementById(`saleexp-${lv}`);
    const stageReachable = lv < 41 || lateStageReachable[lv];
    if(cSale){
      // 판매 시 경험치도 동일한 경험치 배수(개인보스·고유유닛 E옵션·레벨1000이하 2배)를 곱연산으로 반영
      cSale.textContent = (u && u.failExp !== undefined) ? Math.round(u.failExp*expDisp).toLocaleString() : '-';
    }
    if(cFail) cFail.textContent = stageReachable && u && u.failExp !== undefined
      ? Math.round(runningFailExp * expReal).toLocaleString()
      : '-';
    if(c){
      if(stageReachable && u && u.failExp !== undefined){
        const successExpPerHour = (N[lv]||0) * (u.failExp*10) * expReal;
        const failExpPerHour = runningFailExp * expReal;
        c.textContent = Math.round(successExpPerHour + failExpPerHour).toLocaleString();
        if(successExpPerHour + failExpPerHour > bestSaleExp){ bestSaleExp = successExpPerHour + failExpPerHour; bestSaleLv = lv; }
      } else {
        c.textContent = '-';
      }
    }
    if(failExpByLv[lv] !== undefined) runningFailExp += (failed[lv]||0) * failExpByLv[lv];
  }
  { const n=document.getElementById('expNormalHr'), bl=document.getElementById('expBestLabel'), bh=document.getElementById('expBestHr');
    if(n) n.textContent = Math.round(runningFailExp*expReal).toLocaleString() + ' EXP';
    if(bl) bl.textContent = bestSaleLv ? `판매 시 최고: ${bestSaleLv}강 판매` : '판매 시 최고 경험치 강';
    if(bh) bh.textContent = bestSaleLv ? Math.round(bestSaleExp).toLocaleString() + ' EXP' : '-';
  }

  const { lvA, lvB, mix } = lastVendingAuto;
  let feedLabel;
  if(mix){
    const machineName = idx => idx===0 ? '1호기' : '2호기';
    const stableLv = mix.idx===0 ? lvB : lvA;
    feedLabel = `${machineName(mix.idx===0?1:0)} ${vendLvLabel(stableLv)}(100%) + ${machineName(mix.idx)} [${vendLvLabel(mix.fromLv)} ${((1-mix.toRatio)*100).toFixed(1)}% / ${vendLvLabel(mix.toLv)} ${(mix.toRatio*100).toFixed(1)}%]`;
  } else {
    feedLabel = lvA===lvB ? `${vendLvLabel(lvA)} × 2대` : `${vendLvLabel(lvA)} 1대 + ${vendLvLabel(lvB)} 1대`;
  }
  summaryEl.innerHTML = `
    <div class="stat"><span>+1강 확률 보너스</span><span>스텟 +${statP1.toFixed(1)}%p, 보스 +${bBonus.prob1.toFixed(1)}%p</span></div>

    <div class="stat"><span>+3강 확률 보너스</span><span>스텟 +${statP3.toFixed(1)}%p</span></div>

  `;

  if(document.getElementById('outStatEfficiency')) calcStatEfficiency();
}

// [3] 44~50강 강화 확률 및 시간당 생산량 표
function render4450Table(){
  const tbody = document.getElementById('special40to50Body');
  const gachaBody = document.getElementById('gachaHourlyBody');
  if(!tbody || !gachaBody) return;
  const r = computeGemProduction4449({}), pb = r.pabang;
  const row = (lv, cfg, raw, N)=>{
    const eff = raw===null ? null : applyDestructionPrevention(raw, pb);
    const meta = getHuntUnitData(lv);
    const dps = meta ? getUnitPracticalDps(meta) : 0;
    return `<tr><td>${lv}강</td><td>${meta?.spd||'-'}</td><td>${dps?formatHourlyProduction(dps):'-'}</td><td style="color:var(--sub);font-size:.8rem">${cfg}</td><td>${raw===null?'-':raw.toFixed(2)+'%'}</td><td>${raw===null?'-':pb.toFixed(1)+'%'}</td><td>${eff===null?'-':'<b>'+eff.toFixed(2)+'%</b>'}</td><td><b>${formatHourlyProduction(N)}</b></td></tr>`;
  };
  let rows = '';
  [44,45,46,47,48].forEach(lv=>{
    const st = INDIVIDUAL_STAT_44_48[lv], statB = getStatInv(st.page, st.no)*st.perLevel;
    const gemB = r.gemAgg.individualBonus[lv] + r.gemAgg.globalProbByLv[lv];
    const raw = Math.max(INDIVIDUAL_BASE_PROB_44_48[lv] + statB + gemB, 0);
    rows += row(lv, `${INDIVIDUAL_BASE_PROB_44_48[lv].toFixed(1)}% + 스텟 ${statB.toFixed(1)} + 보석 ${gemB.toFixed(2)}%p`, raw, r.N[lv]);

// ===================== [44~50강] 총 무조 · 남은 무조 · 효율 기준 추천 배분(+추천 열) =====================
function fmtKRSigned(n){ return n<0 ? '-'+fmtKR(-n) : fmtKR(n); }
function gemSpentShards(){
  let t = 0;
  GEM_OPTIONS.forEach(g=>{ const n = Math.max(0, Math.min(g.max, Math.floor(getGemInv(g.key)))); for(let k=0;k<n;k++) t += g.cost(k); });
  return t;
}
function statSpentPoints(){
  let t = 0;
  STAT_OPTIONS.forEach(s=>{ t += Math.max(0, Math.min(s.max, getStatInv(s.page, s.no))) * s.cost; });
  return t;
}
// 넣을 수 있는 총 무조의 상한: 2해 1016경 (모든 보석 최대치 비용 약 2해1015경에 여유를 둠)
const GEM_TOTAL_MAX = 210151110076496401761; // 보석 20종 최대 누적 비용 합계(보석_비용 시트, 정확값)
function gemMaxTotalShards(){ return GEM_TOTAL_MAX; }
// 해·경·조·억·만 단위로 읽고 쓰기 (숫자만 써도 되고, 섞어 써도 된다: 2해 1015경 920조 / 5조 / 5000000000000)
const KR_UNIT_MAP = {'해':10n**20n,'경':10n**16n,'조':10n**12n,'억':10n**8n,'만':10n**4n};
function parseUnits(str){
  let total = 0n;
  (String(str).replace(/[,\s]/g,'').match(/\d+(?:\.\d+)?[해경조억만]?/g) || []).forEach(tok=>{
    const m = tok.match(/^(\d+)(\.\d+)?([해경조억만])?$/); if(!m) return;
    const mult = m[3] ? KR_UNIT_MAP[m[3]] : 1n;
    total += m[2] ? BigInt(Math.round(parseFloat(m[1]+m[2]) * Number(mult))) : BigInt(m[1]) * mult;
  });
  return total;
}
function fmtUnits(n){
  n = Math.round(n); if(!(n>0)) return '0';
  let b = BigInt(plainDigits(n)); const parts = [];
  for(const [l,v] of Object.entries(KR_UNIT_MAP)){ const q = b/v; if(q>0n){ parts.push(q+l); b -= q*v; } }
  if(b>0n) parts.push(String(b));
  return parts.join(' ');
}
// 남은 무조 표시용: 억 이상이면 가장 큰 두 단위까지만 (예: 조·억, 억·만, 해·경). 억 미만은 만 아래 자리까지 그대로.
function fmtUnitsTop2(n){
  n = Math.round(n); if(!(n>0)) return '0';
  const b = BigInt(plainDigits(n));
  if(b < 10n**8n) return fmtUnits(n);
  const units = Object.entries(KR_UNIT_MAP);
  const i = units.findIndex(([l,v])=>b/v>0n);
  const [l1,v1] = units[i], q1 = b/v1, rest = b - q1*v1;
  const [l2,v2] = units[i+1], q2 = rest/v2;
  return q1+l1 + (q2>0n ? ' '+q2+l2 : '');
}
function setGemTotal(el){
  // 숫자만 받고 천 단위 쉼표를 붙인다(커서 위치 유지). 상한 초과는 상한으로 맞춤
  const before = el.value.slice(0, el.selectionStart||0).replace(/\D/g,'').length;
  let digits = el.value.replace(/\D/g,'').replace(/^0+(?=\d)/,'');
  const maxD = plainDigits(gemMaxTotalShards());
  if(digits && BigInt(digits) > BigInt(maxD)) digits = maxD;
  el.value = digits.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  let pos = 0, cnt = 0; while(pos<el.value.length && cnt<before){ if(/\d/.test(el.value[pos])) cnt++; pos++; }
  try { el.setSelectionRange(pos,pos); } catch(e) {}
  gemTotalShards = digits ? Number(digits) : 0;
  el.title = (gemTotalShards>0 ? '= '+fmtUnits(gemTotalShards)+'\n' : '') + '최대 ' + fmtDigits(gemMaxTotalShards());
  try { localStorage.setItem(GEM_TOTAL_STORAGE_KEY, String(gemTotalShards)); } catch(e) {}
  updateRemainGems();
  scheduleRec4450();
}
function maxT4450(){ return gemMaxTotalShards(); }

function updateRemainGems(){

function recEvalN4450(gemMap, statLv, target){
  const keys = Object.keys(statLv), saved = {};
  keys.forEach(k=>{ saved[k] = statInvestments[k]; statInvestments[k] = statLv[k]; });
  try { return computeGemProduction4449(gemMap).N[target] || 0; }
  finally { keys.forEach(k=>{ if(saved[k]===undefined) delete statInvestments[k]; else statInvestments[k] = saved[k]; }); }
}
// 남은 무조(보석)·남은 스텟 포인트(스텟)를 각각 예산으로, "생산량 증가 ÷ 비용"이 가장 큰 항목부터 계속 사 나간다.
// 스텟과 보석은 서로 곱으로 얽혀 있어서 매 라운드 각 화폐의 최고 효율 항목을 함께 반영하고 다시 계산한다.
// 연산량을 줄이려고 살 수 있는 개수가 많으면 남은 수량의 약 10%씩 묶어서 사고, 끝에 가까워질수록 1개씩 산다.
function computeRec4450(){
  const tg = recTargetGem4450, ts = recTargetStat4450;
  let gb = gemTotalShards>0 ? gemTotalShards - gemSpentShards() : 0;
  let sb = charLevel*POINTS_PER_LEVEL - statSpentPoints();
  const gemCur = {}; GEM_OPTIONS.forEach(g=>{ gemCur[g.key] = Math.max(0, Math.floor(getGemInv(g.key))); });
  const statLv = {}, statOpt = {};
  STAT_ROWS_4450.forEach(([p,n])=>{ const k=`${p}_${n}`; statOpt[k] = STAT_OPTIONS.find(o=>o.page===p&&o.no===n); statLv[k] = Math.max(0, Math.floor(getStatInv(p,n))); });
  const gemCands = GEM_OPTIONS.filter(g=>!['expAdd','none'].includes(g.effect.type));
  const addG = {}, addS = {}, spendG = {}, spendS = {};
  const res = { addG, addS, spendG, spendS, gb, sb, tg, ts, ok: true };
  const evalN = (gm, sl)=>{
    const keys = Object.keys(sl), saved = {};
    keys.forEach(k=>{ saved[k] = statInvestments[k]; statInvestments[k] = sl[k]; });
    try { return computeGemProduction4449(gm).N; }
    finally { keys.forEach(k=>{ if(saved[k]===undefined) delete statInvestments[k]; else statInvestments[k] = saved[k]; }); }
  };
  let cur = evalN(gemCur, statLv);
  res.ok = (cur[tg]>0 || cur[ts]>0);
  if(!res.ok) return res;
  const t0 = performance.now();
  for(let it=0; it<400 && performance.now()-t0<600; it++){
    let bg = null, bs = null;
    if(gb>0) gemCands.forEach(g=>{
      const n = gemCur[g.key]; if(n>=g.max) return;
      const c = g.cost(n); if(!(c>0) || c>gb) return;
      const gain = evalN({...gemCur, [g.key]:n+1}, statLv)[tg] - cur[tg];
      if(gain>0){ const sc = gain/c; if(!bg || sc>bg.sc) bg = {g, n, sc}; }
    });
    if(sb>0) Object.keys(statOpt).forEach(k=>{
      const s = statOpt[k], n = statLv[k]; if(n>=s.max || s.cost>sb) return;
      const gain = evalN(gemCur, {...statLv, [k]:n+1})[ts] - cur[ts];
      if(gain>0){ const sc = gain/s.cost; if(!bs || sc>bs.sc) bs = {k, s, n, sc}; }
    });
    if(!bg && !bs) break;
    if(bg){
      let m = 0, tot = 0;
      for(let i=bg.n; i<bg.g.max; i++){ const c = bg.g.cost(i); if(tot+c>gb) break; tot += c; m++; }
      const q = Math.max(1, Math.floor(m/10));
      let spend = 0; for(let i=0;i<q;i++) spend += bg.g.cost(bg.n+i);
      gemCur[bg.g.key] += q; addG[bg.g.key] = (addG[bg.g.key]||0) + q; spendG[bg.g.key] = (spendG[bg.g.key]||0) + spend; gb -= spend;
    }
    if(bs){
      const m = Math.min(bs.s.max - bs.n, Math.floor(sb/bs.s.cost));
      const q = Math.max(1, Math.floor(m/10));
      statLv[bs.k] += q; addS[bs.k] = (addS[bs.k]||0) + q; spendS[bs.k] = (spendS[bs.k]||0) + q*bs.s.cost; sb -= q*bs.s.cost;
    }
    cur = evalN(gemCur, statLv);
  }
  res.gb = gb; res.sb = sb;
  return res;
}
function scheduleRec4450(){
  clearTimeout(recTimer4450);
  recTimer4450 = setTimeout(applyRec4450, 80);
}
function applyRec4450(){
  if(!document.getElementById('recTargetGem4450')) return;
  const r = computeRec4450();
  const setCell = (id, add, cost, unit)=>{
    const el = document.getElementById(id); if(!el) return;
    if(add>0){ el.textContent = '+'+add.toLocaleString(); el.title = `${add.toLocaleString()}${unit} 추가 · 비용 ${fmtUnits(cost)}`; }
    else { el.textContent = ''; el.title = ''; }
  };
  GEM_OPTIONS.forEach(g=>setCell('rec_g'+g.key, r.addG[g.key]||0, r.spendG[g.key]||0, '개'));
  STAT_ROWS_4450.forEach(([p,n])=>setCell(`rec_s${p}_${n}`, r.addS[`${p}_${n}`]||0, r.spendS[`${p}_${n}`]||0, 'Lv'));
  const note = document.getElementById('recNote'); if(!note) return;
  const gemUsed = Object.values(r.spendG).reduce((a,b)=>a+b,0), statUsed = Object.values(r.spendS).reduce((a,b)=>a+b,0);
  if(!r.ok){ note.textContent = '+추천: 선택한 추천 기준 단계의 시간당 생산량이 0이라 계산할 수 없습니다. 사냥터 유닛·스텟·보석 설정을 확인하세요.'; return; }
  const gemPart = gemTotalShards>0 ? `보석(${r.tg}강 기준) ${fmtUnits(gemUsed)} 사용 → 남는 무조 ${fmtUnits(Math.max(0,r.gb))}` : '총 무조를 입력하면 보석도 추천합니다';
  const statPart = `스텟(${r.ts}강 기준) ${statUsed.toLocaleString()}P 사용 → 남는 포인트 ${Math.round(r.sb).toLocaleString()}`;
  note.textContent = `+추천 (증가량 ÷ 비용 효율순): ${gemPart} / ${statPart}`;
}

  }
  let points=Math.floor(rawPoints);
  const statKeys=isEarly?EARLY_STAT_KEYS:LATE_STAT_KEYS;
  const compute= isEarly ? computeProductionN40Val : computeProductionN44;
  const blockedFn= isEarly ? null : computeN44BottleneckRaw;
  const overrides={};
  const allocated={};
  let currentValue=compute(overrides);
  let baselineBottleneck=blockedFn && currentValue<=0 ? blockedFn(overrides) : 0;
  const initialValue=currentValue;

  while(points>0){
    let best=null;
    for(const key of statKeys){
      const [page,no]=key.split('_').map(Number);
      const option=STAT_OPTIONS.find(s=>s.page===page && s.no===no);
      const invested=getStatInv(page,no)+(allocated[key]||0);
      if(!option || invested>=option.max || points<option.cost) continue;

      const candidateOverrides={...overrides,[`inv_${key}`]:invested+1};
      const nextValue=compute(candidateOverrides);
      const score=currentValue<=0 && blockedFn
        ? (blockedFn(candidateOverrides)-baselineBottleneck)/option.cost
        : currentValue>0
          ? ((nextValue-currentValue)/currentValue)/option.cost
          : nextValue>0 ? Infinity : 0;
      if(score>0 && (!best || score>best.score)){
        best={key,option,score};
      }
    }
    if(!best) break;

    const [page,no]=best.key.split('_').map(Number);
    const invested=getStatInv(page,no)+(allocated[best.key]||0);
    allocated[best.key]=(allocated[best.key]||0)+1;
    overrides[`inv_${best.key}`]=invested+1;
    points-=best.option.cost;
    currentValue=compute(overrides);
    baselineBottleneck=blockedFn && currentValue<=0 ? blockedFn(overrides) : 0;
  }

  const rows=statKeys.filter(key=>allocated[key]).map(key=>{
    const [page,no]=key.split('_').map(Number);
    const option=STAT_OPTIONS.find(s=>s.page===page && s.no===no);
    return `<div class="stat"><span>${option.name}</span><span>+${allocated[key]}Lv (${(allocated[key]*option.cost).toLocaleString()}P)</span></div>`;
  }).join('');
  const formatProduction=value=>value===0?'0':Math.abs(value)<0.01
    ? value.toExponential(3)
    : value.toLocaleString(undefined,{maximumFractionDigits:3});
  const change=initialValue>0
    ? `예상 생산량: ${formatProduction(initialValue)} → ${formatProduction(currentValue)} 개/시간 (${((currentValue/initialValue-1)*100).toFixed(2)}%)`
    : `예상 생산량: ${formatProduction(initialValue)} → ${formatProduction(currentValue)} 개/시간`;
  out.innerHTML=`<div class="stat" style="margin-top:8px"><b>추천 배분</b><span></span></div>${rows||'<p class="note" style="margin:6px 0">효과가 있는 투자를 찾지 못했습니다.</p>'}
    <div class="stat"><span>남는 포인트</span><span>${points.toLocaleString()}</span></div>
    <p class="note" style="margin:6px 0 0">${change}</p>
    ${points>0?'<p class="note" style="margin:4px 0 0">남은 포인트는 추가 생산 증가가 확인되지 않거나 해당 스텟 한도에 도달해 배정하지 않았습니다.</p>':''}`;
};

function calcHuntIncome() {
  const bossLv = maxBossLevel;
  const bBonus = getBossCumulativeBonus(bossLv);
  const statAtkUp = getStatInv(1,2);

  // 전체 공격력 배수 = (1 + 스텟공업*0.1) * (1 + 보스공격력%/100), 상한 없이 그대로 적용
  const totalAtkMult = getCappedAtkMult(statAtkUp, bBonus.atkPercent);

  // 25강 이하(LV.1 사냥터)와 26강 이상(LV.2 사냥터)은 DPS 풀과 돈 배수가 서로 독립적으로 계산됨
  let totalDpsLv1 = 0, totalDpsLv2 = 0, totalDpsMax = 0;
  huntUnitRows.forEach(row => {
    const uData = getHuntUnitData(row.lv);
    if (uData && row.count > 0) {
      const contribution = getUnitPracticalDps(uData) * row.count * totalAtkMult;
      if (row.lv <= 25) totalDpsLv1 += contribution;
      else if (row.lv <= 40) totalDpsLv2 += contribution;
      else totalDpsMax += contribution;
    }
  });
  // 고유유닛(레이스): Q·W·D 투자값을 그대로 반영 (공업·보스 공격력 배수 동일 적용, D 10회면 LV.2 DPS 풀에 합산)
  const uniq = getUniqueUnitHunt();
  const uniqDps = uniq.baseDps * totalAtkMult;
  if (uniq.zone === 2) totalDpsLv2 += uniqDps; else totalDpsLv1 += uniqDps;
  const totalDps = totalDpsLv1 + totalDpsLv2 + totalDpsMax;

  const infoLv1 = getDpsMultiplierInfo(totalDpsLv1);
  const infoLv2 = getDpsMultiplierInfoLv2(totalDpsLv2);
  const moneyStatMult = 1 + getStatInv(1,1) * 0.01; // 1P-1: 모든 사냥터 돈 수급 +1%/Lv
  const moneyLv1PerSec = totalDpsLv1 * infoLv1.mult * moneyStatMult * speedMult();
  const moneyLv2PerSec = totalDpsLv2 * infoLv2.mult * 100000 * moneyStatMult * speedMult(); // LV.2 사냥터 기본보상 ×10만
  const moneyMaxPerSec = totalDpsMax * 1e10 * moneyStatMult * speedMult(); // LV.MAX 사냥터: DPS 구간 배수 없이 DPS×100억
  const moneyEarnedPerSec = moneyLv1PerSec + moneyLv2PerSec + moneyMaxPerSec;

  const vendingAuto = autoClimbVending(moneyEarnedPerSec);
  lastVendingAuto = vendingAuto; // [3]에서 자판기 투입 강화단계·비율로 그대로 사용

  // 혼합가동 문구 (예: "2호기: 미구매 65.0% + 1강 35.0%", "2호기: 1강 65.0% + 7강 35.0%")
  const machineName = idx => idx===0 ? '1호기' : '2호기';
  const mixText = vendingAuto.mix
    ? `${machineName(vendingAuto.mix.idx)}: ${vendLvLabel(vendingAuto.mix.fromLv)} ${((1-vendingAuto.mix.toRatio)*100).toFixed(1)}% + ${vendLvLabel(vendingAuto.mix.toLv)} ${(vendingAuto.mix.toRatio*100).toFixed(1)}%`
    : null;

  const briefingEl = document.getElementById('autoBriefing');
  if (briefingEl) {
    let autoText = `<div style="font-weight:bold; color:var(--accent2); margin-bottom:4px;">⚡ 수급 현황 브리핑</div>`;
    autoText += `<div>• 적용 공격력 배수: <b>${totalAtkMult.toFixed(2)}배</b> (스텟공업 +${statAtkUp}, 보스공격력 +${bBonus.atkPercent}%)</div>`;
    autoText += `<div>• 고유유닛: 공격력 ${uniq.atk.toLocaleString()} / 쿨타임 ${uniq.frames}프레임 → DPS <b>${uniqDps.toLocaleString(undefined,{maximumFractionDigits:1})}</b> (사냥터 LV.${uniq.zone})</div>`;
    if (getStatInv(1,1) > 0) autoText += `<div>• 돈 수급 스텟(1P-1): <b>×${moneyStatMult.toFixed(2)}</b> (모든 사냥터)</div>`;
    if (totalDpsLv1 > 0) autoText += `<div>• LV.1(1~25강) 수급: <b>${moneyLv1PerSec.toLocaleString(undefined, {maximumFractionDigits:1})}</b> / 초 (${infoLv1.mult}배 배수)</div>`;
    if (totalDpsLv2 > 0) autoText += `<div>• LV.2(26~40강) 수급: <b>${moneyLv2PerSec.toLocaleString(undefined, {maximumFractionDigits:1})}</b> / 초 (${infoLv2.mult}배 배수 × 10만)</div>`;
    if (totalDpsMax > 0) autoText += `<div>• LV.MAX(41강+) 수급: <b>${moneyMaxPerSec.toLocaleString(undefined, {maximumFractionDigits:1})}</b> / 초 (DPS×100억, 배수 없음)</div>`;
    autoText += `<div>• 최종 수급: <b>${moneyEarnedPerSec.toLocaleString(undefined, {maximumFractionDigits:1})}</b> / 초</div>`;
    autoText += `<div>• 자판기 자동 배정: <b>1호기 ${vendLvLabel(vendingAuto.lvA)} / 2호기 ${vendLvLabel(vendingAuto.lvB)}</b>${vendingAuto.mix ? ` <span style="color:var(--accent2)">(다음 단계 일부 혼합 가동)</span>` : ''}</div>`;
    if (mixText) {
      autoText += `<div style="color:var(--accent2)">• 잔여 예산 혼합 가동 비율: <b>${mixText}</b> (예산을 100% 소진하는 만큼만 다음 단계/구매 반영, 0강 구간 포함)</div>`;
    }
    if (moneyEarnedPerSec === 0) {
      autoText += `<div style="color:var(--sub)">• 수급이 0이라 자판기를 아직 구매할 수 없습니다 (전부 미구매).</div>`;
    }
    briefingEl.innerHTML = autoText;
  }

  const totalCostPerSec = vendingAuto.actualCost;

  const vendingAutoEl = document.getElementById('outVendingAuto');
  if (vendingAutoEl) {
    const priceLabel = lv => lv>0 ? `${lv}강 (${UNIT_BUY_PRICE[lv].toLocaleString()})` : '미구매';
    let line1, line2;
    if (vendingAuto.mix) {
      const m = vendingAuto.mix;
      const mixedLine = `${priceLabel(m.fromLv)} ${((1-m.toRatio)*100).toFixed(1)}% + ${priceLabel(m.toLv)} ${(m.toRatio*100).toFixed(1)}% <span style="color:var(--accent2)">(혼합)</span>`;
      if (m.idx === 0) { line1 = mixedLine; line2 = priceLabel(vendingAuto.lvB); }
      else { line1 = priceLabel(vendingAuto.lvA); line2 = mixedLine; }
    } else {
      line1 = priceLabel(vendingAuto.lvA);
      line2 = priceLabel(vendingAuto.lvB);
    }
    vendingAutoEl.innerHTML = `
      <div class="stat"><span>1호기</span><span><b>${line1}</b></span></div>
      <div class="stat" style="border-bottom:none"><span>2호기</span><span><b>${line2}</b></span></div>
    `;
  }

  // 자판기 유지 비율 = 골드 획득량 / 자판기 구매 가격
  const maintainRatio = totalCostPerSec > 0 ? (moneyEarnedPerSec / totalCostPerSec) * 100 : null;
  const netIncomePerSec = moneyEarnedPerSec - totalCostPerSec;

  const out = document.getElementById('outHuntIncome');
  if (!out) return;

  out.innerHTML = `
    <div class="stat"><span>총 실측 DPS (LV1+LV2+MAX)</span><span><b>${totalDps.toLocaleString(undefined, {maximumFractionDigits:1})}</b></span></div>
    ${totalDpsLv1 > 0 ? `<div class="stat"><span>LV.1 DPS / 배수 (다음:${infoLv1.next.toLocaleString()})</span><span>${totalDpsLv1.toLocaleString(undefined,{maximumFractionDigits:1})} / <b>${infoLv1.mult}배</b></span></div>` : ''}
    ${totalDpsLv2 > 0 ? `<div class="stat"><span>LV.2 DPS / 배수 (다음:${infoLv2.next.toLocaleString()})</span><span>${totalDpsLv2.toLocaleString(undefined,{maximumFractionDigits:1})} / <b>${infoLv2.mult}배</b> ×10만</span></div>` : ''}
    ${totalDpsMax > 0 ? `<div class="stat"><span>LV.MAX DPS (배수 없음, ×100억)</span><span>${totalDpsMax.toLocaleString(undefined,{maximumFractionDigits:1})}</span></div>` : ''}
    <div class="stat" style="color:var(--accent)"><span>골드 수급량</span><span><b>${moneyEarnedPerSec.toLocaleString(undefined, {maximumFractionDigits:1})} / 초</b></span></div>
    <div class="stat"><span>자판기 소모</span><span>${totalCostPerSec.toLocaleString()} / 초</span></div>
    <div class="stat"><span>자판기 유지 비율 (골드÷자판기가격)</span><span>${maintainRatio===null ? '-' : maintainRatio.toFixed(1)+'%'}</span></div>
    <div class="stat" style="font-size:1rem; border-top:1px solid var(--border); padding-top:8px;">
      <span><b>초당 순수익</b></span>
      <span style="color:${netIncomePerSec < 0 ? 'var(--danger)' : 'var(--accent)'}"><b>${netIncomePerSec >= 0 ? '+' : ''}${netIncomePerSec.toLocaleString(undefined, {maximumFractionDigits:1})} / 초</b></span>
    </div>
  `;

  // 자판기 자동 배정이 바뀔 수 있으므로 [3] 표도 함께 갱신
  updateEnhance1to40();
};

// ---- [2] 57~59강 정보 (퀘이사/오리진 크리스탈) 탭 ----
// 57강/58강은 46~48강과 달리 "파괴방지 재귀식"을 거치지 않고 원확률=유효확률입니다(DPS계산기.xlsx H41=I41, H42=I42).

const ORIGIN_CRYSTALS = [
  { key:'changjo', name:'창조의 크리스탈', effects:[

      '최종 유닛 생산량 +10%/Lv (증식과 합연산)',

];
let quasarLevels = {};
let originLevels = {};

function updateQuasar5759(){
  const stat57 = Math.max(0, Math.min(100, parseFloat(document.getElementById('stat57lv')?.value) || 0));
  const stat58 = Math.max(0, Math.min(100, parseFloat(document.getElementById('stat58lv')?.value) || 0));
  const orb57 = parseFloat(document.getElementById('orbSpecial57')?.value) || 0;
  const orb58 = parseFloat(document.getElementById('orbPremium58')?.value) || 0;
  const cap = (id, mx) => Math.max(0, Math.min(mx, parseFloat(document.getElementById(id)?.value) || 0));
  const orbSeongun = cap('orbSeongun57', 2000), orbCheonun = cap('orbCheonun58', 2000), orbMuwi = cap('orbMuwi59', 100);
  const multiBonus = 0.5;
  const pamyulLv = getOriginLv('pamyul');
  const pamyulBonus = pamyulLv * 1; // 57~58강 +1%p/Lv

  const raw57 = 0.5 + stat57*0.1 + orb57*0.02 + orbSeongun*0.02 + pamyulBonus + multiBonus;
  const raw58 = 0.1 + stat58*0.1 + orb58*0.01 + orbCheonun*0.02 + pamyulBonus + multiBonus;
  const raw59 = 0.005 + orbMuwi*0.001;

  const nextCost57 = gemNextCost('orb_special', orb57);
  const nextCost58 = gemNextCost('orb_premium', orb58);

  const outProb = document.getElementById('outQuasarProb');
  if(outProb){
    outProb.innerHTML = `
      <div class="stat"><span>57강 확률 (원확률=유효확률)</span><span><b>${raw57.toFixed(2)}%</b></span></div>
      <div class="stat"><span>58강 확률 (원확률=유효확률)</span><span><b>${raw58.toFixed(2)}%</b></span></div>
      <div class="stat"><span>59강 확률 (기본 0.005% + 무위의 보주)</span><span><b>${raw59.toFixed(3)}%</b></span></div>
      <div class="stat"><span>특급 보주 다음 1개 비용</span><span>${Math.round(nextCost57).toLocaleString()} 응축무색조각</span></div>
      <div class="stat" style="border-bottom:none"><span>고급 보주 다음 1개 비용</span><span>${Math.round(nextCost58).toLocaleString()} 응축무색조각</span></div>
    `;
  }
}
